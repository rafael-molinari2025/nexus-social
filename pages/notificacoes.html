<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CYDS5B5TN5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CYDS5B5TN5');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações — Nexus</title>
  <meta name="description" content="Suas notificações no Nexus.">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    .notif-page { max-width: 640px; margin: 0 auto; padding: 1.5rem .75rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .page-title { font-size: 20px; font-weight: 600; }
    .notif-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .notif-full-item {
      display: flex; align-items: flex-start; gap: .875rem;
      padding: 1rem 1.25rem; border-bottom: 0.5px solid var(--border);
      cursor: pointer; transition: background var(--transition);
      position: relative;
    }
    .notif-full-item:last-child { border-bottom: none; }
    .notif-full-item:hover { background: var(--gray-50); }
    .notif-full-item.unread { background: var(--purple-50); }
    .notif-full-item.unread::before {
      content: ''; position: absolute; left: .5rem; top: 50%;
      transform: translateY(-50%); width: 6px; height: 6px;
      background: var(--purple-600); border-radius: 50%;
    }
    .notif-full-icon {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 20px;
    }
    .notif-full-body { flex: 1; min-width: 0; }
    .notif-full-msg { font-size: 14px; line-height: 1.5; }
    .notif-full-msg strong { font-weight: 600; }
    .notif-full-time { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .notif-filter { display: flex; gap: .4rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .notif-filter-btn {
      padding: .45rem .85rem; border: 0.5px solid var(--border-md);
      border-radius: var(--radius-full); background: none;
      font-size: 12px; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all var(--transition); min-height: 36px;
    }
    .notif-filter-btn.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }
    @media (max-width: 768px) {
      .notif-page { padding: 1rem .5rem calc(80px + 1rem); }
      .page-header { flex-wrap: wrap; gap: .5rem; }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="notif-page">
    <div class="page-header">
      <h1 class="page-title">Notificações</h1>
      <button class="btn btn-sm" id="mark-all-btn" onclick="markAllRead()">
        <i class="ti ti-checks" aria-hidden="true"></i> Marcar tudo como lido
      </button>
    </div>

    <div class="notif-filter" id="notif-filter">
      <button class="notif-filter-btn active" onclick="filterNotifs('all', this)">Todas</button>
      <button class="notif-filter-btn" onclick="filterNotifs('mention', this)">Menções</button>
      <button class="notif-filter-btn" onclick="filterNotifs('friend_request', this)">Amizades</button>
      <button class="notif-filter-btn" onclick="filterNotifs('post_like', this)">Curtidas</button>
      <button class="notif-filter-btn" onclick="filterNotifs('post_comment', this)">Comentários</button>
      <button class="notif-filter-btn" onclick="filterNotifs('scrap', this)">Recados</button>
    </div>

    <div class="notif-card" id="notif-list">
      <div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser    = null;
let allNotifs      = [];
let currentFilter  = 'all';
let _lastNotifDoc  = null;
const NOTIF_PAGE   = 30;

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'notifications');
  loadNotifs();
});

function notifLink(n) {
  if (n.link) return n.link;
  switch (n.type) {
    case 'post_like':
    case 'post_comment':
    case 'post_reaction': return n.postId ? `post.html?id=${n.postId}` : '#';
    case 'friend_request':
    case 'friend_accept':  return 'amigos.html';
    case 'scrap':          return n.fromUid ? `perfil.html?uid=${n.fromUid}` : 'recados.html';
    case 'message':        return 'mensagens.html';
    case 'mention':        return n.link || (n.postId ? `post.html?id=${n.postId}` : '#');
    default:               return n.link || '#';
  }
}

async function loadNotifs(reset = true) {
  const el = document.getElementById('notif-list');
  if (reset) {
    _lastNotifDoc = null;
    allNotifs = [];
    el.innerHTML = '<div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>';
  }
  try {
    let query = db.collection('notifications').doc(currentUser.uid)
      .collection('items')
      .orderBy('createdAt', 'desc')
      .limit(NOTIF_PAGE);
    if (_lastNotifDoc) query = query.startAfter(_lastNotifDoc);
    const snap = await query.get();
    if (snap.docs.length) _lastNotifDoc = snap.docs[snap.docs.length - 1];
    const newNotifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allNotifs = reset ? newNotifs : [...allNotifs, ...newNotifs];
    renderNotifs(snap.docs.length === NOTIF_PAGE);
    if (reset) markAllNotificationsRead(currentUser.uid).catch(() => {});
  } catch(e) {
    el.innerHTML = `<div class="empty-state" style="padding:3rem"><i class="ti ti-alert-circle"></i><p>Erro ao carregar notificações.</p></div>`;
  }
}

async function loadMoreNotifs() {
  if (!_lastNotifDoc) return;
  const btn = document.getElementById('notif-load-more');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Carregando…'; }
  await loadNotifs(false);
}


function renderNotifs(hasMore = false) {
  const el = document.getElementById('notif-list');
  const filtered = currentFilter === 'all'
    ? allNotifs
    : allNotifs.filter(n => n.type === currentFilter);

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state" style="padding:3rem 1rem">
      <i class="ti ti-bell-off" style="font-size:40px;color:var(--gray-200)"></i>
      <p>${currentFilter === 'all' ? 'Nenhuma notificação ainda.' : 'Nenhuma notificação nesta categoria.'}</p>
    </div>`;
    return;
  }

  const grouped = groupNotifications(filtered);
  const items = grouped.map(n => {
    const ic   = notifIcon(n.type);
    const href = notifLink(n);
    const msg  = sanitize(n.message || '');
    return `<div class="notif-full-item${n.read ? '' : ' unread'}" onclick="location.href='${href}'">
        <div class="notif-full-icon" style="background:${ic.bg}">
          <i class="ti ${ic.icon}" style="color:${ic.color}"></i>
        </div>
        <div class="notif-full-body">
          <div class="notif-full-msg">${msg}</div>
          <div class="notif-full-time">${timeAgo(n.createdAt)}</div>
        </div>
      </div>`;
  }).join('');

  const loadMoreBtn = hasMore
    ? `<div style="padding:.75rem;text-align:center">
         <button id="notif-load-more" class="btn btn-sm" onclick="loadMoreNotifs()" style="width:100%">
           <i class="ti ti-refresh"></i> Ver mais
         </button>
       </div>` : '';

  el.innerHTML = items + loadMoreBtn;
}

function filterNotifs(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.notif-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNotifs(_lastNotifDoc !== null);
}

async function markAllRead() {
  try {
    await markAllNotificationsRead(currentUser.uid);
    allNotifs = allNotifs.map(n => ({ ...n, read: true }));
    renderNotifs(_lastNotifDoc !== null);
    showToast('Tudo marcado como lido!');
  } catch(e) {
    showToast('Erro ao marcar notificações.');
  }
}
</script>
</body>
</html>
