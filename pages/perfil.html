<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Perfil</title>
  <meta name="description" content="Veja o perfil de um usuário no Nexus.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
  <style>
    .profile-page { max-width: 760px; margin: 0 auto; padding: 1.5rem .75rem; }
    .profile-cover {
      height: 200px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 55%, #A855F7 100%);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      position: relative;
    }
    .profile-cover-edit { position: absolute; bottom:.75rem; right:.75rem; }
    .profile-info-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 0 1.5rem 1.5rem;
      margin-bottom: 1rem;
      overflow: visible;
    }
    .profile-info-top {
      display: flex; align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 0.5px solid var(--border);
    }
    .profile-avatar-area {
      margin-top: -40px;
      position: relative;
      z-index: 2;
      display: inline-block;
    }
    .avatar-upload-btn {
      position: absolute; bottom: 2px; right: 2px;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--purple-600); color: #fff;
      border: 2.5px solid var(--surface);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0; transition: background var(--transition);
    }
    .avatar-upload-btn:hover { background: var(--purple-700, #4338ca); }
    .avatar-upload-btn i { font-size: 12px; }
    .profile-fullname { font-size: 20px; font-weight: 600; margin-top: .5rem; }
    .profile-location { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: .3rem; margin-top: .25rem; }
    .profile-bio-text { font-size: 14px; color: var(--text-secondary); margin-top: .65rem; line-height: 1.55; }
    .profile-tabs { display: flex; gap: 0; border-bottom: 0.5px solid var(--border); margin-bottom: 1rem; }
    .profile-tab {
      padding: .75rem 1.25rem; background: none; border: none;
      font-size: 14px; font-weight: 500; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -0.5px;
      cursor: pointer; font-family: var(--font-sans);
      transition: all var(--transition);
    }
    .profile-tab.active { color: var(--purple-600); border-bottom-color: var(--purple-600); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .friends-big-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; }
    .friend-big-item {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: .75rem;
      display: flex; flex-direction: column; align-items: center;
      gap: .4rem; cursor: pointer; transition: box-shadow var(--transition);
    }
    .friend-big-item:hover { box-shadow: var(--shadow-sm); }
    .friend-big-name { font-size: 12px; font-weight: 500; text-align: center; }
    .photos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .photos-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-sm); cursor: pointer; transition: opacity var(--transition); }
    .photos-grid img:hover { opacity: .85; }
    .edit-modal-form { display: flex; flex-direction: column; gap: .85rem; }
    /* Modal mais largo no desktop */
    .modal { max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .fields-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
    .gender-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
    .gender-btn {
      padding: .5rem .4rem; border: 1.5px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); font-size: 12px; font-weight: 500;
      color: var(--text-secondary); cursor: pointer; text-align: center;
      transition: all var(--transition); font-family: var(--font-sans);
    }
    .gender-btn:hover { border-color: var(--purple-400); color: var(--purple-600); }
    .gender-btn.selected { border-color: var(--indigo-500); background: var(--indigo-50); color: var(--indigo-500); }
    .section-divider {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted);
      padding: .25rem 0; border-bottom: 1px solid var(--border); margin-bottom: -.25rem;
    }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .form-input { padding-left: 2.4rem; }
    .input-icon-wrap .input-icon {
      position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 15px; pointer-events: none;
    }
    /* Emoji picker rápido */
    .emoji-quick-grid {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: .5rem;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: .5rem;
    }
    .emoji-quick-btn {
      font-size: 20px; padding: .25rem; border: none; background: none;
      cursor: pointer; border-radius: 6px; transition: background var(--transition);
      line-height: 1;
    }
    .emoji-quick-btn:hover { background: var(--gray-100); }
    /* Sobrescreve o bottom-sheet global para o edit modal — sempre centralizado */
    @media (max-width: 768px) {
      .profile-page { padding: 1rem .5rem calc(80px + 1rem); }
      .profile-cover { height: 130px; }
      .friends-big-grid { grid-template-columns: repeat(3, 1fr); }
      .profile-info-top { flex-direction: column; align-items: flex-start; gap: .75rem; }
      .fields-row-2 { grid-template-columns: 1fr; }
      .profile-fullname { font-size: 18px; }
      .profile-info-card { padding: 0 1rem 1.25rem; }
      .profile-tab { padding: .65rem .85rem; font-size: 13px; }
      /* Edit modal: modal centralizado mesmo no mobile */
      #edit-modal {
        align-items: center !important;
        padding: .5rem !important;
      }
      #edit-modal .modal {
        border-radius: var(--radius-xl) !important;
        max-width: 100% !important;
        max-height: 92vh !important;
        transform: scale(.97) translateY(10px) !important;
      }
      #edit-modal.open .modal {
        transform: scale(1) translateY(0) !important;
      }
    }
    @media (max-width: 380px) {
      .friends-big-grid { grid-template-columns: repeat(2, 1fr); }
      .profile-avatar-area { margin-top: -32px; }
      .gender-grid { grid-template-columns: 1fr 1fr; }
    }
    .report-opt {
      width: 100%; text-align: left; padding: .6rem .85rem;
      border: 0.5px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); font-size: 13px; color: var(--text-secondary);
      cursor: pointer; font-family: var(--font-sans);
      transition: background var(--transition), color var(--transition);
    }
    .report-opt:hover { background: var(--gray-50, #fafafa); color: var(--text-primary); }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="profile-page" id="profile-page">
    <div class="loading-screen"><div class="spinner"></div></div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Editar perfil</span>
      <button class="btn btn-icon" onclick="closeModal()" aria-label="Fechar"
              style="font-size:20px;font-weight:300;line-height:1;flex-shrink:0">&times;</button>
    </div>
    <div class="edit-modal-form">

      <div class="section-divider">Informações básicas</div>

      <div class="fields-row-2">
        <div class="form-group">
          <label class="form-label">Nome</label>
          <input class="form-input" type="text" id="edit-firstname" placeholder="Rafael">
        </div>
        <div class="form-group">
          <label class="form-label">Sobrenome</label>
          <input class="form-input" type="text" id="edit-lastname" placeholder="Molinari">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Nome de usuário</label>
        <div class="input-icon-wrap">
          <span class="input-icon" style="font-family:monospace;font-weight:600;font-size:16px">@</span>
          <input class="form-input" type="text" id="edit-username" placeholder="rafamolinari"
                 oninput="this.value=this.value.replace(/[^a-z0-9_.]/gi,'').toLowerCase()">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea class="form-input" id="edit-bio" placeholder="Uma frase sobre você" rows="3"
                  style="resize:vertical;min-height:72px"></textarea>
      </div>

      <div class="section-divider">Informações pessoais</div>

      <div class="fields-row-2">
        <div class="form-group">
          <label class="form-label">Data de nascimento</label>
          <input class="form-input" type="date" id="edit-birthdate">
        </div>
        <div class="form-group">
          <label class="form-label">Cidade</label>
          <input class="form-input" type="text" id="edit-city" placeholder="São Paulo, SP">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Gênero</label>
        <div class="gender-grid">
          <button type="button" class="gender-btn" id="eg-masculino" onclick="selectEditGender('Masculino')">&#9794; Masculino</button>
          <button type="button" class="gender-btn" id="eg-feminino" onclick="selectEditGender('Feminino')">&#9792; Feminino</button>
          <button type="button" class="gender-btn" id="eg-outro" onclick="selectEditGender('Outro')">&#9895; Outro</button>
        </div>
      </div>

      <div class="section-divider">Links</div>

      <div class="form-group">
        <label class="form-label">Website / Redes sociais</label>
        <input class="form-input" type="url" id="edit-website" placeholder="https://seusite.com">
      </div>

      <div class="section-divider">Status</div>

      <div class="form-group">
        <label class="form-label">Status atual <span style="font-size:11px;color:var(--text-muted);font-weight:400">(emoji + texto)</span></label>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button type="button" id="emoji-pick-btn" onclick="toggleEmojiPicker()"
                  title="Escolher emoji"
                  style="min-width:46px;height:42px;font-size:22px;background:var(--gray-50);border:0.5px solid var(--border);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color var(--transition)"
                  onmouseover="this.style.borderColor='var(--purple-400)'" onmouseout="this.style.borderColor='var(--border)'">
            <span id="emoji-display">😊</span>
          </button>
          <input class="form-input" type="text" id="edit-status-text" placeholder="Ex: Disponível, Trabalhando…" maxlength="60" style="flex:1">
        </div>
        <input type="hidden" id="edit-status-emoji" value="😊">
        <div id="emoji-quick-grid" class="emoji-quick-grid" style="display:none">
          <!-- preenchido pelo JS -->
        </div>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;height:44px;border-radius:var(--radius-md);font-size:15px" onclick="saveProfile()">
        Salvar alterações
      </button>
    </div>
  </div>
</div>

<!-- Report user modal -->
<div class="modal-overlay" id="user-report-modal"
     onclick="if(event.target===this)closeUserReportModal()">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <span class="modal-title">Denunciar usuário</span>
      <button class="btn btn-icon" onclick="closeUserReportModal()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:.75rem">Por que você está denunciando este usuário?</p>
    <div style="display:flex;flex-direction:column;gap:.4rem">
      <button class="report-opt" onclick="submitUserReport('Spam ou conta falsa')">Spam ou conta falsa</button>
      <button class="report-opt" onclick="submitUserReport('Comportamento abusivo')">Comportamento abusivo</button>
      <button class="report-opt" onclick="submitUserReport('Conteúdo impróprio')">Conteúdo impróprio</button>
      <button class="report-opt" onclick="submitUserReport('Assédio ou bullying')">Assédio ou bullying</button>
      <button class="report-opt" onclick="submitUserReport('Outro')">Outro</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<!-- Hidden file input for avatar upload -->
<input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
<script src="../js/utils.js"></script>
<script>
const params = new URLSearchParams(location.search);
const profileUid = params.get('uid');
let currentUser = null;
let profileData = null;

requireAuth(async user => {
  currentUser = user;
  const uid = profileUid || user.uid;
  profileData = await getUserData(uid) || { uid, displayName: user.displayName, email: user.email };
  renderTopbar(await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName }, 'profile');
  renderProfile(uid);
});

function profileCompletenessHTML(d) {
  const fields = [
    { key: 'photoURL',   label: 'Foto de perfil' },
    { key: 'coverURL',   label: 'Foto de capa' },
    { key: 'bio',        label: 'Bio' },
    { key: 'city',       label: 'Cidade' },
    { key: 'gender',     label: 'Gênero' },
    { key: 'birthdate',  label: 'Data de nascimento' },
    { key: 'website',    label: 'Website' },
    { key: 'username',   label: 'Nome de usuário' },
  ];
  const filled = fields.filter(f => d[f.key]).length;
  const pct = Math.round((filled / fields.length) * 100);
  if (pct === 100) return '';
  const missing = fields.filter(f => !d[f.key]).map(f => f.label);
  const color = pct < 50 ? 'var(--coral-400)' : pct < 80 ? '#f59e0b' : 'var(--green-500, #22c55e)';
  return `<div style="margin-top:.75rem;padding:.7rem .9rem;background:var(--gray-50);border-radius:var(--radius-md);border:0.5px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">
      <span style="font-size:12px;font-weight:600;color:var(--text-secondary)">Completude do perfil</span>
      <span style="font-size:12px;font-weight:700;color:${color}">${pct}%</span>
    </div>
    <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width .4s"></div>
    </div>
    <div style="margin-top:.5rem;font-size:11px;color:var(--text-muted)">
      Faltando: ${missing.slice(0,3).join(', ')}${missing.length > 3 ? ` e mais ${missing.length - 3}` : ''}.
      <a href="#" onclick="event.preventDefault();openModal()" style="color:var(--purple-600);font-weight:500">Completar →</a>
    </div>
  </div>`;
}

async function renderProfile(uid) {
  const isOwn = currentUser.uid === uid;
  const d = profileData;
  const cl = getAvatarColor(uid);
  const av = d.photoURL
    ? `<img src="${d.photoURL}" alt="${d.displayName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : `<span style="color:${cl.color}">${getInitials(d.displayName)}</span>`;

  let isFriend = false, hasPendingRequest = false, isBlocked = false, mutualCount = 0;
  if (!isOwn) {
    const [fSnap, myData, theirFSnap] = await Promise.all([
      db.collection('friendships').where('users', 'array-contains', currentUser.uid).get(),
      getUserData(currentUser.uid),
      db.collection('friendships').where('users', 'array-contains', uid).get()
    ]);
    isFriend = fSnap.docs.some(doc => doc.data().users.includes(uid));
    isBlocked = (myData?.blocked || []).includes(uid);
    if (!isFriend && !isBlocked) {
      const rSnap = await db.collection('friend_requests').where('from', '==', currentUser.uid).where('to', '==', uid).get();
      hasPendingRequest = !rSnap.empty;
    }
    const myFriendUids    = new Set(fSnap.docs.flatMap(d => d.data().users).filter(u => u !== currentUser.uid));
    const theirFriendUids = new Set(theirFSnap.docs.flatMap(d => d.data().users).filter(u => u !== uid));
    const mutualUids = [...myFriendUids].filter(u => theirFriendUids.has(u));
    mutualCount = mutualUids.length;
    window._mutualFriendUids = mutualUids;
  }

  const blockBtn = isOwn ? '' :
    `<button class="btn" id="block-btn" onclick="toggleBlock('${uid}', this)" title="${isBlocked ? 'Desbloquear' : 'Bloquear'}" style="padding:.4rem .6rem;${isBlocked ? 'color:var(--coral-400);border-color:var(--coral-400)' : ''}">
       <i class="ti ti-${isBlocked ? 'lock-open' : 'ban'}" aria-hidden="true"></i>
     </button>`;

  const reportBtn = isOwn ? '' :
    `<button class="btn" onclick="openUserReportModal('${uid}')" title="Denunciar usuário" style="padding:.4rem .6rem">
       <i class="ti ti-flag" aria-hidden="true"></i>
     </button>`;

  const shareBtn = `<button class="btn btn-icon" onclick="shareProfile('${uid}')" title="Compartilhar perfil" style="flex-shrink:0"><i class="ti ti-share-3" aria-hidden="true"></i></button>`;

  const actionBtn = isOwn
    ? `<div style="display:flex;gap:.5rem;flex-wrap:wrap">
         <button class="btn" onclick="openModal()"><i class="ti ti-pencil" aria-hidden="true"></i> Editar perfil</button>
         <button class="btn btn-danger" onclick="handleSignOut()" style="gap:.4rem"><i class="ti ti-logout" aria-hidden="true"></i> Sair</button>
         ${shareBtn}
       </div>`
    : isBlocked
      ? `<div style="display:flex;gap:.5rem;align-items:center">
           <span style="font-size:13px;color:var(--text-muted)">Usuário bloqueado</span>
           ${blockBtn}
         </div>`
      : isFriend
        ? `<div style="display:flex;gap:.5rem;flex-wrap:wrap">
             <button class="btn btn-primary" onclick="location.href='mensagens.html?with=${uid}'"><i class="ti ti-message-circle-2" aria-hidden="true"></i> Mensagem</button>
             <button class="btn" disabled><i class="ti ti-check" aria-hidden="true"></i> Amigos</button>
             ${blockBtn}${reportBtn}${shareBtn}
           </div>`
        : hasPendingRequest
          ? `<div style="display:flex;gap:.5rem">${blockBtn}${reportBtn}${shareBtn}<button class="btn" disabled>Solicitação enviada</button></div>`
          : `<div style="display:flex;gap:.5rem;flex-wrap:wrap">
               <button class="btn btn-primary" onclick="location.href='mensagens.html?with=${uid}'"><i class="ti ti-message-circle-2" aria-hidden="true"></i> Mensagem</button>
               <button class="btn" onclick="sendFriendRequest('${uid}', this)"><i class="ti ti-user-plus" aria-hidden="true"></i> Adicionar</button>
               ${blockBtn}${reportBtn}${shareBtn}
             </div>`;

  const coverStyle = d.coverURL
    ? `background-image:url('${d.coverURL}');background-size:cover;background-position:center;`
    : '';

  document.getElementById('profile-page').innerHTML = `
    <div class="profile-cover" style="${coverStyle}">
      ${isOwn ? `<button class="btn profile-cover-edit" style="background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.3)" onclick="document.getElementById('cover-input').click()">
        <i class="ti ti-camera" aria-hidden="true"></i> Capa
      </button>` : ''}
    </div>
    ${isOwn ? '<input type="file" id="cover-input" accept="image/*" style="display:none" onchange="uploadCover(this)">' : ''}
    <div class="profile-info-card">
      <div class="profile-info-top">
        <div class="profile-avatar-area">
          <div class="avatar avatar-96" style="background:${cl.bg};border:4px solid var(--surface)">${av}</div>
          ${isOwn ? `<button class="avatar-upload-btn" onclick="document.getElementById('avatar-input').click()" title="Alterar foto">
            <i class="ti ti-camera"></i>
          </button>` : ''}
        </div>
        <div style="display:flex;gap:.5rem;padding-top:.5rem">${actionBtn}</div>
      </div>
      <div class="profile-fullname">${sanitize(d.displayName || 'Usuário')}${d.isVerified ? '<span class="verified-badge" title="Conta verificada"><i class="ti ti-check" style="font-size:8px"></i></span>' : ''}</div>
      ${d.status && (d.status.emoji || d.status.text) ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:.2rem">${sanitize(d.status.emoji||'')} ${sanitize(d.status.text||'')}</div>` : ''}
      ${!isOwn && mutualCount > 0 ? `<div style="font-size:12px;color:var(--text-muted);margin-top:.2rem;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem" onclick="showMutualFriendsModal()" title="Ver amigos em comum"><i class="ti ti-users" aria-hidden="true"></i> ${mutualCount} amigo${mutualCount!==1?'s':''} em comum <i class="ti ti-chevron-right" style="font-size:10px"></i></div>` : ''}
      ${d.city ? `<div class="profile-location"><i class="ti ti-map-pin" aria-hidden="true"></i>${sanitize(d.city)}</div>` : ''}
      ${d.website ? `<div class="profile-location"><i class="ti ti-world" aria-hidden="true"></i><a href="${sanitize(d.website)}" target="_blank" rel="noopener noreferrer" style="color:var(--purple-600);text-decoration:none" onclick="event.stopPropagation()">${sanitize(d.website.replace(/^https?:\/\//,''))}</a></div>` : ''}
      ${d.bio  ? `<div class="profile-bio-text">${sanitize(d.bio)}</div>` : ''}
      ${isOwn ? profileCompletenessHTML(d) : ''}
      <div class="profile-stats" style="margin-top:.75rem" id="pstats">
        <div class="profile-stat"><span class="profile-stat-num">—</span><span class="profile-stat-label">amigos</span></div>
        <div class="profile-stat"><span class="profile-stat-num">—</span><span class="profile-stat-label">comunidades</span></div>
        <div class="profile-stat"><span class="profile-stat-num">—</span><span class="profile-stat-label">posts</span></div>
      </div>
      ${isOwn ? '<div id="profile-viewers-section"></div>' : ''}
    </div>

    <!-- Story Highlights -->
    <div class="card" style="padding:0" id="highlights-card">
      <div class="highlights-row" id="highlights-row">

  if (isOwn) {

    document.getElementById('edit-lastname').value  = parts.slice(1).join(' ') || '';

    document.getElementById('edit-bio').value       = d.bio       || '';

    if (disp) disp.textContent = savedEmoji;
    if (d.gender) selectEditGender(d.gender);
  }
}

const _tabs = ['posts','fotos','friends','communities','scraps','depoimentos'];
function switchTab(tab) {
  document.querySelectorAll('.profile-tab').forEach((b,i) => {
    b.classList.toggle('active', _tabs[i] === tab);
  });
  _tabs.forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  const uid = profileUid || currentUser.uid;
  if (tab === 'fotos')        loadGallery(uid);
  if (tab === 'friends')      loadProfileFriends(uid);
  if (tab === 'communities')  loadProfileCommunities(uid);
  if (tab === 'scraps')       loadScraps(uid);
  if (tab === 'depoimentos')  loadDepoimentos(uid);
}

async function loadGallery(uid) {
  const el = document.getElementById('tab-fotos');
  const isOwn = currentUser && currentUser.uid === uid;
  el.innerHTML = '<div class="loading-screen" style="min-height:120px"><div class="spinner"></div></div>';
  try {
    // Busca na coleção photos (uploads diretos) + posts com imagem
    const [photosSnap, postsSnap] = await Promise.all([
      db.collection('photos').where('uid','==',uid).get().catch(() => ({ docs: [] })),
      db.collection('posts').where('authorId','==',uid).get()
    ]);

    const fromGallery = photosSnap.docs.map(d => ({ id: d.id, url: d.data().imageURL, src: 'gallery' }));
    const fromPosts   = postsSnap.docs
      .filter(d => d.data().imageURL)
      .map(d => ({ id: d.id, url: d.data().imageURL, src: 'post' }));

    // Combina, remove duplicatas por URL
    const seen = new Set();
    const all = [...fromGallery, ...fromPosts].filter(p => {
      if (!p.url || seen.has(p.url)) return false;
      seen.add(p.url); return true;
    });

    const btnUpload = isOwn
      ? `<a href="galeria.html" class="btn btn-sm btn-primary" style="margin-bottom:1rem;display:inline-flex;align-items:center;gap:.35rem">
           <i class="ti ti-photo-plus" aria-hidden="true"></i> Gerenciar galeria
         </a>`
      : '';

    if (!all.length) {
      el.innerHTML = btnUpload + `<div class="empty-state"><i class="ti ti-photo-off" aria-hidden="true"></i><p>Nenhuma foto ainda.</p></div>`;
      return;
    }

    const srcs = all.map(p => p.url);
    el.innerHTML = btnUpload + `<div class="photos-grid" id="profile-photos-grid">
      ${all.map((p, i) => `
        <div class="photos-grid-item" data-idx="${i}">
          <img src="${sanitize(p.url)}" alt="Foto" loading="lazy" onerror="this.closest('.photos-grid-item').remove()">
          <div class="photos-grid-overlay"><i class="ti ti-zoom-in"></i></div>
        </div>`).join('')}
    </div>`;

    window._profilePhotoSrcs = srcs;
    document.getElementById('profile-photos-grid').addEventListener('click', e => {
      const item = e.target.closest('.photos-grid-item[data-idx]');
      if (item) openLightbox(window._profilePhotoSrcs, parseInt(item.dataset.idx));
    });
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-wifi-off" aria-hidden="true"></i><p>Erro ao carregar fotos.</p></div>`;
  }
}

async function loadProfileStats(uid) {
  const [friends, comms, posts] = await Promise.all([
    db.collection('friendships').where('users', 'array-contains', uid).get(),
    db.collection('community_members').where('uid', '==', uid).get(),

function _profilePostImageHTML(p) {
  const imgs = p.images?.length ? p.images : (p.imageURL ? [p.imageURL] : []);
  if (!imgs.length) return '';
  if (imgs.length === 1) {
    return `<img class="post-image" src="${imgs[0]}" alt="Imagem" loading="lazy" style="border-radius:var(--radius-md);margin-bottom:.5rem;cursor:zoom-in" onclick="openLightbox(['${imgs[0]}'])">`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(${Math.min(imgs.length,2)},1fr);gap:.25rem;margin-bottom:.5rem;border-radius:var(--radius-md);overflow:hidden">
    ${imgs.slice(0,4).map((url,i) => `<img src="${url}" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in" onclick="openLightbox(${JSON.stringify(imgs)},${i})">`).join('')}
  </div>`;
}

async function loadProfilePosts(uid) {
  const el = document.getElementById('tab-posts');
  const isOwn = currentUser.uid === uid;
  const pinnedId = profileData?.pinnedPostId || null;
  try {
    let snap;
    try {
      snap = await db.collection('posts').where('authorId','==',uid).orderBy('createdAt','desc').limit(20).get();
    } catch(_) {
      snap = await db.collection('posts').where('authorId','==',uid).limit(20).get();
    }

    if (snap.empty) {
      el.innerHTML = `<div class="empty-state"><i class="ti ti-news-off" aria-hidden="true"></i><p>Nenhum post ainda.</p></div>`;
      return;
    }

    let docs = snap.docs.slice().sort((a, b) => {
      const at = a.data().createdAt?.seconds || 0;
      const bt = b.data().createdAt?.seconds || 0;
      return bt - at;
    });

    // Pinned post comes first
    if (pinnedId) {
      const pinnedIdx = docs.findIndex(d => d.id === pinnedId);
      if (pinnedIdx > 0) docs = [docs[pinnedIdx], ...docs.filter(d => d.id !== pinnedId)];
    }

    el.innerHTML = docs.map(doc => {
      const p = doc.data();
      const liked   = (p.likes||[]).includes(currentUser.uid);
      const isPinned = doc.id === pinnedId;
      const pinBtn = isOwn
        ? isPinned
          ? `<button onclick="unpinPost()" style="background:none;border:none;cursor:pointer;color:var(--purple-600);padding:.2rem;font-size:13px" title="Desafixar"><i class="ti ti-pin-filled"></i></button>`
          : `<button onclick="pinPost('${doc.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:.2rem;font-size:13px" title="Fixar no perfil"><i class="ti ti-pin"></i></button>`
        : '';
      return `<div class="post" id="post-${doc.id}">
        ${isPinned ? `<div style="font-size:11px;color:var(--purple-600);font-weight:600;margin-bottom:.3rem;display:flex;align-items:center;gap:.3rem"><i class="ti ti-pin-filled"></i> Post fixado</div>` : ''}
        ${p.text ? `<div class="post-body" style="padding:.75rem 0">${sanitize(p.text).replace(/\n/g,'<br>')}</div>` : ''}
        ${_profilePostImageHTML(p)}
        <div class="post-actions" style="padding:.35rem 0">
          <button class="post-action-btn${liked?' liked':''}" id="like-btn-${doc.id}" onclick="toggleLike('${doc.id}')">
            <i class="ti ti-heart" aria-hidden="true"></i> ${(p.likes||[]).length}
          </button>
          <button class="post-action-btn" onclick="location.href='post.html?id=${doc.id}'">
            <i class="ti ti-message-circle" aria-hidden="true"></i> ${p.commentsCount||0} comentários
          </button>
          ${pinBtn}
          <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${timeAgo(p.createdAt)}</span>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('Erro ao carregar posts:', e);
    el.innerHTML = `<div class="empty-state"><i class="ti ti-wifi-off" aria-hidden="true"></i><p>Erro ao carregar posts. Recarregue a página.</p></div>`;
  }
}

async function pinPost(postId) {
  try {
    await db.collection('users').doc(currentUser.uid).update({ pinnedPostId: postId });
    profileData = { ...profileData, pinnedPostId: postId };
    showToast('Post fixado no perfil!');
    loadProfilePosts(currentUser.uid);
  } catch(e) { showToast('Erro ao fixar post.'); }
}

async function unpinPost() {
  try {
    await db.collection('users').doc(currentUser.uid).update({ pinnedPostId: firebase.firestore.FieldValue.delete() });
    if (profileData) delete profileData.pinnedPostId;
    showToast('Post desafixado.');
    loadProfilePosts(currentUser.uid);
  } catch(e) { showToast('Erro ao desafixar post.'); }
}

async function toggleLike(postId) {
  if (!currentUser) return;
  const btn = document.getElementById(`like-btn-${postId}`);
  if (btn) btn.disabled = true;
  try {
    const ref = db.collection('posts').doc(postId);
    const snap = await ref.get();
    const likes = snap.data().likes || [];
    const isLiked = likes.includes(currentUser.uid);
    await ref.update({
      likes: isLiked
        ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
    if (btn) {
      const newCount = isLiked ? likes.length - 1 : likes.length + 1;
      btn.className = `post-action-btn${!isLiked ? ' liked' : ''}`;
      btn.innerHTML = `<i class="ti ti-heart" aria-hidden="true"></i> ${newCount}`;
    }
  } catch(e) {
    showToast('Erro ao curtir.');
  }
  if (btn) btn.disabled = false;
}

async function loadScraps(uid) {
  const el = document.getElementById('tab-scraps');
  const isOwn = currentUser.uid === uid;
  let html = '';
  if (!isOwn) {
    const cl = getAvatarColor(currentUser.uid);
    const myAv = currentUser.photoURL
      ? `<img src="${currentUser.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : getInitials(currentUser.displayName);
    html = `<div style="display:flex;gap:.65rem;margin-bottom:1rem">
      <div class="avatar avatar-40" style="background:${cl.bg};color:${cl.color};flex-shrink:0">${myAv}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:.4rem">
        <textarea class="composer-textarea" id="scrap-text" placeholder="Escreva um recado…" style="min-height:60px"></textarea>
        <button class="btn btn-primary btn-sm" style="align-self:flex-end" onclick="postScrap('${uid}')">Enviar recado</button>
      </div>
    </div>`;
  }
  const snap = await db.collection('scraps').where('toUid','==',uid).orderBy('createdAt','desc').limit(30).get();
  if (snap.empty) { el.innerHTML = html + `<div class="empty-state"><i class="ti ti-messages" aria-hidden="true"></i><p>Nenhum recado ainda.</p></div>`; return; }
  const scrapsHTML = snap.docs.map(doc => {
    const s = doc.data();
    const cl = getAvatarColor(s.fromUid);
    const av = s.fromPhoto
      ? `<img src="${s.fromPhoto}" alt="${s.fromName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="color:${cl.color}">${getInitials(s.fromName)}</span>`;
    const canDelete = isOwn || s.fromUid === currentUser.uid;
    const likes = s.likes || [];
    const liked = likes.includes(currentUser.uid);
    return `<div class="scrap" id="pscrap-${doc.id}" style="position:relative">
      <div class="scrap-author">
        <div class="avatar avatar-32" style="background:${cl.bg};cursor:pointer" onclick="location.href='perfil.html?uid=${s.fromUid}'">${av}</div>
        ${sanitize(s.fromName)}
      </div>
      <div class="scrap-text">${sanitize(s.text).replace(/\n/g,'<br>')}</div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <span class="scrap-time">${timeAgo(s.createdAt)}</span>
        <button id="pscrap-like-${doc.id}" onclick="toggleProfileScrapLike('${doc.id}',this)"
          style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.2rem;font-size:11px;padding:.1rem .2rem;border-radius:4px;color:${liked?'var(--coral-400)':'var(--text-muted)'}">
          <i class="ti ${liked?'ti-heart-filled':'ti-heart'}" style="font-size:13px"></i>
          <span>${likes.length || ''}</span>
        </button>
      </div>
      ${canDelete ? `<button onclick="deleteProfileScrap('${doc.id}')" title="Excluir"
        style="position:absolute;top:.35rem;right:.35rem;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:.2rem;border-radius:4px"
        onmouseover="this.style.color='var(--coral-400)'" onmouseout="this.style.color='var(--text-muted)'">
        <i class="ti ti-trash"></i>
      </button>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = html + scrapsHTML;
}

async function deleteProfileScrap(id) {
  if (!confirm('Excluir este recado?')) return;
  try {
    await db.collection('scraps').doc(id).delete();
    document.getElementById(`pscrap-${id}`)?.remove();
    showToast('Recado excluído.');
  } catch(e) {
    showToast('Erro ao excluir recado.');
  }
}

async function toggleProfileScrapLike(id, btn) {
  const ref = db.collection('scraps').doc(id);
  const doc = await ref.get();
  if (!doc.exists) return;
  const likes = doc.data().likes || [];
  const liked = likes.includes(currentUser.uid);
  await ref.update({
    likes: liked
      ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  });
  const newCount = liked ? likes.length - 1 : likes.length + 1;
  const icon = btn.querySelector('i');
  const countEl = btn.querySelector('span');
  if (liked) { icon.className = 'ti ti-heart'; btn.style.color = 'var(--text-muted)'; }
  else       { icon.className = 'ti ti-heart-filled'; btn.style.color = 'var(--coral-400)'; }
  countEl.textContent = newCount > 0 ? newCount : '';
}

async function postScrap(toUid) {
  const text = document.getElementById('scrap-text').value.trim();
  if (!text) return showToast('Escreva um recado.');
  // Buscar nome do destinatário para salvar toName
  const toUser = await getUserData(toUid);
  const toName = toUser ? (toUser.displayName || 'Usuário') : 'Usuário';
  await db.collection('scraps').add({
    toUid,
    toName,                                  // ← CORRIGIDO: inclui nome do destinatário
    fromUid:  currentUser.uid,
    fromName: currentUser.displayName,
    fromPhoto: currentUser.photoURL || null,
    text,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById('scrap-text').value = '';
  showToast('Recado enviado!');
  // Notificar destinatário
  createNotification(toUid, 'scrap', {
    message: `${currentUser.displayName} te enviou um recado.`,
    link: `/pages/recados.html`,
    fromUid: currentUser.uid,
    fromName: currentUser.displayName
  });
  loadScraps(toUid);
}

async function toggleBlock(targetUid, btn) {
  const myData = await getUserData(currentUser.uid);
  const blocked = myData?.blocked || [];
  const isBlocked = blocked.includes(targetUid);
  try {
    await db.collection('users').doc(currentUser.uid).update({
      blocked: isBlocked
        ? firebase.firestore.FieldValue.arrayRemove(targetUid)
        : firebase.firestore.FieldValue.arrayUnion(targetUid)
    });
    if (isBlocked) {
      btn.title = 'Bloquear';
      btn.style.cssText = '';
      btn.innerHTML = '<i class="ti ti-ban" aria-hidden="true"></i>';
      showToast('Usuário desbloqueado.');
    } else {
      btn.title = 'Desbloquear';
      btn.style.cssText = 'color:var(--coral-400);border-color:var(--coral-400)';
      btn.innerHTML = '<i class="ti ti-lock-open" aria-hidden="true"></i>';
      showToast('Usuário bloqueado.');
    }
  } catch(e) { showToast('Erro ao atualizar bloqueio.'); }
}

async function sendFriendRequest(targetUid, btn) {
  try {
    // Verificar duplicata
    const existing = await db.collection('friend_requests')
      .where('from', '==', currentUser.uid)
      .where('to', '==', targetUid)
      .where('status', '==', 'pending').get();
    if (!existing.empty) {
      btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Enviado';
      btn.disabled = true;
      return;
    }
    await db.collection('friend_requests').add({
      from: currentUser.uid,
      to:   targetUid,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Solicitação enviada';
    btn.disabled = true;
    showToast('Solicitação enviada!');
    // Notificar
    createNotification(targetUid, 'friend_request', {
      message: `${currentUser.displayName} enviou uma solicitação de amizade.`,
      link: '/pages/amigos.html',
      fromUid: currentUser.uid,
      fromName: currentUser.displayName
    });
  } catch(e) { showToast('Erro ao enviar solicitação.'); }
}

let editGender = '';
function selectEditGender(g) {
  editGender = g;
  // Usar apenas os botões do modal de edição (IDs eg-*) para evitar conflito
  ['eg-masculino','eg-feminino','eg-outro'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('selected');
  });
  const map = { 'Masculino':'eg-masculino', 'Feminino':'eg-feminino', 'Outro':'eg-outro' };
  const el = document.getElementById(map[g]);
  if (el) el.classList.add('selected');
}

function toggleEmojiPicker() {

  if (!grid) return;
  if (grid.style.display !== 'none') { grid.style.display = 'none'; return; }

  modal.innerHTML = `
    <div class="modal" style="max-width:320px;text-align:center">

        <span class="modal-title">Compartilhar perfil</span>

async function saveProfile() {
  const first    = document.getElementById('edit-firstname').value.trim();
  const last     = document.getElementById('edit-lastname').value.trim();
  const username = document.getElementById('edit-username').value.trim().toLowerCase();
  const bio      = document.getElementById('edit-bio').value.trim();
  const birth    = document.getElementById('edit-birthdate').value;
  const city     = document.getElementById('edit-city').value.trim();
  const website  = document.getElementById('edit-website').value.trim();

  if (!first) return showToast('O nome é obrigatório.');
  if (username && username.length < 3) return showToast('Username deve ter pelo menos 3 caracteres.');

  const displayName = last ? `${first} ${last}` : first;
  const btn = document.querySelector('#edit-modal .btn-primary');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Salvando…';

  try {
    // Verificar username duplicado (se alterado)
    if (username && username !== profileData.username) {
      const uSnap = await db.collection('users').where('username','==',username).get();
      if (!uSnap.empty) {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-device-floppy"></i> Salvar alterações';
        return showToast('Nome de usuário já em uso.');
      }
    }
    const statusEmoji = document.getElementById('edit-status-emoji').value.trim();
    const statusText  = document.getElementById('edit-status-text').value.trim();
    const updates = { displayName, displayName_lower: displayName.toLowerCase(), bio, city, website, status: { emoji: statusEmoji, text: statusText } };
    if (username) updates.username = username;
    if (birth) updates.birthdate = birth;
    if (editGender) updates.gender = editGender;

    await updateUserData(currentUser.uid, updates);
    await currentUser.updateProfile({ displayName });
    showToast('Perfil atualizado!');
    closeModal();
    profileData = { ...profileData, ...updates };
    renderProfile(currentUser.uid);
  } catch(e) {
    showToast('Erro ao salvar. Tente novamente.');
  }
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-device-floppy"></i> Salvar alterações';
}

document.getElementById('edit-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Cover upload ──────────────────────────────────────────────
async function uploadCover(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) return showToast('Imagem muito grande. Máximo 8MB.');
  if (!file.type.startsWith('image/')) return showToast('Selecione uma imagem válida.');

  showToast('Enviando capa...');
  try {
    const coverURL = await uploadToCloudinary(file);
    await updateUserData(currentUser.uid, { coverURL });
    profileData = { ...profileData, coverURL };
    showToast('Capa atualizada!');
    renderProfile(currentUser.uid);
  } catch(e) {
    const msg = e.name === 'AbortError'
      ? 'Upload demorou demais. Verifique sua conexão.'
      : 'Erro ao enviar capa. Tente novamente.';
    showToast(msg);
  }
  input.value = '';
}

// ── Avatar upload ─────────────────────────────────────────────
async function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) return showToast('Imagem muito grande. Máximo 5MB.');
  if (!file.type.startsWith('image/')) return showToast('Selecione uma imagem válida.');

  showToast('Enviando foto...');

  try {
    let downloadURL;
    try {
      downloadURL = await uploadToCloudinary(file);
    } catch(uploadErr) {
      const msg = uploadErr.name === 'AbortError'
        ? 'Upload demorou demais. Verifique sua conexão.'
        : 'Erro ao enviar foto. Tente novamente.';
      showToast(msg);
      input.value = '';
      return;
    }

    await currentUser.updateProfile({ photoURL: downloadURL });
    await updateUserData(currentUser.uid, { photoURL: downloadURL });

    profileData = { ...profileData, photoURL: downloadURL };
    showToast('Foto atualizada com sucesso!');
    renderProfile(currentUser.uid);
  } catch(e) {
    console.error('Avatar upload error:', e);
    showToast('Erro ao enviar foto. Tente novamente.');
  }

  input.value = '';
}

async function loadHighlights(uid, isOwn) {
  const row = document.getElementById('highlights-row');
  if (!row) return;
  try {
    const snap = await db.collection('highlights').doc(uid).collection('items')
      .orderBy('createdAt', 'asc').limit(20).get();

    const addBtn = isOwn
      ? `<div class="highlight-item" onclick="openCreateHighlightModal()">
           <div class="highlight-ring add-ring">
             <div class="highlight-ring-inner">
               <span style="font-size:26px;font-weight:200;color:var(--text-muted);line-height:1;user-select:none">+</span>
             </div>
           </div>
           <span class="highlight-name">Novo</span>
         </div>` : '';

    if (snap.empty && !isOwn) {
      document.getElementById('highlights-card').style.display = 'none';
      return;
    }

    const items = snap.docs.map(d => {
      const h = d.data();
      const inner = h.coverURL
        ? `<img src="${sanitize(h.coverURL)}" alt="${sanitize(h.title)}">`
        : `<span style="font-size:22px">${sanitize(h.emoji||'⭐')}</span>`;
      const del = isOwn
        ? `<button onclick="event.stopPropagation();deleteHighlight('${d.id}','${uid}')" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--rose-500);color:#fff;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2" title="Excluir"><i class="ti ti-x"></i></button>` : '';
      return `<div class="highlight-item" style="position:relative" onclick="openHighlightViewer('${d.id}','${uid}')">
        ${del}
        <div class="highlight-ring"><div class="highlight-ring-inner">${inner}</div></div>
        <span class="highlight-name">${sanitize(h.title||'Destaque')}</span>
      </div>`;
    }).join('');

    row.innerHTML = addBtn + items;
  } catch(e) {
    if (document.getElementById('highlights-card')) {
      document.getElementById('highlights-card').style.display = 'none';
    }
  }
}

async function saveHighlight() {
  const title = document.getElementById('hl-title')?.value.trim();
  if (!title) return showToast('Digite um título.');
  const emoji  = document.getElementById('hl-emoji')?.value.trim() || '⭐';
  const imgFile = document.getElementById('hl-img')?.files[0];
  const btn = document.querySelector('#highlight-create-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Salvando…'; }
  try {
    let coverURL = null;
    if (imgFile) coverURL = await uploadToCloudinary(imgFile);
    await db.collection('highlights').doc(currentUser.uid).collection('items').add({
      title, emoji, coverURL,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('highlight-create-modal')?.remove();
    showToast('Destaque criado!');
    loadHighlights(currentUser.uid, true);
  } catch(e) {
    showToast('Erro ao criar destaque.');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Criar destaque'; }
  }
}

async function deleteHighlight(itemId, uid) {
  if (!confirm('Excluir este destaque?')) return;
  await db.collection('highlights').doc(uid).collection('items').doc(itemId).delete();
  showToast('Destaque excluído.');
  loadHighlights(uid, true);
}

function openHighlightViewer(itemId, uid) {
  db.collection('highlights').doc(uid).collection('items').doc(itemId).get().then(snap => {
    if (!snap.exists) return;
    const h = snap.data();
    if (h.coverURL) openLightbox([h.coverURL]);
    else showToast(h.title || 'Destaque');
  });
}

      <div class="modal-header">
        <span class="modal-title"><i class="ti ti-quote"></i> Escrever depoimento</span>
        <button class="btn btn-icon" onclick="document.getElementById('depo-form-modal').remove()"><i class="ti ti-x"></i></button>
      </div>
      <textarea class="form-input" id="depo-text" rows="5" placeholder="Escreva algo sobre essa pessoa…" style="resize:vertical;min-height:100px;margin-bottom:.75rem"></textarea>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:.75rem">O depoimento ficará pendente até ser aprovado pelo dono do perfil.</p>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="submitDepoimento('${toUid}')">
        <i class="ti ti-send"></i> Enviar depoimento
      </button>
    </div>`;
  document.body.appendChild(modal);
}

async function submitDepoimento(toUid) {
  const text = document.getElementById('depo-text')?.value.trim();
  if (!text) return showToast('Escreva algo antes de enviar.');
  if (text.length > 500) return showToast('Máximo 500 caracteres.');
  const btn = document.querySelector('#depo-form-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Enviando…'; }
  try {
    const me = await getUserData(currentUser.uid);
    await db.collection('testimonials').doc(toUid).collection('items').add({
      fromUid:   currentUser.uid,
      fromName:  me?.displayName  || currentUser.displayName || 'Usuário',
      fromPhoto: me?.photoURL     || currentUser.photoURL    || null,
      text,
      status:    'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    createNotification(toUid, 'scrap', {
      message: `${currentUser.displayName} deixou um depoimento no seu perfil.`,
      link: `perfil.html?uid=${toUid}`,
      fromUid: currentUser.uid, fromName: currentUser.displayName
    });
    document.getElementById('depo-form-modal')?.remove();
    showToast('Depoimento enviado! Aguardando aprovação.');
  } catch(e) {
    showToast('Erro ao enviar depoimento.');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-send"></i> Enviar depoimento'; }
  }
}

async function approveDepoimento(uid, itemId) {
  await db.collection('testimonials').doc(uid).collection('items').doc(itemId).update({ status: 'approved' });
  showToast('Depoimento aprovado!');
  loadDepoimentos(uid);
}

async function deleteDepoimento(uid, itemId) {
  if (!confirm('Excluir este depoimento?')) return;
  await db.collection('testimonials').doc(uid).collection('items').doc(itemId).delete();
  showToast('Depoimento excluído.');
  loadDepoimentos(uid);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
