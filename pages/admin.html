<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CYDS5B5TN5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CYDS5B5TN5');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Nexus</title>
  <meta name="robots" content="noindex, nofollow">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    .admin-page { max-width: 820px; margin: 0 auto; padding: 1.5rem .75rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .65rem; margin-bottom: 1.25rem; }
    .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--purple-600); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: .3rem; }
    .filter-tabs { display: flex; gap: .35rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-tab { padding: .38rem .85rem; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-secondary); font-family: var(--font-sans); transition: all var(--transition); }
    .filter-tab.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }
    .report-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.125rem; margin-bottom: .65rem; transition: box-shadow var(--transition); }
    .report-card:hover { box-shadow: var(--shadow-sm); }
    .report-reason { font-size: 13.5px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: .4rem; }
    .report-post-preview { font-size: 13px; color: var(--text-secondary); background: var(--gray-50); border-left: 3px solid var(--border); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: .55rem .85rem; margin: .5rem 0; line-height: 1.55; }
    .report-meta { font-size: 11px; color: var(--text-muted); margin-top: .4rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .report-actions { display: flex; gap: .35rem; margin-top: .75rem; flex-wrap: wrap; }
    .status-badge { display: inline-flex; align-items: center; gap: .25rem; font-size: 11px; font-weight: 700; padding: .2rem .6rem; border-radius: var(--radius-full); flex-shrink: 0; }
    .status-badge.pending    { background: #fef3c7; color: #92400e; }
    .status-badge.resolved   { background: #d1fae5; color: #065f46; }
    .status-badge.dismissed  { background: var(--gray-100); color: var(--text-muted); }
    [data-theme="dark"] .status-badge.pending  { background: rgba(251,191,36,0.18); color: #FCD34D; }
    [data-theme="dark"] .status-badge.resolved { background: rgba(34,197,94,0.15); color: #86EFAC; }

    .user-mgmt-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: .85rem 1.125rem; margin-bottom: .65rem; display: flex; align-items: center; gap: .85rem; flex-wrap: wrap; }
    .user-mgmt-info { flex: 1; min-width: 0; }
    .user-mgmt-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .user-mgmt-sub  { font-size: 12px; color: var(--text-muted); margin-top: .15rem; }
    .user-status-badge { font-size: 11px; font-weight: 700; padding: .18rem .5rem; border-radius: 999px; white-space: nowrap; }
    .usb-active    { background: rgba(34,197,94,0.12); color: #059669; }
    .usb-suspended { background: rgba(234,179,8,0.15);  color: #92400E; }
    .usb-banned    { background: rgba(239,68,68,0.12);  color: #DC2626; }
    [data-theme="dark"] .usb-active    { background: rgba(34,197,94,0.18); color: #86EFAC; }
    [data-theme="dark"] .usb-suspended { background: rgba(234,179,8,0.18);  color: #FDE68A; }
    [data-theme="dark"] .usb-banned    { background: rgba(239,68,68,0.18);  color: #FCA5A5; }
    .user-mgmt-actions { display: flex; gap: .35rem; flex-wrap: wrap; }

    /* Modal de suspensão */
    .mgmt-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .mgmt-modal    { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; max-width: 380px; width: 100%; box-shadow: var(--shadow-lg); }
    .mgmt-modal h3 { font-size: 16px; font-weight: 700; margin: 0 0 1rem; }
    .mgmt-modal label { font-size: 13px; font-weight: 600; display: block; margin-bottom: .35rem; }
    .mgmt-modal select, .mgmt-modal textarea { width: 100%; box-sizing: border-box; margin-bottom: .85rem; }
    .mgmt-modal textarea { resize: vertical; min-height: 72px; }
    .mgmt-modal-actions { display: flex; gap: .5rem; justify-content: flex-end; }
    @media (max-width: 768px) { .admin-page { padding: 1rem .5rem calc(80px + 1rem); } }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="toast" id="toast"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="admin-page">
    <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <i class="ti ti-shield-check" style="font-size:22px;color:var(--purple-600)" aria-hidden="true"></i>
      <h1 style="font-size:20px;font-weight:700;margin:0">Painel de Moderação</h1>
      <button class="btn btn-sm" onclick="loadReports()" style="margin-left:auto">
        <i class="ti ti-refresh" aria-hidden="true"></i> Atualizar
      </button>
    </div>

    <div class="stat-grid" id="stats-grid">
      <div class="stat-card" style="grid-column:1/-1">
        <div class="spinner" style="margin:0 auto"></div>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" id="ftab-all"       onclick="setFilter('all',this)">Todos</button>
      <button class="filter-tab"        id="ftab-pending"   onclick="setFilter('pending',this)">Pendentes</button>
      <button class="filter-tab"        id="ftab-resolved"  onclick="setFilter('resolved',this)">Resolvidos</button>
      <button class="filter-tab"        id="ftab-dismissed" onclick="setFilter('dismissed',this)">Dispensados</button>
    </div>

    <div id="reports-list">
      <div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>
    </div>

    <!-- User verification section -->
    <div style="margin-top:2rem">
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem">
        <i class="ti ti-badge-check" style="font-size:20px;color:var(--purple-600)"></i>
        <h2 style="font-size:17px;font-weight:700;margin:0">Verificação de contas</h2>
      </div>
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
        <input type="text" id="verify-search" class="form-input" placeholder="Buscar usuário pelo nome…"
               oninput="searchVerifyUsers(this.value)" autocomplete="off" style="flex:1">
      </div>
      <div id="verify-results"></div>
    </div>

    <!-- User management section -->
    <div style="margin-top:2rem">
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem">
        <i class="ti ti-user-exclamation" style="font-size:20px;color:var(--purple-600)"></i>
        <h2 style="font-size:17px;font-weight:700;margin:0">Gerenciamento de usuários</h2>
      </div>
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 .85rem">Suspender, banir ou excluir contas que violem a Política de Uso.</p>
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
        <input type="text" id="mgmt-search" class="form-input" placeholder="Buscar usuário pelo nome…"
               oninput="searchMgmtUsers(this.value)" autocomplete="off" style="flex:1">
      </div>
      <div id="mgmt-results"></div>
    </div>
  </div>
</div>

<!-- Modal suspensão/banimento -->
<div class="mgmt-modal-bg" id="mgmt-modal" style="display:none" onclick="if(event.target===this)closeMgmtModal()">
  <div class="mgmt-modal">
    <h3 id="mgmt-modal-title">Suspender conta</h3>
    <div id="mgmt-duration-wrap">
      <label for="mgmt-duration">Duração</label>
      <select id="mgmt-duration" class="form-input">
        <option value="1">1 dia</option>
        <option value="3">3 dias</option>
        <option value="7" selected>7 dias</option>
        <option value="30">30 dias</option>
      </select>
    </div>
    <label for="mgmt-reason">Motivo <span style="font-weight:400;color:var(--text-muted)">(visível ao usuário)</span></label>
    <textarea id="mgmt-reason" class="form-input" placeholder="Ex: publicação de conteúdo racista (artigo 3.1 da Política de Uso)"></textarea>
    <div class="mgmt-modal-actions">
      <button class="btn btn-sm" onclick="closeMgmtModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="mgmt-modal-confirm" onclick="confirmMgmtAction()">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser = null;
let _filter     = 'all';
let _allReports = [];

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'admin');

  if (!userData.isAdmin) {
    document.querySelector('.admin-page').innerHTML = `
      <div class="empty-state" style="padding:4rem 1rem">
        <i class="ti ti-lock-access" style="font-size:48px;color:var(--text-muted)" aria-hidden="true"></i>
        <p>Acesso restrito a administradores.</p>
        <a href="../index.html" class="btn btn-primary" style="margin-top:1rem">
          <i class="ti ti-arrow-left"></i> Voltar ao feed
        </a>
      </div>`;
    return;
  }

  loadReports();
});

async function loadReports() {
  const listEl = document.getElementById('reports-list');
  if (listEl) listEl.innerHTML = '<div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>';
  try {
    const snap = await db.collection('reports').orderBy('createdAt', 'desc').limit(200).get();
    _allReports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStats();
    renderReports();
  } catch(e) {
    console.error('loadReports:', e);
    if (listEl) listEl.innerHTML = `
      <div class="empty-state" style="padding:2rem">
        <i class="ti ti-alert-circle"></i>
        <p>Erro ao carregar denúncias. Verifique suas permissões.</p>
      </div>`;
  }
}

function renderStats() {
  const total     = _allReports.length;
  const pending   = _allReports.filter(r => !r.status || r.status === 'pending').length;
  const resolved  = _allReports.filter(r => r.status === 'resolved').length;
  const dismissed = _allReports.filter(r => r.status === 'dismissed').length;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${total}</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:#d97706">${pending}</div>
      <div class="stat-label">Pendentes</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:#059669">${resolved}</div>
      <div class="stat-label">Resolvidas</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--text-muted)">${dismissed}</div>
      <div class="stat-label">Dispensadas</div>
    </div>`;
}

function setFilter(f, btn) {
  _filter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderReports();
}

async function renderReports() {
  const el = document.getElementById('reports-list');

  let filtered = _allReports;
  if (_filter === 'pending')   filtered = _allReports.filter(r => !r.status || r.status === 'pending');
  else if (_filter !== 'all')  filtered = _allReports.filter(r => r.status === _filter);

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state" style="padding:2rem">
      <i class="ti ti-clipboard-check"></i>
      <p>Nenhuma denúncia${_filter !== 'all' ? ' nesta categoria' : ''} ainda.</p>
    </div>`;
    return;
  }

  // Fetch post data in batch (up to 50)
  const slice    = filtered.slice(0, 50);
  const postIds  = [...new Set(slice.map(r => r.postId).filter(Boolean))];
  const postsMap = {};
  await Promise.all(postIds.map(async id => {
    try {
      const snap = await db.collection('posts').doc(id).get();
      if (snap.exists) postsMap[id] = snap.data();
    } catch {}
  }));

  const STATUS_LABEL = { pending: 'Pendente', resolved: 'Resolvido', dismissed: 'Dispensado' };
  const STATUS_ICON  = { pending: 'ti-clock',  resolved: 'ti-check',  dismissed: 'ti-x' };

  el.innerHTML = slice.map(r => {
    const post       = r.postId ? postsMap[r.postId] : null;
    const status     = r.status || 'pending';
    const label      = STATUS_LABEL[status] || 'Pendente';
    const icon       = STATUS_ICON[status]  || 'ti-clock';
    const postText   = post ? (post.text || '[post sem texto]') : '[post não encontrado ou excluído]';
    const authorName = post?.authorName || '?';
    const date       = r.createdAt ? timeAgo(r.createdAt) : '—';

    return `
    <div class="report-card" id="report-${r.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem">
        <div class="report-reason">
          <i class="ti ti-flag" style="color:var(--coral-400);font-size:14px" aria-hidden="true"></i>
          ${sanitize(r.reason || 'Sem motivo especificado')}
        </div>
        <span class="status-badge ${status}">
          <i class="ti ${icon}" style="font-size:10px"></i> ${label}
        </span>
      </div>

      <div class="report-post-preview">
        <span style="font-size:11px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:.2rem">
          Post de ${sanitize(authorName)}
        </span>
        ${sanitize(postText.slice(0, 280))}${postText.length > 280 ? '…' : ''}
      </div>

      <div class="report-meta">
        <span><i class="ti ti-calendar" style="font-size:10px"></i> ${date}</span>
        <span>· Denunciado por <code style="font-size:10px;background:var(--gray-100);padding:.1rem .3rem;border-radius:3px">${sanitize(r.reportedBy || '?')}</code></span>
        ${r.resolvedBy ? `<span>· Resolvido por <code style="font-size:10px;background:var(--gray-100);padding:.1rem .3rem;border-radius:3px">${sanitize(r.resolvedBy)}</code></span>` : ''}
      </div>

      <div class="report-actions">
        ${r.postId && post ? `
          <a href="post.html?id=${r.postId}" target="_blank" class="btn btn-sm">
            <i class="ti ti-external-link" aria-hidden="true"></i> Ver post
          </a>` : ''}
        ${status !== 'resolved' ? `
          <button class="btn btn-sm" style="color:#059669;border-color:#059669"
                  onclick="updateReport('${r.id}','resolved')">
            <i class="ti ti-check" aria-hidden="true"></i> Resolver
          </button>` : ''}
        ${status !== 'dismissed' ? `
          <button class="btn btn-sm" style="color:var(--text-muted)"
                  onclick="updateReport('${r.id}','dismissed')">
            <i class="ti ti-x" aria-hidden="true"></i> Dispensar
          </button>` : ''}
        ${r.postId && post ? `
          <button class="btn btn-sm" style="color:var(--coral-400);border-color:var(--coral-400)"
                  onclick="deleteReportedPost('${r.id}','${r.postId}')">
            <i class="ti ti-trash" aria-hidden="true"></i> Excluir post
          </button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function updateReport(reportId, status) {
  try {
    await db.collection('reports').doc(reportId).update({
      status,
      resolvedBy: currentUser.uid,
      resolvedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    const idx = _allReports.findIndex(r => r.id === reportId);
    if (idx !== -1) {
      _allReports[idx].status     = status;
      _allReports[idx].resolvedBy = currentUser.uid;
    }
    renderStats();
    renderReports();
    showToast(status === 'resolved' ? 'Marcado como resolvido.' : 'Denúncia dispensada.');
  } catch(e) { showToast('Erro ao atualizar denúncia.'); }
}

function deleteReportedPost(reportId, postId) {
  if (!postId) return showToast('ID do post não encontrado.');
  confirmAction('Excluir este post permanentemente? Esta ação não pode ser desfeita.', async () => {
    try {
      await db.collection('posts').doc(postId).delete();
      await updateReport(reportId, 'resolved');
      showToast('Post excluído e denúncia resolvida.');
    } catch(e) {
      showToast('Erro ao excluir post. Verifique as permissões de admin no Firestore.');
    }
  });
}

// ── User verification ─────────────────────────────────────────
let _verifyTimer = null;

function searchVerifyUsers(q) {
  clearTimeout(_verifyTimer);
  const el = document.getElementById('verify-results');
  if (!q.trim()) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="spinner" style="margin:.75rem auto;display:block"></div>';
  _verifyTimer = setTimeout(async () => {
    try {
      const qLower = q.toLowerCase();
      const snap = await db.collection('users')
        .where('displayName_lower', '>=', qLower)
        .where('displayName_lower', '<=', qLower + '')
        .limit(10).get();
      if (snap.empty) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:.5rem 0">Nenhum usuário encontrado.</p>'; return; }
      el.innerHTML = snap.docs.map(d => {
        const u = d.data();
        const cl = getAvatarColor(d.id);
        const av = u.photoURL
          ? `<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : `<span style="color:${cl.color}">${getInitials(u.displayName||'?')}</span>`;
        const isVerified = !!u.isVerified;
        return `<div style="display:flex;align-items:center;gap:.75rem;padding:.65rem 0;border-bottom:0.5px solid var(--border)">
          <div class="avatar avatar-40" style="background:${cl.bg};flex-shrink:0">${av}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600">${sanitize(u.displayName||'Usuário')}
              ${isVerified ? '<span class="verified-badge" title="Verificado"><i class="ti ti-check" style="font-size:8px"></i></span>' : ''}
            </div>
            <div style="font-size:12px;color:var(--text-muted)">${sanitize(u.username||d.id)}</div>
          </div>
          <button class="btn btn-sm${isVerified ? '' : ' btn-primary'}" onclick="toggleVerified('${d.id}',${!isVerified})"
                  id="vbtn-${d.id}" style="${isVerified ? 'color:var(--coral-400);border-color:var(--coral-400)' : ''}">
            ${isVerified ? '<i class="ti ti-badge-off"></i> Revogar' : '<i class="ti ti-badge-check"></i> Verificar'}
          </button>
        </div>`;
      }).join('');
    } catch(e) {
      document.getElementById('verify-results').innerHTML = `<p style="font-size:13px;color:var(--coral-400)">${sanitize(e.message)}</p>`;
    }
  }, 350);
}

async function toggleVerified(uid, newState) {
  const btn = document.getElementById(`vbtn-${uid}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i>'; }
  try {
    await db.collection('users').doc(uid).update({ isVerified: newState });
    showToast(newState ? 'Conta verificada!' : 'Verificação revogada.');
    const q = document.getElementById('verify-search')?.value || '';
    searchVerifyUsers(q);
  } catch(e) {
    showToast('Erro: ' + e.message);
    if (btn) { btn.disabled = false; }
  }
}

// ── Gerenciamento de usuários ──────────────────────────────────
let _mgmtTimer = null;
let _mgmtAction = null; // { type, uid }

function searchMgmtUsers(q) {
  clearTimeout(_mgmtTimer);
  const el = document.getElementById('mgmt-results');
  if (!q.trim()) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="spinner" style="margin:.75rem auto;display:block"></div>';
  _mgmtTimer = setTimeout(async () => {
    try {
      const qLower = q.toLowerCase();
      const snap = await db.collection('users')
        .where('displayName_lower', '>=', qLower)
        .where('displayName_lower', '<=', qLower + '')
        .limit(10).get();
      if (snap.empty) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:.5rem 0">Nenhum usuário encontrado.</p>'; return; }
      el.innerHTML = snap.docs.map(d => renderMgmtCard(d.id, d.data())).join('');
    } catch(e) {
      el.innerHTML = `<p style="font-size:13px;color:var(--coral-400)">${sanitize(e.message)}</p>`;
    }
  }, 350);
}

function renderMgmtCard(uid, u) {
  const cl = getAvatarColor(uid);
  const av = u.photoURL
    ? `<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : `<span style="color:${cl.color}">${getInitials(u.displayName || '?')}</span>`;

  let statusBadge = '<span class="user-status-badge usb-active">Ativo</span>';
  let statusNote = '';
  if (u.isBanned) {
    statusBadge = '<span class="user-status-badge usb-banned">Banido</span>';
    if (u.banReason) statusNote = `<span style="font-size:11px;color:var(--text-muted)">Motivo: ${sanitize(u.banReason)}</span>`;
  } else if (u.isSuspended) {
    statusBadge = '<span class="user-status-badge usb-suspended">Suspenso</span>';
    const until = u.suspendedUntil ? u.suspendedUntil.toDate().toLocaleDateString('pt-BR') : '';
    statusNote = `<span style="font-size:11px;color:var(--text-muted)">${until ? `Até ${until}` : ''}${u.suspendReason ? ` · ${sanitize(u.suspendReason)}` : ''}</span>`;
  }

  const canSuspend = !u.isSuspended && !u.isBanned;
  const canBan     = !u.isBanned;
  const canRestore = u.isSuspended || u.isBanned;

  return `<div class="user-mgmt-card" id="mgmt-card-${uid}">
    <div class="avatar avatar-40" style="background:${cl.bg};flex-shrink:0">${av}</div>
    <div class="user-mgmt-info">
      <div class="user-mgmt-name">
        ${sanitize(u.displayName || 'Usuário')}
        ${statusBadge}
      </div>
      <div class="user-mgmt-sub">${sanitize(u.username || uid)}</div>
      ${statusNote}
    </div>
    <div class="user-mgmt-actions">
      ${canSuspend ? `<button class="btn btn-sm" style="color:#92400E;border-color:#92400E" onclick="openSuspendModal('${uid}')">
        <i class="ti ti-clock-pause"></i> Suspender
      </button>` : ''}
      ${canBan ? `<button class="btn btn-sm" style="color:var(--coral-400);border-color:var(--coral-400)" onclick="openBanModal('${uid}')">
        <i class="ti ti-ban"></i> Banir
      </button>` : ''}
      ${canRestore ? `<button class="btn btn-sm" style="color:#059669;border-color:#059669" onclick="restoreUser('${uid}')">
        <i class="ti ti-user-check"></i> Restaurar
      </button>` : ''}
      <button class="btn btn-sm" style="color:#DC2626;border-color:#DC2626" onclick="deleteUser('${uid}','${sanitize(u.displayName||'este usuário')}')">
        <i class="ti ti-user-x"></i> Excluir
      </button>
    </div>
  </div>`;
}

function openSuspendModal(uid) {
  _mgmtAction = { type: 'suspend', uid };
  document.getElementById('mgmt-modal-title').textContent = 'Suspender conta';
  document.getElementById('mgmt-duration-wrap').style.display = '';
  document.getElementById('mgmt-reason').placeholder = 'Ex: publicação de conteúdo racista (artigo 3.1 da Política de Uso)';
  document.getElementById('mgmt-reason').value = '';
  document.getElementById('mgmt-modal').style.display = 'flex';
}

function openBanModal(uid) {
  _mgmtAction = { type: 'ban', uid };
  document.getElementById('mgmt-modal-title').textContent = 'Banir conta permanentemente';
  document.getElementById('mgmt-duration-wrap').style.display = 'none';
  document.getElementById('mgmt-reason').placeholder = 'Ex: conteúdo de abuso sexual infantil — violação grave da Política de Uso';
  document.getElementById('mgmt-reason').value = '';
  document.getElementById('mgmt-modal').style.display = 'flex';
}

function closeMgmtModal() {
  document.getElementById('mgmt-modal').style.display = 'none';
  _mgmtAction = null;
}

async function confirmMgmtAction() {
  if (!_mgmtAction) return;
  const { type, uid } = _mgmtAction;
  const reason = document.getElementById('mgmt-reason').value.trim();
  const btn = document.getElementById('mgmt-modal-confirm');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i>';

  try {
    if (type === 'suspend') {
      const days = parseInt(document.getElementById('mgmt-duration').value, 10);
      const until = new Date();
      until.setDate(until.getDate() + days);
      await db.collection('users').doc(uid).update({
        isSuspended: true,
        suspendedUntil: firebase.firestore.Timestamp.fromDate(until),
        suspendReason: reason
      });
      // Desabilitar autenticação Firebase via API
      await callManageUser('disable_auth', uid);
      showToast(`Conta suspensa por ${days} dia(s).`);
    } else if (type === 'ban') {
      await db.collection('users').doc(uid).update({
        isBanned: true,
        banReason: reason,
        isSuspended: false,
        suspendedUntil: null
      });
      await callManageUser('disable_auth', uid);
      showToast('Conta banida permanentemente.');
    }
    closeMgmtModal();
    const q = document.getElementById('mgmt-search')?.value || '';
    searchMgmtUsers(q);
  } catch(e) {
    showToast('Erro: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Confirmar';
  }
}

async function restoreUser(uid) {
  confirmAction('Restaurar o acesso desta conta? A suspensão/banimento será removido.', async () => {
    try {
      await db.collection('users').doc(uid).update({
        isSuspended: false,
        isBanned: false,
        suspendedUntil: null,
        suspendReason: '',
        banReason: ''
      });
      await callManageUser('enable_auth', uid);
      showToast('Acesso restaurado.');
      const q = document.getElementById('mgmt-search')?.value || '';
      searchMgmtUsers(q);
    } catch(e) { showToast('Erro: ' + e.message); }
  });
}

function deleteUser(uid, name) {
  confirmAction(`Excluir permanentemente a conta de "${name}"? Esta ação não pode ser desfeita — o usuário perderá acesso imediatamente e o cadastro será removido.`, async () => {
    try {
      await callManageUser('delete', uid);
      showToast('Conta excluída permanentemente.');
      const card = document.getElementById(`mgmt-card-${uid}`);
      if (card) card.remove();
    } catch(e) { showToast('Erro: ' + e.message); }
  });
}

async function callManageUser(action, uid) {
  const idToken = await auth.currentUser.getIdToken();
  const res = await fetch('https://nexus-social-fawn.vercel.app/api/manage-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
    body: JSON.stringify({ action, uid })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    // disable_auth/enable_auth falhas não são fatais — conta Firestore já foi atualizada
    if (action !== 'delete') {
      console.warn('manage-user non-fatal:', action, err.error);
      return;
    }
    throw new Error(err.error || `HTTP ${res.status}`);
  }
}
</script>
