<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Galeria</title>
  <meta name="description" content="Sua galeria de fotos no Nexus.">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    .gallery-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem .75rem calc(80px + 1.5rem);
    }
    .gallery-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; gap: .75rem;
    }
    .gallery-title { font-size: 20px; font-weight: 700; }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      margin-bottom: 1.5rem;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--indigo-400);
      background: var(--indigo-50);
    }
    .upload-zone i  { font-size: 38px; color: var(--purple-400); display: block; margin-bottom: .5rem; }
    .upload-zone p  { font-size: 14px; color: var(--text-secondary); margin: .2rem 0; }
    .upload-zone small { font-size: 12px; color: var(--text-muted); }

    /* Tabs */
    .gallery-tabs {
      display: flex; border-bottom: 0.5px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .gallery-tab {
      padding: .65rem 1.1rem; font-size: 14px; font-weight: 500;
      border: none; background: none; cursor: pointer;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      transition: color var(--transition), border-color var(--transition);
      display: flex; align-items: center; gap: .35rem;
    }
    .gallery-tab.active { color: var(--purple-600); border-bottom-color: var(--purple-600); }

    /* Gallery grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .gallery-item {
      position: relative; border-radius: 8px; overflow: hidden;
      background: var(--gray-100);
    }
    .gallery-item-img-wrap {
      aspect-ratio: 1; cursor: zoom-in; overflow: hidden;
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .22s, opacity .22s;
      display: block;
    }
    .gallery-item:hover img { transform: scale(1.06); opacity: .88; }
    .gallery-item-overlay {
      position: absolute; top: 0; left: 0; right: 0;
      aspect-ratio: 1;
      background: rgba(0,0,0,.28);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .18s;
      color: #fff; font-size: 28px; pointer-events: none;
    }
    .gallery-item:hover .gallery-item-overlay { opacity: 1; }
    .gallery-item-del {
      position: absolute; top: .4rem; right: .4rem;
      background: rgba(0,0,0,.55); border: none; color: #fff;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity .18s;
      font-size: 13px; z-index: 2;
    }
    .gallery-item:hover .gallery-item-del { opacity: 1; }
    .gallery-caption {
      padding: .3rem .5rem; font-size: 11px; color: var(--text-muted);
      cursor: text; min-height: 22px; line-height: 1.3;
      border-top: 0.5px solid var(--border);
      background: var(--surface);
    }
    .gallery-caption:empty::before { content: 'Adicionar legenda…'; color: var(--text-muted); opacity: .6; }
    .gallery-caption:focus { outline: none; color: var(--text-primary); background: var(--gray-50); }

    /* Album chips */
    .album-row-wrap { margin-bottom: .75rem; }
    .album-row { display: flex; gap: .4rem; flex-wrap: wrap; }
    .album-chip {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .25rem .75rem; border: 0.5px solid var(--border);
      border-radius: var(--radius-full); background: var(--surface);
      font-size: 12px; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all var(--transition);
    }
    .album-chip.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }
    .album-chip-del {
      font-size: 15px; line-height: 1; margin-left: .1rem;
      opacity: .65; cursor: pointer; transition: opacity var(--transition);
    }
    .album-chip:hover .album-chip-del { opacity: 1; }
    /* Album assign button on gallery item */
    .gallery-item-album {
      position: absolute; top: .4rem; right: 2.1rem;
      background: rgba(0,0,0,.55); border: none; color: #fff;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity .18s;
      font-size: 13px; z-index: 2;
    }
    .gallery-item:hover .gallery-item-album { opacity: 1; }
    /* Album picker dropdown (appended to body, fixed) */
    .album-picker-dropdown {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-md);
      z-index: 2000; min-width: 150px; overflow: hidden; position: fixed;
    }
    .album-pick-item {
      padding: .5rem .875rem; font-size: 13px;
      cursor: pointer; transition: background var(--transition);
      display: flex; align-items: center; gap: .4rem;
    }
    .album-pick-item:hover { background: var(--gray-50); }

    /* Upload progress overlay */
    .upload-progress {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.25rem;
      margin-bottom: 1.25rem; display: none;
    }
    .upload-progress-bar {
      height: 6px; background: var(--gray-200); border-radius: 3px;
      overflow: hidden; margin-top: .5rem;
    }
    .upload-progress-fill {
      height: 100%; background: var(--purple-600);
      border-radius: 3px; transition: width .3s;
    }

    @media (max-width: 480px) {
      .gallery-grid { gap: 2px; }
      .gallery-page { padding: 1rem .5rem calc(80px + 1rem); }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="toast" id="toast"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="gallery-page">

    <div class="gallery-header">
      <h1 class="gallery-title">Galeria de Fotos</h1>
      <div style="display:flex;gap:.5rem;align-items:center">
        <button class="btn btn-sm" id="album-create-btn" onclick="openAlbumInput()" title="Criar álbum">
          <i class="ti ti-folder-plus" aria-hidden="true"></i>
        </button>
        <div id="album-create-form" style="display:none;align-items:center;gap:.35rem">
          <input id="album-name-input" type="text" maxlength="40" placeholder="Nome do álbum"
                 style="height:32px;padding:0 .6rem;font-size:13px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-primary);font-family:var(--font-sans)"
                 onkeydown="if(event.key==='Enter')createAlbum();if(event.key==='Escape')closeAlbumInput()">
          <button class="btn btn-primary btn-sm" onclick="createAlbum()">OK</button>
          <button class="btn btn-sm" onclick="closeAlbumInput()"><i class="ti ti-x"></i></button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('file-input').click()">
          <i class="ti ti-plus" aria-hidden="true"></i> Adicionar fotos
        </button>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleUpload(this)">
    </div>

    <!-- Upload zone (arrastar ou clicar) -->
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      <i class="ti ti-cloud-upload" aria-hidden="true"></i>
      <p><strong>Clique aqui</strong> ou arraste fotos para adicionar</p>
      <small>JPG, PNG, GIF, WEBP · Máximo 8 MB por foto · Até 10 por vez</small>
    </div>

    <!-- Progresso de upload -->
    <div class="upload-progress" id="upload-progress">
      <div id="upload-progress-label" style="font-size:13px;font-weight:500"></div>
      <div class="upload-progress-bar">
        <div class="upload-progress-fill" id="upload-progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Album filter row (only for own gallery tab) -->
    <div class="album-row-wrap" id="album-row-wrap" style="display:none">
      <div class="album-row" id="album-row"></div>
    </div>

    <!-- Tabs -->
    <div class="gallery-tabs">
      <button class="gallery-tab active" id="tab-btn-galeria" onclick="switchTab('galeria')">
        <i class="ti ti-photo" aria-hidden="true"></i> Minha galeria
      </button>
      <button class="gallery-tab" id="tab-btn-posts" onclick="switchTab('posts')">
        <i class="ti ti-news" aria-hidden="true"></i> Fotos de posts
      </button>
    </div>

    <!-- Conteúdo -->
    <div id="gallery-content">
      <div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser  = null;
let _activeTab   = 'galeria';
let _gallerySrcs = [];
let _activeAlbum = null;
let _albums      = [];

requireAuth(async user => {
  currentUser = user;
  const ud = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(ud, 'gallery');
  loadAlbums();
  loadContent();
  setupDragDrop();
});

// ── Albums ────────────────────────────────────────────────────
async function loadAlbums() {
  try {
    const snap = await db.collection('users').doc(currentUser.uid)
      .collection('albums').orderBy('createdAt', 'asc').get();
    _albums = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(_) { _albums = []; }
  renderAlbumRow();
}

function renderAlbumRow() {
  const el = document.getElementById('album-row');
  if (!el) return;
  const chips = [
    `<button class="album-chip${!_activeAlbum ? ' active' : ''}" onclick="filterByAlbum(null)">
       <i class="ti ti-photos" aria-hidden="true"></i> Todas
     </button>`,
    ..._albums.map(a => `<button class="album-chip${_activeAlbum === a.id ? ' active' : ''}" onclick="filterByAlbum('${a.id}')">
       <i class="ti ti-folder" aria-hidden="true"></i> ${sanitize(a.name)}
       <span class="album-chip-del" onclick="event.stopPropagation();deleteAlbum('${a.id}','${sanitize(a.name).replace(/'/g, "\\'")}')" title="Excluir álbum">×</span>
     </button>`)
  ].join('');
  el.innerHTML = chips;
  document.getElementById('album-row-wrap').style.display = _albums.length || _activeAlbum ? '' : 'none';
}

function filterByAlbum(albumId) {
  _activeAlbum = albumId;
  renderAlbumRow();
  loadContent();
}

function openAlbumInput() {
  document.getElementById('album-create-btn').style.display = 'none';
  const form = document.getElementById('album-create-form');
  form.style.display = 'flex';
  document.getElementById('album-name-input').focus();
}

function closeAlbumInput() {
  document.getElementById('album-create-btn').style.display = '';
  document.getElementById('album-create-form').style.display = 'none';
  document.getElementById('album-name-input').value = '';
}

async function createAlbum() {
  const input = document.getElementById('album-name-input');
  const name = input?.value.trim();
  if (!name) return;
  try {
    await db.collection('users').doc(currentUser.uid).collection('albums').add({
      name,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeAlbumInput();
    await loadAlbums();
    showToast(`Álbum "${name}" criado!`);
  } catch(e) { showToast('Erro ao criar álbum.'); }
}

async function deleteAlbum(id, name) {
  if (!confirm(`Excluir o álbum "${name}"? As fotos não serão excluídas.`)) return;
  try {
    await db.collection('users').doc(currentUser.uid).collection('albums').doc(id).delete();
    if (_activeAlbum === id) _activeAlbum = null;
    await loadAlbums();
    loadContent();
  } catch(e) { showToast('Erro ao excluir álbum.'); }
}

async function assignPhotoToAlbum(photoId, btn) {
  document.querySelectorAll('.album-picker-dropdown').forEach(el => el.remove());
  if (!_albums.length) { showToast('Crie um álbum primeiro.'); return; }
  const rect   = btn.getBoundingClientRect();
  const picker = document.createElement('div');
  picker.className = 'album-picker-dropdown';
  picker.style.top   = `${rect.bottom + 4}px`;
  picker.style.right = `${window.innerWidth - rect.right}px`;
  picker.innerHTML = [
    `<div class="album-pick-item" onclick="doAssign('${photoId}',null,null)"><i class="ti ti-x" style="font-size:11px"></i> Remover do álbum</div>`,
    ..._albums.map(a => `<div class="album-pick-item" onclick="doAssign('${photoId}','${a.id}','${sanitize(a.name).replace(/'/g, "\\'")}')">${sanitize(a.name)}</div>`)
  ].join('');
  document.body.appendChild(picker);
  setTimeout(() => {
    document.addEventListener('click', function h() {
      picker.remove();
      document.removeEventListener('click', h);
    }, { once: true });
  }, 0);
}

async function doAssign(photoId, albumId, albumName) {
  document.querySelectorAll('.album-picker-dropdown').forEach(el => el.remove());
  try {
    await db.collection('photos').doc(photoId).update({
      albumId: albumId || firebase.firestore.FieldValue.delete()
    });
    showToast(albumId ? `Adicionada ao álbum "${albumName}".` : 'Foto removida do álbum.');
  } catch(e) { showToast('Erro ao atribuir álbum.'); }
}

// ── Tabs ──────────────────────────────────────────────────────
function switchTab(tab) {
  _activeTab = tab;
  ['galeria','posts'].forEach(t => {
    document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
  });
  document.getElementById('upload-zone').style.display = tab === 'galeria' ? '' : 'none';
  document.getElementById('album-row-wrap').style.display = tab === 'galeria' && _albums.length ? '' : 'none';
  if (tab !== 'galeria') _activeAlbum = null;
  loadContent();
}

// ── Carregar conteúdo ─────────────────────────────────────────
async function loadContent() {
  const el = document.getElementById('gallery-content');
  el.innerHTML = '<div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>';

  try {
    let items = [];

    if (_activeTab === 'galeria') {
      let snap;
      try {
        snap = await db.collection('photos')
          .where('uid','==', currentUser.uid)
          .orderBy('createdAt','desc')
          .get();
      } catch(_) {
        snap = await db.collection('photos').where('uid','==', currentUser.uid).get();
      }
      items = snap.docs.map(d => ({ id: d.id, url: d.data().imageURL, caption: d.data().caption || '', albumId: d.data().albumId || null, deletable: true }));
      if (_activeAlbum) items = items.filter(p => p.albumId === _activeAlbum);
    } else {
      let snap;
      try {
        snap = await db.collection('posts')
          .where('authorId','==', currentUser.uid)
          .orderBy('createdAt','desc')
          .get();
      } catch(_) {
        snap = await db.collection('posts').where('authorId','==', currentUser.uid).get();
      }
      items = snap.docs
        .filter(d => d.data().imageURL)
        .map(d => ({ id: d.id, url: d.data().imageURL, caption: '', deletable: false }));
    }

    if (!items.length) {
      el.innerHTML = `<div class="empty-state">
        <i class="ti ti-photo-off" aria-hidden="true"></i>
        <p>${_activeTab === 'galeria'
          ? 'Sua galeria está vazia.<br>Adicione fotos clicando em <strong>Adicionar fotos</strong>!'
          : 'Nenhum post com foto ainda.'}</p>
      </div>`;
      return;
    }

    _gallerySrcs = items.map(p => p.url);

    el.innerHTML = `<div class="gallery-grid" id="gallery-grid">
      ${items.map((p, i) => `
        <div class="gallery-item" data-idx="${i}">
          <div class="gallery-item-img-wrap" data-idx="${i}">
            <img src="${sanitize(p.url)}" alt="Foto ${i+1}" loading="lazy"
                 onerror="this.closest('.gallery-item').remove()">
            <div class="gallery-item-overlay"><i class="ti ti-zoom-in" aria-hidden="true"></i></div>
            ${p.deletable
              ? `<button class="gallery-item-del" data-id="${p.id}" title="Excluir foto" aria-label="Excluir foto">
                   <i class="ti ti-trash" aria-hidden="true"></i>
                 </button>
                 <button class="gallery-item-album" onclick="event.stopPropagation();assignPhotoToAlbum('${p.id}',this)" title="Atribuir a álbum" aria-label="Álbum">
                   <i class="ti ti-folder-plus" aria-hidden="true"></i>
                 </button>`
              : ''}
          </div>
          ${p.deletable
            ? `<div class="gallery-caption" contenteditable="true" data-id="${p.id}"
                    title="Clique para editar legenda">${sanitize(p.caption)}</div>`
            : (p.caption ? `<div class="gallery-caption">${sanitize(p.caption)}</div>` : '')
          }
        </div>`).join('')}
    </div>`;

    // Abrir lightbox ao clicar na foto
    document.getElementById('gallery-grid').addEventListener('click', e => {
      const delBtn = e.target.closest('.gallery-item-del');
      if (delBtn) { deletePhoto(delBtn.dataset.id); return; }
      if (e.target.closest('.gallery-caption')) return;
      const imgWrap = e.target.closest('.gallery-item-img-wrap[data-idx]');
      if (imgWrap) openLightbox(_gallerySrcs, parseInt(imgWrap.dataset.idx));
    });

    // Salvar caption ao sair do campo
    document.getElementById('gallery-grid').addEventListener('blur', async e => {
      const cap = e.target.closest('.gallery-caption[data-id]');
      if (!cap) return;
      const text = cap.textContent.trim().slice(0, 200);
      try {
        await db.collection('photos').doc(cap.dataset.id).update({ caption: text });
      } catch(_) {}
    }, true);

  } catch(e) {
    console.error('loadContent:', e);
    el.innerHTML = `<div class="empty-state">
      <i class="ti ti-wifi-off" aria-hidden="true"></i>
      <p>Erro ao carregar fotos.<br>Recarregue a página.</p>
    </div>`;
  }
}

// ── Upload ────────────────────────────────────────────────────
async function handleUpload(input) {
  const files = Array.from(input.files || [])
    .filter(f => f.type.startsWith('image/'))
    .slice(0, 10);
  input.value = '';
  if (!files.length) return;

  const progressEl = document.getElementById('upload-progress');
  const labelEl    = document.getElementById('upload-progress-label');
  const fillEl     = document.getElementById('upload-progress-fill');
  progressEl.style.display = 'block';

  let done = 0;
  let errors = 0;

  for (const file of files) {
    if (file.size > 8 * 1024 * 1024) {
      showToast(`"${file.name}" excede 8 MB e foi ignorado.`);
      errors++;
      continue;
    }
    labelEl.textContent = `Enviando ${done + 1} de ${files.length}…`;
    fillEl.style.width = `${Math.round((done / files.length) * 100)}%`;
    try {
      const imageURL = await uploadToCloudinary(file);
      await db.collection('photos').add({
        uid:      currentUser.uid,
        imageURL,
        caption:  '',
        ...(_activeAlbum ? { albumId: _activeAlbum } : {}),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      done++;
    } catch(e) {
      console.error('Upload error:', e);
      errors++;
      showToast(`Erro ao enviar "${file.name}".`);
    }
  }

  fillEl.style.width = '100%';
  labelEl.textContent = `${done} foto${done !== 1 ? 's' : ''} adicionada${done !== 1 ? 's' : ''}!`;

  setTimeout(() => {
    progressEl.style.display = 'none';
    fillEl.style.width = '0%';
  }, 1800);

  if (done > 0) {
    showToast(`${done} foto${done !== 1 ? 's' : ''} salva${done !== 1 ? 's' : ''} na galeria!`);
    if (_activeTab === 'galeria') loadContent();
  }
}

// ── Excluir foto ──────────────────────────────────────────────
async function deletePhoto(photoId) {
  if (!confirm('Excluir esta foto da galeria?')) return;
  try {
    await db.collection('photos').doc(photoId).delete();
    showToast('Foto excluída.');
    loadContent();
  } catch(e) {
    showToast('Erro ao excluir foto.');
  }
}

// ── Drag & Drop ───────────────────────────────────────────────
function setupDragDrop() {
  const zone = document.getElementById('upload-zone');
  if (!zone) return;

  zone.addEventListener('dragover', e => {
    e.preventDefault();
    zone.classList.add('drag-over');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (!files.length) return showToast('Nenhuma imagem detectada.');
    handleUpload({ files, value: '' });
  });
}
</script>
</body>
</html>
