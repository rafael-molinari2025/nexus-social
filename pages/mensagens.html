<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Mensagens</title>
  <meta name="description" content="Troca de mensagens diretas no Nexus.">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; }

    body { overflow: hidden; }

    .chat-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - var(--topbar-h));
      margin-top: var(--topbar-h);
      background: var(--bg);
    }

    /* ── Sidebar (conversation list) ── */
    .chat-sidebar {
      border-right: 0.5px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-sidebar-header {
      padding: 1rem 1.25rem .75rem;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }
    .chat-sidebar-title {
      font-size: 18px; font-weight: 700; color: var(--text-primary);
      margin-bottom: .75rem;
    }
    .chat-search-wrap {
      position: relative;
    }
    .chat-search-wrap i {
      position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 15px; pointer-events: none;
    }
    .chat-search {
      width: 100%; padding: .55rem .75rem .55rem 2.4rem;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: var(--gray-100); font-size: 13px;
      color: var(--text-primary); font-family: var(--font-sans);
      outline: none; transition: border-color var(--transition);
    }
    .chat-search:focus { border-color: var(--purple-400); background: var(--surface); }

    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1.25rem; cursor: pointer;
      transition: background var(--transition); border-bottom: 0.5px solid var(--border);
      position: relative;
    }
    .conv-item:hover { background: var(--gray-50); }
    .conv-item.active { background: var(--indigo-50); }
    .conv-item-info { flex: 1; min-width: 0; }
    .conv-item-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .conv-item-preview {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .conv-item-preview.unread { color: var(--purple-600); font-weight: 600; }
    .conv-item-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .conv-unread-badge {
      position: absolute; top: .75rem; right: 1rem;
      background: var(--purple-600); color: #fff;
      border-radius: 10px; font-size: 10px; font-weight: 700;
      padding: 1px 6px; min-width: 18px; text-align: center;
    }

    .chat-empty-sidebar {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem; text-align: center;
      color: var(--text-muted); gap: .5rem; flex: 1;
    }
    .chat-empty-sidebar i { font-size: 36px; opacity: .4; }
    .chat-empty-sidebar p { font-size: 13px; line-height: 1.5; }

    /* ── Main chat area ── */
    .chat-main {
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg);
    }

    .chat-welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; color: var(--text-muted); text-align: center;
      padding: 2rem;
    }
    .chat-welcome-icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--indigo-50); display: flex; align-items: center; justify-content: center;
      margin-bottom: .5rem;
    }
    .chat-welcome-icon i { font-size: 36px; color: var(--purple-600); }
    .chat-welcome h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); }
    .chat-welcome p { font-size: 14px; max-width: 280px; line-height: 1.5; }

    /* Chat header */
    .chat-header {
      display: flex; align-items: center; gap: .75rem;
      padding: .875rem 1.25rem; border-bottom: 0.5px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { font-size: 15px; font-weight: 600; }
    .chat-header-status { font-size: 12px; color: var(--text-muted); }

    /* Messages area */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 1rem 1.25rem;
      display: flex; flex-direction: column; gap: .5rem;
      scroll-behavior: smooth;
      transition: background .3s;
    }

    /* Theme picker */
    .theme-picker-sheet {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 800; display: flex; align-items: flex-end; justify-content: center;
    }
    .theme-picker-inner {
      background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      width: min(480px, 100vw); padding: 1.25rem 1.25rem 2rem;
    }
    .theme-swatches { display: flex; gap: .65rem; flex-wrap: wrap; margin-top: .75rem; }
    .theme-swatch {
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform .15s, border-color .15s;
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
    }
    .theme-swatch.active { border-color: var(--text-primary); transform: scale(1.15); }
    .theme-swatch:hover { transform: scale(1.1); }

    /* Date divider */
    .msg-date-divider {
      text-align: center; font-size: 11px; color: var(--text-muted);
      margin: .5rem 0; position: relative;
    }
    .msg-date-divider::before, .msg-date-divider::after {
      content: ''; position: absolute; top: 50%; width: 35%;
      height: 0.5px; background: var(--border);
    }
    .msg-date-divider::before { left: 0; }
    .msg-date-divider::after { right: 0; }

    /* Bubble */
    .msg-row {
      display: flex; align-items: flex-end; gap: .4rem;
      animation: msgIn .18s ease-out;
    }
    .msg-row.mine { flex-direction: row-reverse; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-wrap {
      max-width: 65%; min-width: 0; display: flex; flex-direction: column;
    }
    .msg-row.mine .msg-wrap { align-items: flex-end; }
    .msg-bubble {
      padding: .55rem .85rem;
      border-radius: 18px; font-size: 14px; line-height: 1.45;
      word-break: break-word; position: relative;
    }
    .msg-row:not(.mine) .msg-bubble {
      background: var(--surface); border: 0.5px solid var(--border);
      color: var(--text-primary); border-bottom-left-radius: 4px;
    }
    .msg-row.mine .msg-bubble {
      background: var(--purple-600); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 10px; color: var(--text-muted); margin-top: 2px;
      flex-shrink: 0;
    }
    .msg-row.mine .msg-time { text-align: right; }
    .msg-read-check {
      font-size: 12px; color: rgba(255,255,255,.5);
      margin-left: .25rem; transition: color .3s;
    }
    .msg-read-check.read { color: #60a5fa; }

    /* ── Reply ── */
    .msg-reply-btn {
      opacity: 0; transition: opacity .15s;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 13px; padding: 0 2px;
      vertical-align: middle;
    }
    .msg-row:hover .msg-reply-btn { opacity: 1; }
    .reply-quote {
      background: rgba(83,74,183,.09);
      border-left: 3px solid var(--purple-600);
      border-radius: 4px; padding: .25rem .5rem;
      margin-bottom: .3rem; cursor: pointer;
    }
    .reply-quote-name { font-size: 11px; font-weight: 700; color: var(--purple-600); }
    .reply-quote-text { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .reply-preview-bar {
      padding: .4rem .875rem; background: var(--surface);
      border-top: 0.5px solid var(--border);
      display: flex; align-items: center; gap: .5rem; flex-shrink: 0;
    }

    .msg-reactions { display: flex; flex-wrap: wrap; gap: .2rem; margin-top: .25rem; }
    .msg-reaction-pill {
      font-size: 12px; background: var(--gray-100); border: 0.5px solid var(--border);
      border-radius: var(--radius-full); padding: .1rem .45rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: .2rem;
      transition: background var(--transition), transform var(--transition);
    }
    .msg-reaction-pill:hover { background: var(--gray-200); transform: scale(1.1); }
    .msg-reaction-pill.mine { background: var(--indigo-50); border-color: var(--indigo-300); }
    .msg-reaction-picker-wrap {
      position: fixed; background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-full); box-shadow: var(--shadow-lg);
      display: flex; gap: .05rem; padding: .3rem .5rem; z-index: 500;
    }
    .msg-react-emoji-btn {
      font-size: 21px; padding: .1rem .2rem; border: none; background: none;
      cursor: pointer; border-radius: var(--radius-sm);
      transition: transform .15s ease;
    }
    .msg-react-emoji-btn:hover { transform: scale(1.35); }

    /* Typing indicator */
    .typing-indicator {
      display: none; align-items: center; gap: .35rem;
      padding: .4rem .75rem; font-size: 12px; color: var(--text-muted);
    }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted); animation: typingBounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-5px); }
    }

    /* Input area */
    .chat-input-area {
      display: flex; align-items: flex-end; gap: .75rem;
      padding: .875rem 1.25rem; border-top: 0.5px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .chat-input-wrap { flex: 1; position: relative; }
    .chat-input {
      width: 100%; padding: .65rem 3rem .65rem 1rem;
      border: 1.5px solid var(--border); border-radius: 22px;
      background: var(--gray-100); font-size: 14px;
      font-family: var(--font-sans); resize: none;
      outline: none; max-height: 120px; overflow-y: auto;
      line-height: 1.4; color: var(--text-primary);
      transition: border-color var(--transition), background var(--transition);
    }
    .chat-input:focus { border-color: var(--purple-400); background: var(--surface); }
    .chat-send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--purple-600); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: all var(--transition);
      font-size: 17px;
    }
    .chat-send-btn:hover { background: var(--purple-700, #4338ca); transform: scale(1.05); }
    .chat-send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .chat-send-btn.recording { background: var(--coral-400, #f87171) !important; animation: pulse-rec .9s infinite; }
    @keyframes pulse-rec { 0%,100%{opacity:1} 50%{opacity:.55} }
    .voice-msg-player { display:flex; align-items:center; gap:.5rem; min-width:160px; }
    .voice-msg-player audio { flex:1; height:32px; min-width:0; border-radius:20px; }

    /* New conversation modal */
    .new-conv-btn {
      display: flex; align-items: center; justify-content: center;
      gap: .4rem; width: 100%; padding: .55rem;
      background: var(--purple-600); color: #fff; border: none;
      border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: var(--font-sans);
      transition: opacity var(--transition); margin-top: .65rem;
    }
    .new-conv-btn:hover { opacity: .9; }

    /* User search results */
    .user-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-md);
      z-index: 50; max-height: 240px; overflow-y: auto; margin-top: 4px;
    }
    .user-result-item {
      display: flex; align-items: center; gap: .65rem;
      padding: .65rem 1rem; cursor: pointer;
      transition: background var(--transition);
    }
    .user-result-item:hover { background: var(--gray-50, #fafafa); }
    .user-result-name { font-size: 13px; font-weight: 500; }
    .user-result-username { font-size: 11px; color: var(--text-muted); }

    /* Responsive */
    @media (max-width: 768px) {
      .chat-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      body { overflow: hidden; }
      .chat-layout {
        grid-template-columns: 1fr;
        /* svh = small viewport height: exclui a barra de endereço do browser mobile */
        height: calc(100svh - var(--topbar-h) - 60px);
      }
      .chat-sidebar { width: 100%; }
      .chat-main { display: none; }
      .chat-sidebar.hidden { display: none; }

      /* position:fixed garante que o chat ocupe exatamente o espaço visível,
         independente de 100vh incluir chrome do browser ou não */
      .chat-main.show {
        display: flex;
        position: fixed;
        top: var(--topbar-h);
        bottom: calc(60px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--bg);
        height: auto;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-back-btn {
        display: flex !important;
        width: 36px; height: 36px; border: none; background: none;
        border-radius: var(--radius-md); cursor: pointer;
        align-items: center; justify-content: center;
        color: var(--text-secondary); font-size: 20px;
        flex-shrink: 0;
      }
    }
    @media (min-width: 769px) {
      .chat-back-btn { display: none; }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="toast" id="toast"></div>

<!-- Poll creation modal -->
<div class="modal-overlay" id="poll-modal" style="display:none" onclick="if(event.target===this)closePollModal()">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h2 class="modal-title"><i class="ti ti-chart-bar" style="margin-right:.35rem"></i>Criar enquete</h2>
      <button class="modal-close" onclick="closePollModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:.75rem">
      <div>
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:.3rem">Pergunta</label>
        <input type="text" id="poll-question" class="form-input" placeholder="Qual é a sua pergunta?" maxlength="100">
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:.3rem">Opções</label>
        <div id="poll-options-wrap" style="display:flex;flex-direction:column;gap:.4rem">
          <input type="text" class="form-input poll-opt" placeholder="Opção 1" maxlength="60">
          <input type="text" class="form-input poll-opt" placeholder="Opção 2" maxlength="60">
        </div>
        <button class="btn btn-sm" style="margin-top:.5rem" onclick="addPollOption()" id="poll-add-opt">
          <i class="ti ti-plus"></i> Adicionar opção
        </button>
      </div>
    </div>
    <div class="modal-footer" style="display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn" onclick="closePollModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitChatPoll()"><i class="ti ti-send"></i> Enviar enquete</button>
    </div>
  </div>
</div>

<div class="chat-layout">
  <!-- ══ Sidebar ══ -->
  <aside class="chat-sidebar" id="chat-sidebar">
    <div class="chat-sidebar-header">
      <div class="chat-sidebar-title">Mensagens</div>
      <div class="chat-search-wrap" style="position:relative">
        <i class="ti ti-search"></i>
        <input class="chat-search" id="user-search" type="text"
               placeholder="Buscar ou iniciar conversa…"
               oninput="searchUsers(this.value)" autocomplete="off">
        <div class="user-results" id="user-results" style="display:none"></div>
      </div>
      <div style="display:flex;gap:.4rem;margin-top:.65rem">
        <button class="new-conv-btn" style="flex:1" onclick="document.getElementById('user-search').focus()">
          <i class="ti ti-edit"></i> Nova conversa
        </button>
        <button class="new-conv-btn" style="flex:1" onclick="openGroupModal()" title="Novo grupo">
          <i class="ti ti-users-group"></i> Novo grupo
        </button>
      </div>
    </div>
    <div class="conv-list" id="conv-list">
      <div class="chat-empty-sidebar">
        <div class="spinner" style="width:28px;height:28px"></div>
      </div>
    </div>
  </aside>

  <!-- ══ Main area ══ -->
  <main class="chat-main" id="chat-main">
    <div class="chat-welcome" id="chat-welcome">
      <div class="chat-welcome-icon"><i class="ti ti-messages"></i></div>
      <h2>Suas mensagens</h2>
      <p>Selecione uma conversa ou busque um usuário para começar a conversar.</p>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser     = null;
let activeConvId    = null;
let messagesUnsub   = null;
let convsUnsub      = null;
let typingUnsub     = null;
let searchTimer        = null;
let onlineStatusUnsub  = null;
let _firstMsgDoc      = null;
let _loadingOldMsgs   = false;
let _otherLastReadAt  = null;
let _replyTarget      = null;
const MSG_PAGE_SIZE   = 50;

requireAuth(async user => {
  currentUser = user;
  const ud = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(ud, 'messages');

  // Carregar lista de conversas
  loadConversations();

  // Abrir conversa da URL — openOrCreateConversation usa Firestore diretamente,
  // não depende do sidebar estar renderizado; activeConvId garante o highlight posterior
  const withUid = new URLSearchParams(location.search).get('with');
  if (withUid) openOrCreateConversation(withUid);
});

// ── Conversation ID (deterministic) ─────────────────────────────
function convId(uid1, uid2) {
  return [uid1, uid2].sort().join('_');
}

// ── Load conversation list ───────────────────────────────────────
function loadConversations() {
  if (convsUnsub) convsUnsub();

  const renderConvs = async snap => {
    const list = document.getElementById('conv-list');
    const activeDocs = snap.docs.filter(doc => {
      const deleted = doc.data().deletedFor || [];
      return !deleted.includes(currentUser.uid);
    });
    if (activeDocs.length === 0) {
      list.innerHTML = `<div class="chat-empty-sidebar">
        <i class="ti ti-message-off"></i>
        <p>Nenhuma conversa ainda.<br>Busque um usuário para começar!</p>
      </div>`;
      return;
    }
    const convs = await Promise.all(activeDocs.map(async doc => {
      const d = doc.data();
      if (d.type === 'group') return { id: doc.id, data: d, other: null };
      const otherUid = d.participants.find(u => u !== currentUser.uid);
      const other = await getUserData(otherUid) || { displayName: 'Usuário', uid: otherUid };
      return { id: doc.id, data: d, other };
    }));
    list.innerHTML = convs.map(c =>
      c.data.type === 'group' ? groupConvItemHTML(c.id, c.data) : convItemHTML(c)
    ).join('');
    if (activeConvId) {
      const el = document.getElementById(`conv-${activeConvId}`);
      if (el) el.classList.add('active');
    }
  };

  convsUnsub = db.collection('conversations')
    .where('participants', 'array-contains', currentUser.uid)
    .orderBy('lastMessageAt', 'desc')
    .onSnapshot(renderConvs, async err => {
      console.warn('Convs index not ready, falling back to client sort:', err);
      // Fallback without orderBy while index builds
      convsUnsub = db.collection('conversations')
        .where('participants', 'array-contains', currentUser.uid)
        .onSnapshot(async snap => {
          const sorted = { docs: [...snap.docs].sort((a, b) => {
            const ta = a.data().lastMessageAt;
            const tb = b.data().lastMessageAt;
            if (!ta) return 1; if (!tb) return -1;
            return tb.toMillis() - ta.toMillis();
          }), empty: snap.empty };
          await renderConvs(sorted);
        }, e => {
          console.error('Convs error:', e);
          const list = document.getElementById('conv-list');
          list.innerHTML = `<div class="chat-empty-sidebar">
            <i class="ti ti-alert-circle"></i>
            <p>Erro ao carregar conversas.<br>Tente recarregar a página.</p>
          </div>`;
        });
    });
}

function convItemHTML({ id, data: d, other }) {
  const cl = getAvatarColor(other.uid);
  const av = other.photoURL
    ? `<img src="${other.photoURL}" alt="${other.displayName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : `<span style="color:${cl.color}">${getInitials(other.displayName)}</span>`;
  const unread = (d.unread || {})[currentUser.uid] || 0;
  const preview = d.lastMessage || '';
  const time = d.lastMessageAt ? timeAgo(d.lastMessageAt) : '';
  return `
    <div class="conv-item" id="conv-${id}" onclick="openConversation('${id}', '${other.uid}')">
      <div class="avatar avatar-48" style="background:${cl.bg};flex-shrink:0">${av}</div>
      <div class="conv-item-info">
        <div class="conv-item-name">${sanitize(other.displayName)}</div>
        <div class="conv-item-preview${unread ? ' unread' : ''}">${sanitize(preview)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.25rem;flex-shrink:0">
        <span class="conv-item-time">${time}</span>
        ${unread ? `<span class="conv-unread-badge">${unread}</span>` : ''}
      </div>
    </div>`;
}

// ── Open or create conversation ──────────────────────────────────
async function openOrCreateConversation(otherUid) {
  const cid = convId(currentUser.uid, otherUid);
  const ref = db.collection('conversations').doc(cid);
  try {
    const snap = await ref.get();
    if (!snap.exists) {
      await ref.set({
        participants: [currentUser.uid, otherUid],
        lastMessage: '',
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        unread: { [currentUser.uid]: 0, [otherUid]: 0 },
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  } catch(e) {
    console.error('openOrCreateConversation:', e);
    showToast('Não foi possível abrir a conversa. Tente novamente.');
    return;
  }
  openConversation(cid, otherUid);
}

// ── Render chat thread ───────────────────────────────────────────
async function openConversation(cid, otherUid) {
  activeConvId = cid;

  _otherLastReadAt = null;
  // Mark as read + record lastReadAt for this user
  await db.collection('conversations').doc(cid).update({
    [`unread.${currentUser.uid}`]: 0,
    [`lastReadAt.${currentUser.uid}`]: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(() => {});

  // Deactivate old, activate new
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  const convEl = document.getElementById(`conv-${cid}`);
  if (convEl) convEl.classList.add('active');

  const other = await getUserData(otherUid) || { displayName: 'Usuário', uid: otherUid };
  const cl = getAvatarColor(other.uid);
  const av = other.photoURL
    ? `<img src="${other.photoURL}" alt="${other.displayName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : `<span style="color:${cl.color}">${getInitials(other.displayName)}</span>`;

  document.getElementById('chat-main').innerHTML = `
    <div class="chat-header">
      <button class="chat-back-btn" onclick="mobileBackToList()" title="Voltar" aria-label="Voltar para lista">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </button>
      <div class="avatar avatar-40" style="background:${cl.bg};cursor:pointer"
           onclick="location.href='perfil.html?uid=${other.uid}'">${av}</div>
      <div class="chat-header-info">
        <div class="chat-header-name">${sanitize(other.displayName)}</div>
        <div class="chat-header-status" id="chat-status">online</div>
      </div>
      <a href="perfil.html?uid=${other.uid}" class="btn btn-sm" title="Ver perfil">
        <i class="ti ti-user"></i>
      </a>
      <button class="btn btn-sm" onclick="toggleChatSearch()" title="Buscar mensagens" id="chat-search-btn">
        <i class="ti ti-search"></i>
      </button>
      <button class="btn btn-sm" onclick="openThemePicker('${cid}')" title="Tema da conversa">
        <i class="ti ti-palette"></i>
      </button>
      <button class="btn btn-sm" onclick="toggleDisappearing('${cid}')" title="Mensagens temporárias" id="disappearing-btn">
        <i class="ti ti-clock-off"></i>
      </button>
      <button class="btn btn-sm" onclick="deleteConversation('${cid}')" title="Excluir conversa" style="color:var(--coral-400)">
        <i class="ti ti-trash"></i>
      </button>
    </div>
    <div id="chat-search-bar" style="display:none;padding:.4rem 1rem;border-bottom:0.5px solid var(--border);background:var(--surface);align-items:center;gap:.5rem">
      <i class="ti ti-search" style="color:var(--text-muted);font-size:14px"></i>
      <input type="text" id="chat-search-input" placeholder="Buscar na conversa..." style="flex:1;border:none;outline:none;background:none;font-size:13px;font-family:var(--font-sans);color:var(--text-primary)"
        oninput="filterChatMessages(this.value)">
      <span id="chat-search-count" style="font-size:12px;color:var(--text-muted)"></span>
      <button onclick="toggleChatSearch()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:0"><i class="ti ti-x"></i></button>
    </div>
    <div id="disappearing-banner" style="display:none;padding:.3rem 1rem;background:rgba(83,74,183,.12);align-items:center;gap:.4rem;font-size:12px;color:var(--purple-600);border-bottom:0.5px solid var(--border)">
      <i class="ti ti-clock-off" style="font-size:13px"></i>
      Modo temporário ativo — mensagens desaparecem após 24h
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="typing-indicator" id="typing-indicator" style="display:none;padding:.25rem 1.25rem;align-items:center;gap:.5rem">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span style="font-size:12px;color:var(--text-muted)">${sanitize(other.displayName)} está digitando…</span>
    </div>
    <div class="reply-preview-bar" id="reply-preview-bar" style="display:none">
      <div style="flex:1;border-left:3px solid var(--purple-600);padding-left:.5rem;overflow:hidden">
        <div style="font-size:11px;font-weight:700;color:var(--purple-600)" id="reply-preview-name"></div>
        <div style="font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="reply-preview-text"></div>
      </div>
      <button onclick="clearReply()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;flex-shrink:0"><i class="ti ti-x"></i></button>
    </div>
    <div class="chat-input-area">
      <input type="file" id="chat-img-input" accept="image/*" style="display:none"
             onchange="sendImageMessage('${cid}', '${other.uid}', this)">
      <button class="chat-send-btn" style="background:var(--gray-100);color:var(--text-secondary);flex-shrink:0"
              onclick="document.getElementById('chat-img-input').click()" title="Enviar foto">
        <i class="ti ti-photo" style="font-size:16px"></i>
      </button>
      <button class="chat-send-btn" style="background:var(--gray-100);color:var(--text-secondary);flex-shrink:0"
              onclick="openPollModal('${cid}','dm')" title="Criar enquete">
        <i class="ti ti-chart-bar" style="font-size:16px"></i>
      </button>
      <button class="chat-send-btn" id="mic-btn" style="background:var(--gray-100);color:var(--text-secondary);flex-shrink:0"
              onclick="toggleVoiceRecording('${cid}','${other.uid}')" title="Mensagem de voz">
        <i class="ti ti-microphone" style="font-size:16px"></i>
      </button>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-input" rows="1"
          placeholder="Digite uma mensagem…"
          oninput="autoResize(this);handleTyping('${cid}')"
          onkeydown="handleKey(event, '${cid}', '${other.uid}')"></textarea>
      </div>
      <button class="chat-send-btn" id="send-btn" onclick="sendMessage('${cid}', '${other.uid}')">
        <i class="ti ti-send"></i>
      </button>
    </div>
  `;

  // Mobile: ocultar sidebar e exibir chat
  const sidebar = document.getElementById('chat-sidebar');
  const main    = document.getElementById('chat-main');
  if (window.innerWidth <= 768) {
    sidebar.classList.add('hidden');
    main.classList.add('show');
  }

  // Subscribe to other user's online status
  if (onlineStatusUnsub) { onlineStatusUnsub(); onlineStatusUnsub = null; }
  onlineStatusUnsub = db.collection('users').doc(otherUid).onSnapshot(snap => {
    const statusEl = document.getElementById('chat-status');
    if (!statusEl || !snap.exists) return;
    const d = snap.data();
    if (d && d.lastSeen) {
      const onlineNow = isOnline(d);
      statusEl.textContent = onlineNow ? 'Online agora' : `Visto ${timeAgo(d.lastSeen)}`;
      statusEl.style.color = onlineNow ? '#22c55e' : '';
    } else {
      statusEl.textContent = '';
    }
  }, () => {});

  // Listen for typing indicator from other user
  if (typingUnsub) { typingUnsub(); typingUnsub = null; }
  typingUnsub = db.collection('conversations').doc(cid).onSnapshot(snap => {
    const data = snap.data() || {};
    const typingMap = data.typing || {};
    const otherTyping = Object.entries(typingMap)
      .filter(([uid]) => uid !== currentUser.uid)
      .some(([, ts]) => ts && (Date.now() - ts.toMillis()) < 4000);
    const indicator = document.querySelector('.typing-indicator');
    if (indicator) {
      indicator.style.display = otherTyping ? 'flex' : 'none';
      if (otherTyping) scrollToBottom();
    }
    // Track when the other user last read (for blue double-check)
    const lastReadMap = data.lastReadAt || {};
    const newOtherRead = lastReadMap[otherUid] || null;
    if (newOtherRead && (!_otherLastReadAt || newOtherRead.toMillis() > _otherLastReadAt.toMillis())) {
      _otherLastReadAt = newOtherRead;
      // Re-render to update check colors without forcing a full reload
      const msgContainer = document.getElementById('chat-messages');
      if (msgContainer) {
        msgContainer.querySelectorAll('.msg-read-check').forEach(el => {
          const row = el.closest('.msg-row');
          if (!row) return;
          const msgDoc = row.id.replace('msg-', '');
          // We can't easily get createdAt here; just mark all existing as read
          el.classList.add('read');
        });
      }
    }
  });

  // Load disappearing mode state
  db.collection('conversations').doc(cid).get().then(convSnap => {
    const isDisappearing = convSnap.data()?.disappearing || false;
    const banner = document.getElementById('disappearing-banner');
    const btn = document.getElementById('disappearing-btn');
    if (banner) banner.style.display = isDisappearing ? 'flex' : 'none';
    if (btn) btn.style.color = isDisappearing ? 'var(--purple-600)' : '';
  }).catch(() => {});

  // Subscribe to messages (limited, most recent first)
  if (messagesUnsub) messagesUnsub();
  _firstMsgDoc = null; _loadingOldMsgs = false;
  let firstLoad = true;
  messagesUnsub = db.collection('conversations').doc(cid)
    .collection('messages')
    .orderBy('createdAt', 'asc')
    .limitToLast(MSG_PAGE_SIZE)
    .onSnapshot(snap => {
      if (snap.docs.length) _firstMsgDoc = snap.docs[0];
      const msgContainer = document.getElementById('chat-messages');
      const wasAtBottom = msgContainer
        ? msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight < 60
        : true;
      // Filter expired disappearing messages (older than 24h)
      const now = Date.now();
      const visibleDocs = snap.docs.filter(d => {
        const m = d.data();
        if (!m.vanishAt) return true;
        return (m.vanishAt.toMillis ? m.vanishAt.toMillis() : m.vanishAt) > now;
      });
      renderMessages(visibleDocs, other, snap.docs.length >= MSG_PAGE_SIZE);
      if (firstLoad || wasAtBottom) { scrollToBottom(); firstLoad = false; }
      db.collection('conversations').doc(cid).update({
        [`unread.${currentUser.uid}`]: 0,
        [`lastReadAt.${currentUser.uid}`]: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(() => {});
    });
}

async function loadOlderMessages(cid, other) {
  if (!_firstMsgDoc || _loadingOldMsgs) return;
  _loadingOldMsgs = true;
  const btn = document.getElementById('load-older-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i>'; }
  try {
    const snap = await db.collection('conversations').doc(cid)
      .collection('messages')
      .orderBy('createdAt', 'asc')
      .endBefore(_firstMsgDoc)
      .limitToLast(MSG_PAGE_SIZE)
      .get();
    if (!snap.docs.length) { btn?.remove(); _loadingOldMsgs = false; return; }
    _firstMsgDoc = snap.docs[0];
    const container = document.getElementById('chat-messages');
    const oldScrollHeight = container.scrollHeight;
    const olderHTML = buildMessagesHTML(snap.docs, other, false);
    container.insertAdjacentHTML('afterbegin', olderHTML);
    // Keep scroll position stable after prepend
    container.scrollTop = container.scrollHeight - oldScrollHeight;
    if (snap.docs.length < MSG_PAGE_SIZE) btn?.remove();
    else if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-history"></i> Ver mensagens anteriores'; }
  } catch(e) { showToast('Erro ao carregar mensagens anteriores.'); }
  _loadingOldMsgs = false;
}

function buildMessagesHTML(docs, other, showLoadOlder) {
  let html = showLoadOlder
    ? `<button id="load-older-btn" onclick="loadOlderMessages(activeConvId, ${JSON.stringify(other).replace(/"/g,'&quot;')})"
         style="display:flex;align-items:center;gap:.4rem;margin:.25rem auto .75rem;font-size:12px;color:var(--text-muted);background:none;border:0.5px solid var(--border);border-radius:var(--radius-full);padding:.3rem .8rem;cursor:pointer">
         <i class="ti ti-history"></i> Ver mensagens anteriores
       </button>` : '';
  let lastDate = '';
  docs.forEach(doc => {
    const m = doc.data();
    const isMine = m.senderId === currentUser.uid;
    const date = m.createdAt ? m.createdAt.toDate().toLocaleDateString('pt-BR', { day:'2-digit', month:'long' }) : '';
    if (date && date !== lastDate) {
      html += `<div class="msg-date-divider">${date}</div>`;
      lastDate = date;
    }
    const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : '';
    const cl = getAvatarColor(m.senderId);
    const av = isMine ? ''
      : (other.photoURL
          ? `<img src="${other.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : `<span style="color:${cl.color}">${getInitials(other.displayName)}</span>`);
    const avatarHtml = isMine ? '' : `<div class="avatar avatar-28" style="background:${cl.bg};flex-shrink:0">${av}</div>`;
    const reactions = m.reactions || {};
    const reactKeys = Object.keys(reactions).filter(e => (reactions[e]||[]).length > 0);
    const reactionsHtml = reactKeys.length
      ? `<div class="msg-reactions">${reactKeys.map(e => {
          const arr = reactions[e];
          const isMineReact = arr.includes(currentUser.uid);
          return `<button class="msg-reaction-pill${isMineReact?' mine':''}" onclick="reactMsg('${doc.id}','${e}')" title="${arr.length} ${isMineReact?'(você)':''}">${e} <span>${arr.length}</span></button>`;
        }).join('')}</div>` : '';
    const replyBlock = m.replyTo
      ? `<div class="reply-quote" onclick="document.getElementById('msg-${m.replyTo.msgId}')?.scrollIntoView({behavior:'smooth',block:'center'})">
           <div class="reply-quote-name">${sanitize(m.replyTo.senderName||'')}</div>
           <div class="reply-quote-text">${sanitize((m.replyTo.text||'📷 Imagem').slice(0,80))}</div>
         </div>` : '';
    const senderName = isMine ? 'Você' : (other.displayName||'Usuário');
    const previewText = m.imageURL && !m.text ? '📷 Imagem' : (m.text||'').slice(0,80);
    html += `<div class="msg-row${isMine ? ' mine' : ''}" id="msg-${doc.id}">
        ${avatarHtml}
        <div class="msg-wrap">
          <div class="msg-bubble" ondblclick="showMsgReactionPicker(event,'${doc.id}')" style="cursor:default${m.type==='poll'?';padding:.5rem':''}">
            ${replyBlock}
            ${m.type === 'poll' && m.poll
              ? chatPollHTML(doc.id, activeConvId, m.poll, isMine)
              : m.audioURL
                ? `<div class="voice-msg-player"><i class="ti ti-microphone" style="font-size:14px;flex-shrink:0"></i><audio src="${m.audioURL}" controls preload="metadata"></audio></div>`
                : (m.imageURL ? `<img src="${m.imageURL}" alt="Imagem" style="max-width:100%;border-radius:10px;display:block;margin-bottom:${m.text?'.4rem':'0'}" onclick="openLightbox(['${m.imageURL}'])">` : '')
                  + (m.text ? sanitize(m.text).replace(/\n/g,'<br>') : '')}
          </div>
          ${reactionsHtml}
          <div class="msg-time">
            <button class="msg-reply-btn" onclick="setReply('${doc.id}','${sanitize(senderName).replace(/'/g,"\\'")}','${previewText.replace(/'/g,"\\'")}')"><i class="ti ti-arrow-back-up"></i></button>
            <button class="msg-reply-btn" onclick="forwardMessage('${previewText.replace(/'/g,"\\'")}')" title="Encaminhar"><i class="ti ti-corner-up-right"></i></button>
            ${time}${isMine ? ` <i class="ti ti-checks msg-read-check${_otherLastReadAt && m.createdAt && m.createdAt.toMillis() <= _otherLastReadAt.toMillis() ? ' read' : ''}"></i>` : ''}
          </div>
        </div>
      </div>`;
  });
  return html;
}

function renderMessages(docs, other, showLoadOlder = false) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  if (docs.length === 0) {
    container.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px">
      Nenhuma mensagem ainda. Diga olá! 👋
    </div>`;
    return;
  }
  container.innerHTML = buildMessagesHTML(docs, other, showLoadOlder);
  if (activeConvId) applyChatTheme(activeConvId);
}

function scrollToBottom() {
  const el = document.getElementById('chat-messages');
  if (el) el.scrollTop = el.scrollHeight;
}

// ── Message reactions ──────────────────────────────────────────
const MSG_REACT_EMOJIS = ['❤️','😂','😮','😢','👍','🔥'];

function showMsgReactionPicker(event, msgId) {
  event.stopPropagation();
  document.getElementById('msg-rpicker')?.remove();
  const picker = document.createElement('div');
  picker.id = 'msg-rpicker';
  picker.className = 'msg-reaction-picker-wrap';
  const rect = event.currentTarget.getBoundingClientRect();
  picker.style.top = `${rect.top - 55}px`;
  picker.style.left = `${Math.min(rect.left, window.innerWidth - 270)}px`;
  picker.innerHTML = MSG_REACT_EMOJIS.map(e =>
    `<button class="msg-react-emoji-btn" onclick="event.stopPropagation();reactMsg('${msgId}','${e}');document.getElementById('msg-rpicker')?.remove()">${e}</button>`
  ).join('');
  document.body.appendChild(picker);
  setTimeout(() => {
    function closeH(e) { if (!e.target.closest('#msg-rpicker')) { picker.remove(); document.removeEventListener('click', closeH); } }
    document.addEventListener('click', closeH);
  }, 50);
}

async function reactMsg(msgId, emoji) {
  if (!activeConvId) return;
  const ref = db.collection('conversations').doc(activeConvId).collection('messages').doc(msgId);
  const snap = await ref.get();
  if (!snap.exists) return;
  const reactions = snap.data().reactions || {};
  const arr = reactions[emoji] || [];
  const hasReacted = arr.includes(currentUser.uid);
  await ref.update({
    [`reactions.${emoji}`]: hasReacted
      ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  });
}

// ── Forward message ──────────────────────────────────────────
async function forwardMessage(text) {
  const existing = document.getElementById('forward-modal');
  if (existing) { existing.remove(); return; }
  const modal = document.createElement('div');
  modal.id = 'forward-modal';
  modal.className = 'modal-overlay open';
  modal.innerHTML = `
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <span class="modal-title"><i class="ti ti-corner-up-right"></i> Encaminhar mensagem</span>
        <button class="btn btn-icon" onclick="document.getElementById('forward-modal').remove()"><i class="ti ti-x"></i></button>
      </div>
      <div style="padding:.75rem 1.25rem 1rem">
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:.75rem">Selecione uma conversa para encaminhar:</p>
        <div id="forward-conv-list" style="display:flex;flex-direction:column;gap:.4rem;max-height:280px;overflow-y:auto">
          <div class="spinner" style="margin:auto;padding:1rem"></div>
        </div>
      </div>
    </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);

  // Load conversations for picker
  const snap = await db.collection('conversations')
    .where('participants', 'array-contains', currentUser.uid)
    .orderBy('lastMessageAt', 'desc').limit(20).get();
  const el = document.getElementById('forward-conv-list');
  if (!el) return;
  if (snap.empty) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);text-align:center">Nenhuma conversa.</p>'; return; }
  const rows = await Promise.all(snap.docs.map(async doc => {
    const d = doc.data();
    const isGroup = d.type === 'group';
    let name, photoURL = null;
    if (isGroup) {
      name = d.name || 'Grupo';
    } else {
      const otherId = (d.participants || []).find(u => u !== currentUser.uid);
      const other = otherId ? (await getUserData(otherId)) : null;
      name = other?.displayName || 'Usuário';
      photoURL = other?.photoURL || null;
    }
    const cl = getAvatarColor(doc.id);
    const av = photoURL
      ? `<img src="${photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="font-size:12px;font-weight:700;color:${cl.color}">${isGroup ? (d.emoji||'👥') : getInitials(name)}</span>`;
    return `<div style="display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem;border-radius:var(--radius-md);cursor:pointer;transition:background var(--transition)"
         onmouseover="this.style.background='var(--gray-100)'" onmouseout="this.style.background=''"
         onclick="sendForwarded('${doc.id}','${text.replace(/'/g,"\\'")}','${isGroup?'group':'dm'}','${(d.participants||[]).filter(u=>u!==currentUser.uid)[0]||''}')">
      <div class="avatar avatar-36" style="background:${cl.bg};flex-shrink:0">${av}</div>
      <span style="font-size:13px;font-weight:500">${sanitize(name)}</span>
    </div>`;
  }));
  el.innerHTML = rows.join('');
}

async function sendForwarded(cid, text, type, otherUid) {
  document.getElementById('forward-modal')?.remove();
  try {
    const batch = db.batch();
    const msgRef = db.collection('conversations').doc(cid).collection('messages').doc();
    const msgData = {
      senderId: currentUser.uid,
      text: `↪ Encaminhado: ${text}`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      read: false
    };
    if (type === 'group') {
      msgData.senderName = currentUser.displayName;
      delete msgData.read;
    }
    batch.set(msgRef, msgData);
    const lastMsg = `↪ ${text.slice(0, 50)}`;
    const convUpdate = {
      lastMessage: lastMsg,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (otherUid) convUpdate[`unread.${otherUid}`] = firebase.firestore.FieldValue.increment(1);
    batch.update(db.collection('conversations').doc(cid), convUpdate);
    await batch.commit();
    showToast('Mensagem encaminhada!');
  } catch(e) { showToast('Erro ao encaminhar.'); }
}

// ── Reply ────────────────────────────────────────────────────
function setReply(msgId, senderName, text) {
  _replyTarget = { msgId, senderName, text };
  const bar = document.getElementById('reply-preview-bar');
  if (bar) {
    bar.style.display = 'flex';
    document.getElementById('reply-preview-name').textContent = senderName;
    document.getElementById('reply-preview-text').textContent = text || '📷 Imagem';
  }
  document.getElementById('chat-input')?.focus();
}

function clearReply() {

// ── Send message ─────────────────────────────────────────────────
async function sendMessage(cid, otherUid) {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  if (text.length > 1000) { showToast('Mensagem muito longa. Máximo 1000 caracteres.'); return; }

  input.value = '';
  autoResize(input);
  clearTyping(cid);

  const btn = document.getElementById('send-btn');
  if (btn) btn.disabled = true;

  try {
    const convSnap = await db.collection('conversations').doc(cid).get();
    const isDisappearing = convSnap.data()?.disappearing || false;
    const vanishAt = isDisappearing
      ? firebase.firestore.Timestamp.fromMillis(Date.now() + 24 * 3600 * 1000)
      : null;

    const batch = db.batch();

    // Add message
    const msgRef = db.collection('conversations').doc(cid).collection('messages').doc();
    const replySnap = _replyTarget ? { ..._replyTarget } : null;
    batch.set(msgRef, {
      senderId: currentUser.uid,
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      read: false,
      ...(vanishAt ? { vanishAt } : {}),
      ...(replySnap ? { replyTo: replySnap } : {})
    });
    clearReply();

    // Update conversation metadata
    const convRef = db.collection('conversations').doc(cid);
    batch.update(convRef, {
      lastMessage: text.length > 60 ? text.slice(0, 60) + '…' : text,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1)
    });

    await batch.commit();

    // Notificar o destinatário (apenas se não for ele mesmo)
    if (otherUid !== currentUser.uid) {
      createNotification(otherUid, 'scrap', {
        message: `${currentUser.displayName} te enviou uma mensagem.`,
        link: `/pages/mensagens.html`,
        fromUid: currentUser.uid,
        fromName: currentUser.displayName
      });
    }
  } catch(e) {
    console.error('Send error:', e);
    showToast('Erro ao enviar mensagem.');
    input.value = text;
  }

  if (btn) btn.disabled = false;
  input.focus();
}

function handleKey(e, cid, otherUid) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(cid, otherUid);
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Voice messages ───────────────────────────────────────────
let _mediaRecorder = null;
let _voiceChunks   = [];
let _isRecording   = false;

async function toggleVoiceRecording(cid, otherUid) {
  if (_isRecording) {
    _mediaRecorder?.stop();
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      _voiceChunks = [];
      _mediaRecorder = new MediaRecorder(stream);
      _mediaRecorder.ondataavailable = e => { if (e.data.size > 0) _voiceChunks.push(e.data); };
      _mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        _isRecording = false;
        const btn = document.getElementById('mic-btn');
        if (btn) { btn.classList.remove('recording'); btn.innerHTML = '<i class="ti ti-microphone" style="font-size:16px"></i>'; }
        if (!_voiceChunks.length) return;
        const blob = new Blob(_voiceChunks, { type: 'audio/webm' });
        if (blob.size < 1000) { showToast('Gravação muito curta.'); return; }
        showToast('Enviando áudio…');
        try {
          const audioFile = new File([blob], 'voice.webm', { type: 'audio/webm' });
          const audioURL  = await uploadVideoToCloudinary(audioFile);
          const isGroup   = otherUid === null || otherUid === 'null';
          const batch = db.batch();
          const msgRef = db.collection('conversations').doc(cid).collection('messages').doc();
          batch.set(msgRef, {
            senderId: currentUser.uid,
            ...(isGroup ? { senderName: currentUser.displayName } : {}),
            text: '',
            audioURL,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            read: false
          });
          const convRef = db.collection('conversations').doc(cid);
          const unreadUpdate = isGroup ? {} : { [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1) };
          batch.update(convRef, {
            lastMessage: '🎙 Áudio',
            lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
            ...unreadUpdate
          });
          await batch.commit();
        } catch(err) {
          console.error('Voice send error:', err);
          showToast('Erro ao enviar áudio.');
        }
      };
      _mediaRecorder.start();
      _isRecording = true;
      const btn = document.getElementById('mic-btn');
      if (btn) { btn.classList.add('recording'); btn.innerHTML = '<i class="ti ti-player-stop" style="font-size:16px"></i>'; }
    } catch(err) {
      showToast('Microfone não disponível.');
    }
  }
}

// ── User search ──────────────────────────────────────────────────
function searchUsers(q) {
  clearTimeout(searchTimer);
  const results = document.getElementById('user-results');
  if (!q.trim()) { results.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    try {
      const qLower = q.toLowerCase().trim();
      const snap = await db.collection('users').limit(100).get();
      const others = snap.docs.filter(d => {
        if (d.id === currentUser.uid) return false;
        const u = d.data();
        return (u.displayName || '').toLowerCase().includes(qLower) ||
               (u.username    || '').toLowerCase().includes(qLower);
      }).slice(0, 6);

      if (others.length === 0) {
        results.innerHTML = `<div style="padding:.75rem 1rem;font-size:13px;color:var(--text-muted)">Nenhum usuário encontrado.</div>`;
      } else {
        results.innerHTML = others.map(doc => {
          const u = doc.data();
          const cl = getAvatarColor(doc.id);
          const av = u.photoURL
            ? `<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
            : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
          return `<div class="user-result-item" onclick="startChat('${doc.id}')">
            <div class="avatar avatar-36" style="background:${cl.bg}">${av}</div>
            <div>
              <div class="user-result-name">${sanitize(u.displayName || 'Usuário')}</div>
              ${u.username ? `<div class="user-result-username">@${sanitize(u.username)}</div>` : ''}
            </div>
          </div>`;
        }).join('');
      }
      results.style.display = 'block';
    } catch(e) {
      console.error('searchUsers:', e);
      results.innerHTML = `<div style="padding:.75rem 1rem;font-size:13px;color:var(--text-muted)">Erro na busca. Tente novamente.</div>`;
      results.style.display = 'block';
    }
  }, 300);
}

function renderGroupMessages(docs, participantData, showLoadOlder) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  if (!docs.length) {
    container.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px">Nenhuma mensagem ainda. Diga olá! 👋</div>`;
    return;
  }
  let html = '';
  let lastDate = '';
  docs.forEach(doc => {
    const m  = doc.data();
    const isMine = m.senderId === currentUser.uid;
    const sender = participantData[m.senderId] || { displayName: 'Usuário', uid: m.senderId };
    const cl = getAvatarColor(m.senderId);
    const av = sender.photoURL
      ? `<img src="${sanitize(sender.photoURL)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="color:${cl.color}">${getInitials(sender.displayName)}</span>`;

    const date = m.createdAt ? m.createdAt.toDate().toLocaleDateString('pt-BR', { day:'2-digit', month:'long' }) : '';
    if (date && date !== lastDate) {
      html += `<div class="msg-date-divider">${date}</div>`;
      lastDate = date;
    }
    const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : '';
    const reactions = m.reactions || {};
    const reactKeys = Object.keys(reactions).filter(e => (reactions[e]||[]).length > 0);
    const reactionsHtml = reactKeys.length
      ? `<div class="msg-reactions">${reactKeys.map(e => {
          const arr = reactions[e];
          return `<button class="msg-reaction-pill${arr.includes(currentUser.uid)?' mine':''}" onclick="reactMsg('${doc.id}','${e}')">${e} <span>${arr.length}</span></button>`;
        }).join('')}</div>` : '';
    const replyBlockG = m.replyTo
      ? `<div class="reply-quote" onclick="document.getElementById('msg-${m.replyTo.msgId}')?.scrollIntoView({behavior:'smooth',block:'center'})">
           <div class="reply-quote-name">${sanitize(m.replyTo.senderName||'')}</div>

         </div>` : '';
    const gSenderName = isMine ? 'Você' : (sender.displayName||'Usuário');
    const gPreviewText = m.imageURL && !m.text ? '📷 Imagem' : (m.text||'').slice(0,80);
    html += `<div class="msg-row${isMine?' mine':''}" id="msg-${doc.id}">
      ${avatarHtml}
      <div class="msg-wrap">
        ${!isMine ? `<div style="font-size:11px;font-weight:600;color:${cl.bg === '#EEF2FF' ? '#4F46E5' : cl.color};margin-bottom:.15rem">${sanitize(sender.displayName)}</div>` : ''}

          ${replyBlockG}
          ${m.type === 'poll' && m.poll
            ? chatPollHTML(doc.id, activeConvId, m.poll, isMine)

              ? `<div class="voice-msg-player"><i class="ti ti-microphone" style="font-size:14px;flex-shrink:0"></i><audio src="${m.audioURL}" controls preload="metadata"></audio></div>`
              : (m.imageURL ? `<img src="${m.imageURL}" alt="" style="max-width:100%;border-radius:10px;display:block;margin-bottom:${m.text?'.4rem':'0'}" onclick="openLightbox(['${m.imageURL}'])">` : '')

        <div class="msg-time">

          ${time}
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

      lastMessageAt:  firebase.firestore.FieldValue.serverTimestamp(),

    });

    batch.update(db.collection('conversations').doc(cid), { lastMessage:'📷 Imagem', lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(), ...unreadUpdate });
    await batch.commit();
  } catch(e) { showToast('Erro ao enviar imagem.'); }
}

function handleGroupKey(e, cid) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendGroupMessage(cid); }
}

async function showGroupMembers(cid) {
  const convSnap = await db.collection('conversations').doc(cid).get();
  const d = convSnap.data();
  const modal = document.createElement('div');
  modal.className = 'modal-overlay open';
  modal.innerHTML = `
    <div class="modal" style="max-width:360px">
      <div class="modal-header">
        <span class="modal-title"><i class="ti ti-users"></i> Membros do grupo</span>
        <button class="btn btn-icon" onclick="this.closest('.modal-overlay').remove()"><i class="ti ti-x"></i></button>
      </div>
      <div id="group-member-list" style="max-height:320px;overflow-y:auto">
        <div style="display:flex;justify-content:center;padding:1rem"><div class="spinner"></div></div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const members = await Promise.all((d.participants||[]).map(uid => getUserData(uid)));
  const el = document.getElementById('group-member-list');
  if (!el) return;
  el.innerHTML = members.filter(Boolean).map(m => {
    const cl = getAvatarColor(m.uid);
    const av = m.photoURL
      ? `<img src="${sanitize(m.photoURL)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="color:${cl.color};font-size:12px;font-weight:700">${getInitials(m.displayName)}</span>`;
    const isAdmin = (d.admins||[]).includes(m.uid);
    return `<div style="display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem">
      <div class="avatar avatar-38" style="background:${cl.bg}">${av}</div>
      <div style="flex:1">
        <div style="font-size:13.5px;font-weight:600">${sanitize(m.displayName||'Usuário')}${m.uid===currentUser.uid?' (você)':''}</div>
        ${isAdmin ? '<div style="font-size:11px;color:var(--indigo-500);font-weight:600">Admin</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

function leaveGroup(cid) {
  confirmAction('Sair deste grupo?', async () => {
    await db.collection('conversations').doc(cid).update({
      participants: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
    });
    showToast('Você saiu do grupo.');
    mobileBackToList();
    loadConversations();
  });
}

// ── Group creation modal ──────────────────────────────────────
let _groupSelectedFriends = new Set();

async function openGroupModal() {
  const existing = document.getElementById('group-create-modal');
  if (existing) { existing.remove(); return; }
  const modal = document.createElement('div');
  modal.id = 'group-create-modal';
  modal.className = 'modal-overlay open';
  modal.innerHTML = `
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <span class="modal-title"><i class="ti ti-users-group"></i> Novo grupo</span>
        <button class="btn btn-icon" onclick="document.getElementById('group-create-modal').remove()"><i class="ti ti-x"></i></button>
      </div>
      <div style="display:flex;flex-direction:column;gap:.75rem">
        <div class="form-group">
          <label class="form-label">Nome do grupo</label>
          <input class="form-input" id="group-name-input" placeholder="Ex: Turma de Amigos" maxlength="40">
        </div>
        <div class="form-group">
          <label class="form-label">Emoji do grupo</label>
          <input class="form-input" id="group-emoji-input" placeholder="👥" maxlength="4" style="font-size:20px;text-align:center;width:64px">
        </div>
        <div class="form-group">
          <label class="form-label">Adicionar participantes</label>
          <input class="form-input" id="group-friend-search" placeholder="Buscar amigos…" oninput="searchFriendsForGroup(this.value)">
          <div id="group-friend-results" style="margin-top:.35rem;display:flex;flex-direction:column;gap:.25rem;max-height:180px;overflow-y:auto"></div>
        </div>
        <div id="group-selected-chips" style="display:flex;flex-wrap:wrap;gap:.35rem"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="createGroupConversation()">
          <i class="ti ti-check"></i> Criar grupo
        </button>
      </div>
    </div>`;
  _groupSelectedFriends.clear();
  document.body.appendChild(modal);
  // Load friends immediately
  searchFriendsForGroup('');
}

async function searchFriendsForGroup(q) {
  const container = document.getElementById('group-friend-results');
  if (!container) return;
  try {
    const qLower = q.toLowerCase().trim();
    const snap = await db.collection('friendships').where('users','array-contains', currentUser.uid).limit(30).get();
    const uids = [];
    snap.docs.forEach(d => d.data().users.forEach(u => { if (u !== currentUser.uid) uids.push(u); }));
    const users = (await Promise.all(uids.map(uid => getUserData(uid)))).filter(Boolean);
    const filtered = qLower
      ? users.filter(u => (u.displayName||'').toLowerCase().includes(qLower))
      : users;
    if (!filtered.length) { container.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:.25rem .5rem">Nenhum amigo encontrado.</div>`; return; }
    container.innerHTML = filtered.map(u => {
      const cl  = getAvatarColor(u.uid);
      const av  = u.photoURL
        ? `<img src="${sanitize(u.photoURL)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : `<span style="color:${cl.color};font-size:11px;font-weight:700">${getInitials(u.displayName)}</span>`;
      const sel = _groupSelectedFriends.has(u.uid);
      return `<div onclick="toggleGroupFriend('${u.uid}','${sanitize(u.displayName).replace(/'/g,"\\'")}',this)" style="display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:var(--radius-sm);cursor:pointer;background:${sel?'var(--indigo-50)':'transparent'};transition:background var(--transition)">
        <div class="avatar avatar-30" style="background:${cl.bg}">${av}</div>
        <span style="font-size:13.5px;font-weight:500;flex:1">${sanitize(u.displayName||'Usuário')}</span>
        <i class="ti ${sel?'ti-circle-check':'ti-circle'}" style="font-size:18px;color:${sel?'var(--indigo-500)':'var(--text-muted)'}"></i>
      </div>`;
    }).join('');
  } catch(e) { container.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:.25rem">Erro ao carregar.</div>`; }
}

function toggleGroupFriend(uid, name, row) {
  if (_groupSelectedFriends.has(uid)) {
    _groupSelectedFriends.delete(uid);
    row.style.background = 'transparent';
    row.querySelector('i').className = 'ti ti-circle';
    row.querySelector('i').style.color = 'var(--text-muted)';
  } else {
    _groupSelectedFriends.add(uid);
    row.style.background = 'var(--indigo-50)';
    row.querySelector('i').className = 'ti ti-circle-check';
    row.querySelector('i').style.color = 'var(--indigo-500)';
  }
  updateGroupChips();
}

async function updateGroupChips() {
  const chips = document.getElementById('group-selected-chips');
  if (!chips) return;
  if (!_groupSelectedFriends.size) { chips.innerHTML = ''; return; }
  const users = await Promise.all([..._groupSelectedFriends].map(uid => getUserData(uid)));
  chips.innerHTML = users.filter(Boolean).map(u =>
    `<div style="display:flex;align-items:center;gap:.3rem;background:var(--indigo-50);border:1px solid var(--indigo-200);border-radius:var(--radius-full);padding:.2rem .65rem;font-size:12.5px;font-weight:500;color:var(--indigo-700)">
      ${sanitize(u.displayName)}
      <button onclick="_groupSelectedFriends.delete('${u.uid}');searchFriendsForGroup(document.getElementById('group-friend-search')?.value||'');updateGroupChips()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;display:flex;align-items:center">×</button>
    </div>`
  ).join('');
}

async function createGroupConversation() {
  const name  = document.getElementById('group-name-input')?.value.trim();
  const emoji = document.getElementById('group-emoji-input')?.value.trim() || '👥';
  if (!name) return showToast('Digite um nome para o grupo.');
  if (_groupSelectedFriends.size < 1) return showToast('Adicione pelo menos 1 participante.');
  const btn = document.querySelector('#group-create-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Criando…'; }
  try {
    const participants = [currentUser.uid, ..._groupSelectedFriends];
    const unread = {};
    participants.forEach(uid => { unread[uid] = 0; });
    const convRef = await db.collection('conversations').add({
      type: 'group',
      name, emoji,
      participants,
      admins: [currentUser.uid],
      lastMessage: `${currentUser.displayName} criou o grupo.`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      unread,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('group-create-modal')?.remove();
    showToast(`Grupo "${name}" criado!`);
    openGroupConversation(convRef.id);
  } catch(e) {
    showToast('Erro ao criar grupo.');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Criar grupo'; }
  }
}

// ── Cleanup ao sair da página ────────────────────────────────────
window.addEventListener('beforeunload', () => {
  if (activeConvId) clearTyping(activeConvId);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && activeConvId) {
    clearTyping(activeConvId);
  }
});

// ── Deletar conversa ────────────────────────────────────────────
function deleteConversation(cid) {
  confirmAction('Excluir esta conversa? Ela sumirá apenas para você.', async () => {
    try {
      await db.collection('conversations').doc(cid).update({
        deletedFor: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
      });
      showToast('Conversa excluída.');
      mobileBackToList();
    } catch(e) { showToast('Erro ao excluir conversa.'); }
  });
}

// ── Chat themes ─────────────────────────────────────────────────
const CHAT_THEMES = [
  { id: 'default',  label: 'Padrão',   bg: null,          bubble: null },
  { id: 'ocean',    label: 'Oceano',   bg: '#e0f2fe',     bubble: '#0284c7' },
  { id: 'forest',   label: 'Floresta', bg: '#dcfce7',     bubble: '#16a34a' },
  { id: 'sunset',   label: 'Pôr do sol', bg: '#fff7ed',   bubble: '#ea580c' },
  { id: 'rose',     label: 'Rosa',     bg: '#fce7f3',     bubble: '#db2777' },
  { id: 'midnight', label: 'Midnight', bg: '#1e293b',     bubble: '#6366f1' },
  { id: 'gold',     label: 'Dourado',  bg: '#fef9c3',     bubble: '#b45309' },
  { id: 'lavender', label: 'Lavanda',  bg: '#f3e8ff',     bubble: '#7c3aed' },
];
const THEME_KEY = 'nexus_chat_theme_';

function getChatTheme(cid) {
  try { return JSON.parse(localStorage.getItem(THEME_KEY + cid) || 'null'); } catch { return null; }
}

function applyChatTheme(cid) {
  const t = getChatTheme(cid);
  const msgs = document.getElementById('chat-messages');
  if (!msgs) return;
  if (!t || t.id === 'default') {
    msgs.style.background = '';
    document.querySelectorAll('.msg-row.mine .msg-bubble').forEach(el => el.style.background = '');
    return;
  }
  if (t.bg) msgs.style.background = t.bg;
  if (t.bubble) {
    document.querySelectorAll('.msg-row.mine .msg-bubble').forEach(el => el.style.background = t.bubble);
  }
}

function openThemePicker(cid) {
  const existing = document.querySelector('.theme-picker-sheet');
  if (existing) { existing.remove(); return; }
  const cur = getChatTheme(cid);
  const swatches = CHAT_THEMES.map(t => {
    const bg = t.id === 'default' ? 'linear-gradient(135deg,#534AB7,#8B5CF6)' : t.bubble || '#ccc';
    return `<div class="theme-swatch${cur?.id === t.id || (!cur && t.id==='default') ? ' active' : ''}"
      style="background:${bg}" title="${t.label}"
      onclick="setChatTheme('${cid}','${t.id}',this)"></div>`;
  }).join('');
  const sheet = document.createElement('div');
  sheet.className = 'theme-picker-sheet';
  sheet.onclick = e => { if (e.target === sheet) sheet.remove(); };
  sheet.innerHTML = `<div class="theme-picker-inner">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h3 style="font-size:15px;font-weight:600"><i class="ti ti-palette"></i> Tema da conversa</h3>
      <button onclick="this.closest('.theme-picker-sheet').remove()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px">&times;</button>
    </div>
    <div class="theme-swatches">${swatches}</div>
  </div>`;
  document.body.appendChild(sheet);
}

function setChatTheme(cid, themeId, swatch) {
  const t = CHAT_THEMES.find(x => x.id === themeId);
  if (!t) return;
  localStorage.setItem(THEME_KEY + cid, JSON.stringify(t));
  swatch.closest('.theme-swatches').querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');
  applyChatTheme(cid);
  showToast(`Tema "${t.label}" aplicado!`);
}

// ── Mobile: voltar para lista de conversas ───────────────────────
function mobileBackToList() {
  if (messagesUnsub)      { messagesUnsub();      messagesUnsub      = null; }
  if (typingUnsub)        { typingUnsub();        typingUnsub        = null; }
  if (onlineStatusUnsub)  { onlineStatusUnsub();  onlineStatusUnsub  = null; }
  const sidebar = document.getElementById('chat-sidebar');
  const main    = document.getElementById('chat-main');
  sidebar.classList.remove('hidden');
  main.classList.remove('show');
  activeConvId = null;
  // Restaurar welcome screen
  main.innerHTML = `
    <div class="chat-welcome" id="chat-welcome">
      <div class="chat-welcome-icon"><i class="ti ti-messages"></i></div>
      <h2>Suas mensagens</h2>
      <p>Selecione uma conversa ou busque um usuário para começar a conversar.</p>
    </div>`;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const open = document.querySelector('.modal-overlay.open');
  if (open) open.remove();
});

// ── Mensagens que desaparecem ───────────────────────────────────
async function toggleDisappearing(cid) {
  try {
    const convSnap = await db.collection('conversations').doc(cid).get();
    const current = convSnap.data()?.disappearing || false;
    const next = !current;
    await db.collection('conversations').doc(cid).update({ disappearing: next });
    const banner = document.getElementById('disappearing-banner');
    const btn = document.querySelector(`[onclick="toggleDisappearing('${cid}')"]`);
    if (banner) banner.style.display = next ? 'flex' : 'none';
    if (btn) {
      btn.style.color = next ? 'var(--purple-600)' : '';
      btn.title = next ? 'Desativar modo efêmero' : 'Ativar modo efêmero';
    }
    showToast(next ? 'Modo efêmero ativado (24h)' : 'Modo efêmero desativado');
  } catch(e) { showToast('Erro ao alterar modo efêmero.'); }
}

// ── Chat search ────────────────────────────────────────────────
function toggleChatSearch() {
  const bar = document.getElementById('chat-search-bar');
  if (!bar) return;
  const open = bar.style.display !== 'none';
  bar.style.display = open ? 'none' : 'flex';
  if (!open) {
    document.getElementById('chat-search-input')?.focus();
  } else {
    // Clear highlights
    document.getElementById('chat-search-input').value = '';
    filterChatMessages('');
  }
}

function filterChatMessages(q) {
  const msgs = document.querySelectorAll('#chat-messages .msg-row');
  const count = document.getElementById('chat-search-count');
  if (!q.trim()) {
    msgs.forEach(m => { m.style.display = ''; });
    if (count) count.textContent = '';
    return;
  }
  const lower = q.toLowerCase();
  let found = 0;
  msgs.forEach(m => {
    const text = m.querySelector('.msg-bubble')?.textContent?.toLowerCase() || '';
    const match = text.includes(lower);
    m.style.display = match ? '' : 'none';
    if (match) found++;
  });
  if (count) count.textContent = found ? `${found} resultado${found !== 1 ? 's' : ''}` : 'Nenhum resultado';
  // Scroll to first match
  const first = document.querySelector('#chat-messages .msg-row:not([style*="none"])');
  first?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── Chat polls ─────────────────────────────────────────────────
let _pollConvId = null;
let _pollConvType = null;

function openPollModal(cid, type) {
  _pollConvId = cid;
  _pollConvType = type;
  document.getElementById('poll-question').value = '';
  const wrap = document.getElementById('poll-options-wrap');
  wrap.innerHTML = `
    <input type="text" class="form-input poll-opt" placeholder="Opção 1" maxlength="60">
    <input type="text" class="form-input poll-opt" placeholder="Opção 2" maxlength="60">`;
  document.getElementById('poll-modal').style.display = 'flex';
}

function closePollModal() {
  document.getElementById('poll-modal').style.display = 'none';
}

function addPollOption() {
  const opts = document.querySelectorAll('.poll-opt');
  if (opts.length >= 4) return showToast('Máximo 4 opções.');
  const wrap = document.getElementById('poll-options-wrap');
  const n = opts.length + 1;
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'form-input poll-opt';
  inp.placeholder = `Opção ${n}`; inp.maxLength = 60;
  wrap.appendChild(inp);
  if (opts.length + 1 >= 4) document.getElementById('poll-add-opt').style.display = 'none';
}

async function submitChatPoll() {
  const question = document.getElementById('poll-question').value.trim();
  if (!question) return showToast('Digite uma pergunta.');
  const opts = [...document.querySelectorAll('.poll-opt')].map(i => i.value.trim()).filter(Boolean);
  if (opts.length < 2) return showToast('Adicione pelo menos 2 opções.');

  const pollData = {
    question,
    options: opts.map(text => ({ text, votes: [] }))
  };
  const msgDoc = {
    senderId: currentUser.uid,
    senderName: currentUser.displayName,
    senderPhoto: currentUser.photoURL || null,
    type: 'poll',
    poll: pollData,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('conversations').doc(_pollConvId)
      .collection('messages').add(msgDoc);
    await db.collection('conversations').doc(_pollConvId).update({
      lastMessage: `📊 Enquete: ${question}`,
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closePollModal();
  } catch(e) {
    showToast('Erro ao enviar enquete: ' + e.message);
  }
}

async function votePoll(convId, msgId, optIndex) {
  const uid = currentUser.uid;
  const snap = await db.collection('conversations').doc(convId)
    .collection('messages').doc(msgId).get();
  if (!snap.exists) return;
  const poll = snap.data().poll;
  const opts = poll.options.map((o, i) => ({
    text: o.text,
    votes: i === optIndex
      ? (o.votes.includes(uid) ? o.votes.filter(v => v !== uid) : [...o.votes, uid])
      : o.votes.filter(v => v !== uid)
  }));
  await db.collection('conversations').doc(convId)
    .collection('messages').doc(msgId)
    .update({ 'poll.options': opts });
}

function chatPollHTML(msgId, convId, poll, isMine) {
  const total = poll.options.reduce((s, o) => s + (o.votes||[]).length, 0);
  const uid = currentUser.uid;
  const myVote = poll.options.findIndex(o => (o.votes||[]).includes(uid));
  return `<div class="chat-poll" style="background:rgba(255,255,255,.12);border-radius:var(--radius-md);padding:.75rem;min-width:200px;max-width:280px">
    <div style="font-size:13px;font-weight:700;margin-bottom:.6rem">📊 ${sanitize(poll.question)}</div>
    ${poll.options.map((o, i) => {
      const pct = total ? Math.round((o.votes||[]).length / total * 100) : 0;
      const voted = myVote === i;
      return `<div style="margin-bottom:.4rem;cursor:pointer" onclick="votePoll('${convId}','${msgId}',${i})">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
          <span>${voted ? '✓ ' : ''}${sanitize(o.text)}</span>
          <span style="opacity:.7">${pct}%</span>
        </div>
        <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.2)">
          <div style="height:100%;width:${pct}%;border-radius:2px;background:${voted ? '#fff' : 'rgba(255,255,255,.5)'}"></div>
        </div>
      </div>`;
    }).join('')}
    <div style="font-size:11px;opacity:.6;margin-top:.4rem">${total} voto${total !== 1 ? 's' : ''}</div>
  </div>`;
}
</script>
