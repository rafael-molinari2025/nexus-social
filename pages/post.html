<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Post</title>
  <meta name="description" content="Veja um post e seus comentários no Nexus.">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    .post-page { max-width: 640px; margin: 0 auto; padding: 1.5rem .75rem; }
    .back-btn { display: inline-flex; align-items: center; gap: .4rem; font-size: 13px; color: var(--text-muted); margin-bottom: 1rem; cursor: pointer; }
    .back-btn:hover { color: var(--purple-600); }
    .comment-composer { display: flex; gap: .65rem; padding: .875rem 1rem; border-top: 0.5px solid var(--border); }
    .comment-input {
      flex: 1; border: 0.5px solid var(--border-md); border-radius: var(--radius-full);
      padding: .5rem 1rem; font-size: 13px; background: var(--gray-50);
      color: var(--text-primary); outline: none; font-family: var(--font-sans);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .comment-input:focus { border-color: var(--purple-400); box-shadow: 0 0 0 3px rgba(83,74,183,0.10); background: var(--surface); }
    .mention-dropdown { position:fixed; background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-md); z-index:2000; overflow:hidden; }
    .mention-item { display:flex; align-items:center; gap:.6rem; padding:.45rem .75rem; cursor:pointer; transition:background var(--transition); }
    .mention-item:hover, .mention-item.active { background:var(--gray-100); }
    .mention-item-name { font-size:13px; font-weight:500; color:var(--text-primary); }
    .comment-actions { display: flex; align-items: center; gap: .5rem; margin-top: 4px; }
    .gif-picker-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center; }
    .gif-picker { background:var(--surface);border-radius:var(--radius-lg);width:min(420px,96vw);max-height:70vh;overflow:hidden;display:flex;flex-direction:column; }
    .gif-picker-header { padding:.875rem 1rem;border-bottom:0.5px solid var(--border);display:flex;gap:.6rem;align-items:center; }
    .gif-search-input { flex:1;border:0.5px solid var(--border);border-radius:var(--radius-md);padding:.4rem .75rem;font-size:13px;background:var(--surface);color:var(--text-primary);outline:none;font-family:var(--font-sans); }
    .gif-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow-y:auto;padding:.5rem;flex:1; }
    .gif-item { aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;width:100%;transition:opacity .15s; }
    .gif-item:hover { opacity:.85; }
    .gif-empty { padding:2rem;text-align:center;color:var(--text-muted);font-size:13px; }
    .comment-like-btn {
      background: none; border: none; font-size: 11px; color: var(--text-muted);
      cursor: pointer; padding: 0; display: flex; align-items: center; gap: 2px;
      transition: color var(--transition);
    }
    .comment-like-btn:hover, .comment-like-btn.liked { color: var(--purple-600); }
    /* Share modal */
    .share-modal-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem;
    }
    .share-opt {
      display: flex; flex-direction: column; align-items: center;
      gap: .4rem; padding: .875rem .5rem; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); cursor: pointer; background: var(--surface);
      transition: background var(--transition), border-color var(--transition);
      font-size: 12px; font-weight: 500; color: var(--text-secondary);
    }
    .share-opt:hover { background: var(--gray-50); border-color: var(--purple-400); }
    .share-opt i { font-size: 24px; }
    /* ── Link preview ── */
    .link-preview-card { border:0.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin:.3rem 1rem .75rem;background:var(--surface);display:flex;text-decoration:none;color:inherit;transition:box-shadow var(--transition); }
    .link-preview-card:hover { box-shadow:var(--shadow-sm); }
    .link-preview-img { width:88px;min-height:72px;object-fit:cover;flex-shrink:0;background:var(--gray-100); }
    .link-preview-body { padding:.55rem .75rem;overflow:hidden;min-width:0;flex:1; }
    .link-preview-domain { font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.2rem; }
    .link-preview-title { font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; }
    .link-preview-desc { font-size:11.5px;color:var(--text-secondary);margin-top:.2rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4; }
    /* ── Poll ── */
    .poll-bar { display:flex;align-items:center;width:100%;position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.4rem .75rem;text-align:left;cursor:pointer;overflow:hidden;font-family:var(--font-sans);margin-bottom:.25rem; }
    .poll-bar.my-vote { border-color:var(--purple-600); }
    .poll-bar-fill { position:absolute;inset:0;background:var(--purple-50);pointer-events:none;transition:width .3s; }
    .poll-bar-text { position:relative;font-size:13px;flex:1; }
    .poll-bar-pct { position:relative;font-size:12px;color:var(--text-muted); }
    @media (max-width: 768px) {
      .post-page { padding: 1rem .5rem calc(80px + 1rem); }
      .back-btn { margin-bottom: .5rem; }
      .comment-composer { padding: .75rem .875rem; gap: .5rem; }
      .share-modal-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="post-page">
    <div class="back-btn" onclick="history.back()">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Voltar
    </div>
    <div id="post-container" class="card">
      <div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ── Editar post ── -->
<div class="modal-overlay" id="edit-post-modal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title">Editar post</span>
      <button class="btn btn-icon" onclick="closeEditModal()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <textarea class="composer-textarea" id="edit-post-ta"
              style="min-height:120px;margin-bottom:1rem"
              placeholder="O que você está pensando?" maxlength="2000"></textarea>
    <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px" onclick="saveEditPost()">
      <i class="ti ti-device-floppy" aria-hidden="true"></i> Salvar alterações
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
const params = new URLSearchParams(location.search);
const postId = params.get('id');
let currentUser = null;
let _viewIncremented = false;
let _postData = null;

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'post');
  if (!postId) { showError('Post não encontrado.'); return; }
  loadPost();
});

function loadPost() {
  db.collection('posts').doc(postId).onSnapshot(async snap => {
    if (!snap.exists) { showError('Post não encontrado.'); return; }
    const p = snap.data();
    _postData = p;
    const cl = getAvatarColor(p.authorId);
    const av = p.authorPhoto
      ? `<img src="${p.authorPhoto}" alt="${sanitize(p.authorName)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : getInitials(p.authorName);
    const _rxns    = p.reactions || {};
    const liked    = (p.likes||[]).includes(currentUser.uid) || _RXN_EMOJIS.some(e => (_rxns[e]||[]).includes(currentUser.uid));
    const likeCount = _RXN_EMOJIS.reduce((s,e) => s + (_rxns[e]||[]).length, 0) + (p.likes||[]).length;

    document.title = `Nexus — Post de ${p.authorName}`;

    const container = document.getElementById('post-container');
    container.innerHTML = `
      <div class="post-header">
        <div class="avatar avatar-48" style="background:${cl.bg};color:${cl.color};cursor:pointer"
             onclick="location.href='perfil.html?uid=${p.authorId}'">${av}</div>
        <div class="post-meta">
          <div class="post-author">${sanitize(p.authorName||'Usuário')}</div>
          <div class="post-time">${timeAgo(p.createdAt)}</div>
        </div>
        ${p.authorId === currentUser.uid ? `
          <button class="btn btn-icon" onclick="startEditPost()" title="Editar"><i class="ti ti-pencil" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i></button>
          <button class="btn btn-icon" onclick="deletePost()" title="Excluir"><i class="ti ti-trash" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i></button>` : ''}
      </div>
      ${p.text ? `<div class="post-body" style="font-size:16px;padding:0 1rem 1rem;line-height:1.7">${sanitize(p.text).replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/_(.*?)_/g,'<em>$1</em>').replace(/#(\w+)/g,'<a href="busca.html?tab=posts&q=%23$1" style="color:var(--purple-600);text-decoration:none;font-weight:500">#$1</a>').replace(/@(\w+)/g,'<a href="busca.html?q=$1" style="color:#0ea5e9;text-decoration:none;font-weight:500">@$1</a>')}</div>` : ''}
      ${p.videoURL ? `<video src="${p.videoURL}" controls preload="metadata" style="width:100%;max-height:480px;background:#000;display:block" onclick="event.stopPropagation()"></video>` : (p.images && p.images.length > 1) ? `<div style="display:flex;gap:.25rem;flex-wrap:wrap;padding:0 1rem .75rem">${p.images.map(url=>`<img src="${url}" style="flex:1;min-width:120px;max-height:320px;object-fit:cover;border-radius:var(--radius-md);cursor:zoom-in" onclick="openLightbox(${JSON.stringify(p.images).replace(/"/g,'&quot;')})">`).join('')}</div>` : (p.imageURL ? `<img src="${sanitize(p.imageURL)}" style="width:100%;max-height:420px;object-fit:cover;cursor:zoom-in;display:block" onclick="openLightbox(${JSON.stringify([p.imageURL]).replace(/"/g,'&quot;')})">` : '')}
      ${p.poll ? pollHTML(p.poll) : ''}
      ${p.linkPreview ? linkPreviewCardHTML(p.linkPreview) : ''}
      <div class="post-actions" style="border-top:0.5px solid var(--border)">
        <button class="post-action-btn${liked?' liked':''}" id="post-like-btn" onclick="toggleLike()">
          <i class="ti ${liked?'ti-heart-filled':'ti-heart'}" aria-hidden="true"></i> ${likeCount||''} curtidas
        </button>
        ${likeCount > 0 ? `<button class="post-action-btn" onclick="showLikers()" style="font-size:11.5px;color:var(--text-muted)">Ver quem curtiu</button>` : ''}
        <button class="post-action-btn" onclick="openShareModal()">
          <i class="ti ti-share-3" aria-hidden="true"></i> compartilhar
        </button>
        <span class="post-action-btn" style="cursor:default;pointer-events:none;opacity:.6;font-size:11.5px;margin-left:auto">
          <i class="ti ti-eye" aria-hidden="true"></i> ${p.views||0}
        </span>
      </div>

      <!-- Compositor de comentário -->
      <div class="comment-composer">
        <div class="avatar avatar-32" id="comment-av" style="flex-shrink:0"></div>
        <input class="comment-input" id="comment-input" placeholder="Escreva um comentário..." autocomplete="off" oninput="onCommentMentionInput(this)">
        <button class="btn btn-sm" onclick="openCommentGifPicker()" title="Inserir GIF" style="font-size:11px;font-weight:700;letter-spacing:-.03em;padding:.3rem .6rem">GIF</button>
        <button class="btn btn-primary btn-sm" onclick="postComment()"><i class="ti ti-send" aria-hidden="true"></i></button>
      </div>

      <!-- Comentários -->
      <div id="comments-list"></div>
      <div id="comments-load-more" style="text-align:center;padding:.5rem;display:none">
        <button class="btn btn-sm" onclick="loadMoreComments()" style="width:100%">
          <i class="ti ti-refresh" aria-hidden="true"></i> Ver mais comentários
        </button>
      </div>
    `;

    // Incrementa views uma única vez
    if (!_viewIncremented) {
      _viewIncremented = true;
      db.collection('posts').doc(postId).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
    }

    // Avatar do compositor
    const cl2 = getAvatarColor(currentUser.uid);
    const avEl = document.getElementById('comment-av');
    // CORRIGIDO: incluir color no cssText
    avEl.style.cssText = `background:${cl2.bg};color:${cl2.color};flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;`;
    avEl.innerHTML = currentUser.photoURL
      ? `<img src="${currentUser.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : getInitials(currentUser.displayName);

    document.getElementById('comment-input').addEventListener('keydown', e => {
      const dd = document.getElementById('mention-dd');
      if (dd) {
        const items = dd.querySelectorAll('.mention-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); _mentionActive = Math.min(_mentionActive + 1, items.length - 1); updateMentionActive(); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); _mentionActive = Math.max(_mentionActive - 1, 0); updateMentionActive(); return; }
        if (e.key === 'Enter' && _mentionActive >= 0) { e.preventDefault(); const n = items[_mentionActive]?.dataset.name; if (n) insertMention(n); return; }
        if (e.key === 'Escape') { hideMentionDropdown(); return; }
      }
      if (e.key === 'Enter') postComment();
    });
    document.getElementById('comment-input').addEventListener('blur', () => {
      setTimeout(hideMentionDropdown, 150);
    });

    loadComments();
  }, () => showError('Erro ao carregar o post.'));
}

const COMMENT_PAGE_SIZE = 20;
let _lastCommentDoc = null;
let _commentsUnsub = null;

function loadComments() {
  if (_commentsUnsub) { _commentsUnsub(); _commentsUnsub = null; }
  _lastCommentDoc = null;
  const el = document.getElementById('comments-list');

  _commentsUnsub = db.collection('posts').doc(postId).collection('comments')
    .orderBy('createdAt', 'asc')
    .limit(COMMENT_PAGE_SIZE)
    .onSnapshot(snap => {
      if (!el) return;
      _lastCommentDoc = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
      const lmEl = document.getElementById('comments-load-more');
      if (lmEl) lmEl.style.display = snap.docs.length === COMMENT_PAGE_SIZE ? 'block' : 'none';
      if (snap.empty) {
        el.innerHTML = `<div class="empty-state" style="padding:1.25rem"><i class="ti ti-messages" aria-hidden="true"></i><p>Nenhum comentário ainda. Seja o primeiro!</p></div>`;
        return;
      }
      el.innerHTML = snap.docs.map(doc => commentHTML(doc.id, doc.data())).join('');
    });
}

async function loadMoreComments() {
  if (!_lastCommentDoc) return;
  const btn = document.querySelector('#comments-load-more button');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Carregando…'; }
  try {
    const snap = await db.collection('posts').doc(postId).collection('comments')
      .orderBy('createdAt', 'asc')
      .startAfter(_lastCommentDoc)
      .limit(COMMENT_PAGE_SIZE)
      .get();
    _lastCommentDoc = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
    const el = document.getElementById('comments-list');
    if (el) el.insertAdjacentHTML('beforeend', snap.docs.map(doc => commentHTML(doc.id, doc.data())).join(''));
    const lmEl = document.getElementById('comments-load-more');
    if (lmEl) lmEl.style.display = snap.docs.length === COMMENT_PAGE_SIZE ? 'block' : 'none';
  } catch(e) { showToast('Erro ao carregar comentários.'); }
  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-refresh" aria-hidden="true"></i> Ver mais comentários'; }
}

function commentHTML(id, c) {
  const cl = getAvatarColor(c.authorId);
  const av = c.authorPhoto
    ? `<img src="${c.authorPhoto}" alt="${sanitize(c.authorName)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : `<span style="color:${cl.color}">${getInitials(c.authorName)}</span>`;
  const canDelete = c.authorId === currentUser.uid;
  const liked = (c.likes || []).includes(currentUser.uid);
  const likeCount = (c.likes || []).length;
  const parsedText = sanitize(c.text)
    .replace(/\n/g,'<br>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/_(.*?)_/g,'<em>$1</em>')
    .replace(/@(\w+)/g, '<span style="color:var(--purple-600);font-weight:500">@$1</span>');
  return `<div class="comment" id="comment-${id}">
    <div class="avatar avatar-32" style="background:${cl.bg};cursor:pointer;flex-shrink:0"
         onclick="location.href='perfil.html?uid=${c.authorId}'">${av}</div>
    <div class="comment-body">
      <div style="background:var(--gray-50);border-radius:var(--radius-md);padding:.5rem .75rem">
        <div class="comment-author" style="cursor:pointer" onclick="location.href='perfil.html?uid=${c.authorId}'">${sanitize(c.authorName||'Usuário')}</div>
        ${c.text ? `<div class="comment-text" id="ctext-${id}">${parsedText}</div>` : ''}
        ${c.gifURL ? `<img src="${c.gifURL}" alt="GIF" style="max-width:200px;border-radius:6px;margin-top:.3rem;display:block" loading="lazy">` : ''}
      </div>
      <div class="comment-actions">
        <span class="comment-time">${timeAgo(c.createdAt)}</span>
        <button class="comment-like-btn${liked?' liked':''}" id="clike-${id}" onclick="likeComment('${id}')">
          <i class="ti ti-heart-filled" style="font-size:10px"></i> ${likeCount || ''}
        </button>
        <button style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:0;transition:color var(--transition)" onmouseover="this.style.color='var(--indigo-500)'" onmouseout="this.style.color='var(--text-muted)'" onclick="replyComment('${sanitize(c.authorName||'').replace(/'/g,"\\'")}')">Responder</button>
        ${canDelete ? `<button style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:0" onclick="editComment('${id}')">Editar</button>` : ''}
        ${canDelete ? `<button style="background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:0" onclick="deleteComment('${id}')">Excluir</button>` : ''}
      </div>
    </div>
  </div>`;
}

async function likeComment(commentId) {
  const ref = db.collection('posts').doc(postId).collection('comments').doc(commentId);
  const snap = await ref.get();
  const likes = snap.data().likes || [];
  const isLiked = likes.includes(currentUser.uid);
  await ref.update({
    likes: isLiked
      ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  });
  const btn = document.getElementById(`clike-${commentId}`);
  if (btn) {
    const newCount = isLiked ? likes.length - 1 : likes.length + 1;
    btn.className = `comment-like-btn${!isLiked?' liked':''}`;
    btn.innerHTML = `<i class="ti ti-heart-filled" style="font-size:10px"></i> ${newCount || ''}`;
  }
}

async function editComment(commentId) {
  const textEl = document.getElementById(`ctext-${commentId}`);
  if (!textEl || textEl.dataset.editing) return;
  textEl.dataset.editing = '1';
  const currentText = textEl.textContent.trim();

  const ta = document.createElement('textarea');
  ta.className = 'comment-input';
  ta.style.cssText = 'width:100%;min-height:56px;resize:vertical;margin-bottom:.3rem';
  ta.value = currentText;
  ta.maxLength = 1000;

  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary btn-sm';
  saveBtn.innerHTML = '<i class="ti ti-check"></i> Salvar';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-sm';
  cancelBtn.innerHTML = '<i class="ti ti-x"></i> Cancelar';
  cancelBtn.style.marginLeft = '.35rem';

  const wrap = document.createElement('div');
  wrap.style.marginTop = '.3rem';
  wrap.append(ta, saveBtn, cancelBtn);

  const restore = () => {
    textEl.style.display = '';
    wrap.remove();
    delete textEl.dataset.editing;
  };

  textEl.style.display = 'none';
  textEl.after(wrap);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  cancelBtn.addEventListener('click', restore);

  saveBtn.addEventListener('click', async () => {
    const newText = ta.value.trim();
    if (!newText || newText === currentText) { restore(); return; }
    saveBtn.disabled = true;
    try {
      await db.collection('posts').doc(postId).collection('comments').doc(commentId)
        .update({ text: newText, editedAt: firebase.firestore.FieldValue.serverTimestamp() });
      textEl.innerHTML = sanitize(newText).replace(/\n/g,'<br>')
        .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
        .replace(/_(.*?)_/g,'<em>$1</em>')
        .replace(/@(\w+)/g,'<span style="color:var(--purple-600);font-weight:500">@$1</span>');
      showToast('Comentário editado.');
    } catch(e) { showToast('Erro ao editar comentário.'); }
    restore();
  });
}

let _commentGifUrl = null;

// ── @mention autocomplete ────────────────────────────────────
let _mentionTimer = null;
let _mentionActive = -1;

function onCommentMentionInput(input) {
  const q = getMentionQuery(input);
  if (!q) { hideMentionDropdown(); return; }
  clearTimeout(_mentionTimer);
  _mentionTimer = setTimeout(() => searchMentionUsers(q, input), 300);
}

function getMentionQuery(input) {
  const text = input.value.slice(0, input.selectionStart);
  const m = text.match(/@(\w{1,30})$/);
  return m ? m[1] : null;
}

async function searchMentionUsers(q, input) {
  const qLower = q.toLowerCase();
  try {
    const snap = await db.collection('users')
      .where('displayName_lower', '>=', qLower)
      .where('displayName_lower', '<=', qLower + '')
      .limit(6).get();
    if (!snap.docs.length) { hideMentionDropdown(); return; }
    showMentionDropdown(snap.docs.map(d => ({ uid: d.id, ...d.data() })), input);
  } catch(e) { hideMentionDropdown(); }
}

function showMentionDropdown(users, input) {
  hideMentionDropdown();
  const rect = input.getBoundingClientRect();
  const itemH = 44;
  const ddH = Math.min(users.length * itemH, 220);
  const dd = document.createElement('div');
  dd.id = 'mention-dd';
  dd.className = 'mention-dropdown';
  dd.style.left  = rect.left + 'px';
  dd.style.width = rect.width + 'px';
  dd.style.top   = (rect.top - ddH - 6) + 'px';
  dd.innerHTML = users.map((u, i) => {
    const cl = getAvatarColor(u.uid);
    const av = u.photoURL
      ? `<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
    return `<div class="mention-item" data-name="${sanitize(u.displayName)}"
               onmousedown="insertMention('${sanitize(u.displayName).replace(/'/g,"\\'")}')"
               onmouseover="_mentionActive=${i};updateMentionActive()">
      <div class="avatar avatar-28" style="background:${cl.bg}">${av}</div>
      <span class="mention-item-name">${sanitize(u.displayName)}</span>
    </div>`;
  }).join('');
  _mentionActive = -1;
  document.body.appendChild(dd);
}

function hideMentionDropdown() {
  document.getElementById('mention-dd')?.remove();
  _mentionActive = -1;
}

function updateMentionActive() {
  document.querySelectorAll('#mention-dd .mention-item').forEach((el, i) =>
    el.classList.toggle('active', i === _mentionActive)
  );
}

function insertMention(name) {
  const input = document.getElementById('comment-input');
  const cursor = input.selectionStart;
  const before = input.value.slice(0, cursor);
  const after  = input.value.slice(cursor);
  const m = before.match(/@(\w{0,30})$/);
  if (!m) return;
  const atPos  = cursor - m[0].length;
  input.value  = before.slice(0, atPos) + '@' + name + ' ' + after;
  const pos = atPos + name.length + 2;
  input.setSelectionRange(pos, pos);
  hideMentionDropdown();
  input.focus();
}

async function postComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text && !_commentGifUrl) return;
  if (!checkRateLimit('comment_' + currentUser.uid, 10, 60000))
    return showToast('Muitos comentários seguidos. Aguarde um momento.');
  input.value = '';
  const gifUrl = _commentGifUrl;
  _commentGifUrl = null;
  try {
    const batch = db.batch();
    const commentRef = db.collection('posts').doc(postId).collection('comments').doc();
    batch.set(commentRef, {
      authorId: currentUser.uid,
      authorName: currentUser.displayName,
      authorPhoto: currentUser.photoURL || null,
      text,
      ...(gifUrl ? { gifURL: gifUrl } : {}),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.update(db.collection('posts').doc(postId), {
      commentsCount: firebase.firestore.FieldValue.increment(1)
    });
    await batch.commit();
  } catch(e) { showToast('Erro ao comentar.'); }
}

// ── GIF picker para comentários ──────────────────────────────────
const TENOR_KEY = 'LIVDSRZULELA';
let _gifSearchTimer = null;

function openCommentGifPicker() {
  const existing = document.querySelector('.gif-picker-backdrop');
  if (existing) { existing.remove(); return; }
  const bd = document.createElement('div');
  bd.className = 'gif-picker-backdrop';
  bd.innerHTML = `
    <div class="gif-picker">
      <div class="gif-picker-header">
        <input class="gif-search-input" id="gif-q" placeholder="Buscar GIFs…" oninput="searchCommentGifs(this.value)" autofocus>
        <button class="btn btn-icon" onclick="document.querySelector('.gif-picker-backdrop')?.remove()" style="flex-shrink:0"><i class="ti ti-x"></i></button>
      </div>
      <div class="gif-grid" id="gif-grid"><div class="gif-empty"><i class="ti ti-loader-2 ti-spin" style="font-size:24px"></i></div></div>
    </div>`;
  bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
  document.body.appendChild(bd);
  searchCommentGifs('reação');
}

async function searchCommentGifs(q) {
  clearTimeout(_gifSearchTimer);
  const query = (q && q.trim()) ? q.trim() : 'reação';
  _gifSearchTimer = setTimeout(async () => {
    const grid = document.getElementById('gif-grid');
    if (!grid) return;
    grid.innerHTML = '<div class="gif-empty"><i class="ti ti-loader-2 ti-spin" style="font-size:24px"></i></div>';
    try {
      const url = `https://tenor.googleapis.com/v2/search?q=${encodeURIComponent(query)}&key=${TENOR_KEY}&limit=18&media_filter=gif,tinygif`;
      const res = await fetch(url);
      const data = await res.json();
      const results = data.results || [];
      if (!results.length) { grid.innerHTML = '<div class="gif-empty">Nenhum GIF encontrado.</div>'; return; }
      grid.innerHTML = results.map(r => {
        const src = r.media_formats?.tinygif?.url || r.media_formats?.gif?.url || '';
        return `<img class="gif-item" src="${src}" loading="lazy" onclick="selectCommentGif('${src}')">`;
      }).join('');
    } catch(e) { grid.innerHTML = '<div class="gif-empty">Erro ao buscar GIFs.</div>'; }
  }, 400);
}

function selectCommentGif(url) {
  _commentGifUrl = url;
  document.querySelector('.gif-picker-backdrop')?.remove();
  const input = document.getElementById('comment-input');
  if (input) input.placeholder = 'GIF selecionado! Adicione um texto (opcional)...';
  showToast('GIF selecionado!');
}

function deleteComment(commentId) {
  confirmAction('Excluir este comentário?', async () => {
    const batch = db.batch();
    batch.delete(db.collection('posts').doc(postId).collection('comments').doc(commentId));
    batch.update(db.collection('posts').doc(postId), {
      commentsCount: firebase.firestore.FieldValue.increment(-1)
    });
    await batch.commit();
    showToast('Comentário excluído.');
  });
}

async function toggleLike() {
  const btn = document.getElementById('post-like-btn');
  if (btn) btn.disabled = true;
  try {
    const result = await toggleReaction(postId);
    if (result && btn) {
      btn.className = `post-action-btn${result.liked ? ' liked' : ''}`;
      btn.innerHTML = `<i class="ti ${result.liked ? 'ti-heart-filled' : 'ti-heart'}" aria-hidden="true"></i> ${result.count || ''} curtidas`;
    }
  } catch(e) { showToast('Erro ao curtir.'); }
  if (btn) btn.disabled = false;
}

function deletePost() {
  confirmAction('Excluir este post?', async () => {
    await db.collection('posts').doc(postId).delete();
    showToast('Post excluído.');
    setTimeout(() => history.back(), 1200);
  });
}

let _dmSearchTimer;
function searchDMUsers(q) {
  clearTimeout(_dmSearchTimer);
  const el = document.getElementById('dm-user-results');
  if (!el) return;
  if (!q.trim()) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="spinner" style="margin:.75rem auto;width:20px;height:20px"></div>';
  _dmSearchTimer = setTimeout(async () => {
    try {
      const qLower = q.toLowerCase();
      const snap = await db.collection('users')
        .where('displayName_lower', '>=', qLower)
        .where('displayName_lower', '<=', qLower + '')
        .limit(8).get();
      const users = snap.docs.filter(d => d.id !== currentUser.uid);
      if (!users.length) {
        el.innerHTML = '<div style="text-align:center;padding:1rem;font-size:13px;color:var(--text-muted)">Nenhum usuário encontrado.</div>';
        return;
      }
      el.innerHTML = users.map(d => {
        const u  = { uid: d.id, ...d.data() };
        const cl = getAvatarColor(u.uid);
        const av = u.photoURL
          ? `<img src="${u.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
        return `<div style="display:flex;align-items:center;gap:.65rem;padding:.5rem .25rem;cursor:pointer;border-radius:var(--radius-sm);transition:background var(--transition)"
                     onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background=''"
                     onclick="sendPostToDM('${u.uid}','${sanitize(u.displayName||'').replace(/'/g,"\\'")}')">
          <div class="avatar avatar-36" style="background:${cl.bg};flex-shrink:0">${av}</div>
          <div style="font-size:13px;font-weight:500">${sanitize(u.displayName||'Usuário')}</div>
        </div>`;
      }).join('');
    } catch(e) {
      el.innerHTML = '<div style="text-align:center;padding:1rem;font-size:13px;color:var(--text-muted)">Erro ao buscar.</div>';
    }
  }, 300);
}

async function sendPostToDM(toUid, toName) {
  document.getElementById('share-dm-modal')?.remove();
  try {
    const convSnap = await db.collection('conversations')
      .where('participants', 'array-contains', currentUser.uid).get();
    let cid = null;
    convSnap.docs.forEach(d => {
      const data = d.data();
      if (!data.type && (data.participants||[]).includes(toUid)) cid = d.id;
    });
    if (!cid) {
      const ref = await db.collection('conversations').add({
        participants:  [currentUser.uid, toUid],
        createdAt:     firebase.firestore.FieldValue.serverTimestamp(),
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastMessage:   '📎 Post compartilhado',
        unread:        { [toUid]: 1 }
      });
      cid = ref.id;
    }
    const postUrl = location.href;
    await db.collection('conversations').doc(cid).collection('messages').add({
      senderId:   currentUser.uid,
      senderName: currentUser.displayName,
      text:       `📎 Post: ${postUrl}`,
      createdAt:  firebase.firestore.FieldValue.serverTimestamp(),
      read:       false
    });
    await db.collection('conversations').doc(cid).update({
      lastMessage:               '📎 Post compartilhado',
      lastMessageAt:             firebase.firestore.FieldValue.serverTimestamp(),
      [`unread.${toUid}`]:       firebase.firestore.FieldValue.increment(1)
    });
    showToast(`Post enviado para ${toName}!`);
  } catch(e) {
    console.error('sendPostToDM:', e);
    showToast('Erro ao enviar mensagem.');
  }
}

function replyComment(authorName) {
  const input = document.getElementById('comment-input');
  if (!input) return;
  const mention = `@${authorName} `;
  if (!input.value.startsWith(mention)) {
    input.value = mention + input.value.replace(/^@\S+\s*/, '');
  }
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

async function showLikers() {
  const snap = await db.collection('posts').doc(postId).get();
  if (!snap.exists) return;
  const likes = snap.data().likes || [];
  if (!likes.length) { showToast('Nenhuma curtida ainda.'); return; }
  const usersData = await Promise.all(likes.slice(0, 30).map(uid => getUserData(uid)));

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal" style="max-width:360px">
    <div class="modal-header">
      <span class="modal-title">Curtidas (${likes.length})</span>
      <button class="btn btn-icon" onclick="this.closest('.modal-overlay').remove()"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.2rem;max-height:360px;overflow-y:auto">
      ${usersData.filter(Boolean).map(u => {
        const cl = getAvatarColor(u.uid);
        const av = u.photoURL
          ? `<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
        return `<div class="search-result-item" style="cursor:pointer;border-radius:var(--radius-md)" onclick="location.href='perfil.html?uid=${u.uid}'">
          <div class="avatar avatar-40" style="background:${cl.bg}">${av}</div>
          <div class="search-result-info"><div class="search-result-name">${sanitize(u.displayName||'Usuário')}</div></div>
          <span style="font-size:18px">❤️</span>
        </div>`;
      }).join('')}
      ${likes.length > 30 ? `<p style="text-align:center;font-size:12px;color:var(--text-muted);padding:.5rem">e mais ${likes.length - 30} pessoas</p>` : ''}
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

// ── Link preview ──────────────────────────────────────────────
function linkPreviewCardHTML(lp) {
  if (!lp || !lp.url) return '';
  return `<a href="${lp.url}" target="_blank" rel="noopener noreferrer" class="link-preview-card">
    ${lp.image ? `<img class="link-preview-img" src="${sanitize(lp.image)}" loading="lazy" onerror="this.style.display='none'" alt="">` : ''}
    <div class="link-preview-body">
      <div class="link-preview-domain">${sanitize(lp.domain||'')}</div>
      <div class="link-preview-title">${sanitize(lp.title||'')}</div>

// ── Poll ──────────────────────────────────────────────────────
function pollHTML(poll) {
  const totalVotes = (poll.options||[]).reduce((s, o) => s + (o.votes||[]).length, 0);
  const myVoteIdx  = (poll.options||[]).findIndex(o => (o.votes||[]).includes(currentUser?.uid));
  const bars = (poll.options||[]).map((opt, i) => {
    const cnt = (opt.votes||[]).length;
    const pct = totalVotes ? Math.round(cnt / totalVotes * 100) : 0;
    const isMine = i === myVoteIdx;
    return `<button class="poll-bar${isMine?' my-vote':''}" onclick="votePoll(${i})">
      <div class="poll-bar-fill" style="width:${pct}%"></div>
      <span class="poll-bar-text">${sanitize(opt.text)}</span>
      <span class="poll-bar-pct">${pct}%</span>
    </button>`;
  }).join('');
  return `<div style="margin:.4rem 1rem .6rem">${bars}
    <div style="font-size:11px;color:var(--text-muted)">${totalVotes} voto${totalVotes!==1?'s':''}</div>
  </div>`;
}

async function votePoll(optionIdx) {
  const ref  = db.collection('posts').doc(postId);
  const snap = await ref.get();
  const poll = snap.data()?.poll;
  if (!poll) return;
  const updates = {};
  (poll.options||[]).forEach((opt, i) => {
    if ((opt.votes||[]).includes(currentUser.uid))
      updates[`poll.options.${i}.votes`] = firebase.firestore.FieldValue.arrayRemove(currentUser.uid);
  });
  updates[`poll.options.${optionIdx}.votes`] = firebase.firestore.FieldValue.arrayUnion(currentUser.uid);
  await ref.update(updates);
}

// ── Edit post ──────────────────────────────────────────────────
function startEditPost() {
  if (!_postData) return;
  document.getElementById('edit-post-ta').value = _postData.text || '';
  document.getElementById('edit-post-modal').classList.add('open');
  document.getElementById('edit-post-ta').focus();
}
function closeEditModal() {
  document.getElementById('edit-post-modal').classList.remove('open');
}
async function saveEditPost() {
  const text = document.getElementById('edit-post-ta').value.trim();
  if (!text) return showToast('O post não pode estar vazio.');
  if (text.length > 2000) return showToast('Post muito longo. Máximo 2000 caracteres.');
  const hashtags = [...new Set((text.match(/#(\w+)/g)||[]).map(t => t.slice(1).toLowerCase()))];
  try {
    await db.collection('posts').doc(postId).update({ text, hashtags });
    showToast('Post atualizado!');
    closeEditModal();
  } catch(e) { showToast('Erro ao salvar.'); }
}

function showError(msg) {
  document.getElementById('post-container').innerHTML = `
    <div class="empty-state" style="padding:3rem 1rem">
      <i class="ti ti-alert-triangle" style="font-size:40px;color:var(--coral-400)" aria-hidden="true"></i>
      <p>${msg}</p>
      <button class="btn" onclick="history.back()">Voltar</button>
    </div>`;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const gifPicker = document.querySelector('.gif-picker-backdrop');
  if (gifPicker) { gifPicker.remove(); return; }
  document.getElementById('edit-post-modal')?.classList.remove('open');
  const dyn = document.querySelector('.modal-overlay.open:not(#edit-post-modal)');
  if (dyn) dyn.remove();
});
