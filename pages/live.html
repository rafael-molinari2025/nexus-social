<script>
const AGORA_APP_ID      = '6178ae4b6a854914bc111c753bcd6350';
const AGORA_TOKEN_SERVER = 'https://nexus-social-fawn.vercel.app';

async function getAgoraToken(channelName) {
  const idToken = await auth.currentUser?.getIdToken();
  const res = await fetch(`${AGORA_TOKEN_SERVER}/api/token?channel=${encodeURIComponent(channelName)}`, {
    headers: idToken ? { 'Authorization': `Bearer ${idToken}` } : {}
  });
  if (!res.ok) throw new Error('Não foi possível obter o token de acesso.');
  const { token } = await res.json();
  return token;
}

const _params  = new URLSearchParams(location.search);
const _liveId  = _params.get('id');
const _asHost  = _params.get('host') === '1';

let currentUser      = null;
let _agoraClient     = null;
let _localAudio      = null;
let _localVideo      = null;
let _hostMediaStream = null;
let _micMuted        = false;
let _camOff          = false;
let _chatUnsub       = null;
let _liveUnsub       = null;
let _previewStream   = null;
let _mediaRecorder    = null;
let _recordingChunks  = [];
let _recordingMimeType = '';
let _liveTitle        = null;
let _facingMode       = 'user'; // 'user' = frontal, 'environment' = traseira
let _isEndingLive     = false;
// Elemento <video> persistente — criado UMA vez e movido entre containers
// (nunca destruído via innerHTML, pois isso pode liberar a câmera no Android)
let _liveVideoEl     = null;

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'live');

  if (_liveId) {
    joinAsViewer(_liveId);
  } else {
    showStartScreen();
  }
});

// ── Gravação local (MediaRecorder → Cloudinary) ───────────────
function startRecording(stream) {
  if (!stream || !window.MediaRecorder) return;
  _recordingChunks  = [];
  _recordingMimeType = '';
  const mimeType = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4;codecs=h264,aac',
    'video/mp4'
  ].find(t => MediaRecorder.isTypeSupported(t)) || '';
  try {
    _mediaRecorder = new MediaRecorder(stream, {
      ...(mimeType ? { mimeType } : {}),
      videoBitsPerSecond: 400_000
    });
    _recordingMimeType = _mediaRecorder.mimeType || mimeType || 'video/webm';
    _mediaRecorder.ondataavailable = e => {
      if (e.data?.size > 0) _recordingChunks.push(e.data);
    };
    _mediaRecorder.start(10_000);
  } catch(e) {
    console.warn('MediaRecorder init failed:', e.message);
    _mediaRecorder = null;
  }
}

async function stopAndUploadRecording(liveId) {
  if (!_mediaRecorder || _mediaRecorder.state === 'inactive') {
    console.warn('stopAndUploadRecording: sem gravação ativa', _mediaRecorder?.state);
    return null;
  }
  const chunks = _recordingChunks;  // captura referência antes de limpar
  const mime   = _recordingMimeType || 'video/webm';
  const ext    = mime.includes('mp4') ? 'mp4' : 'webm';
  _recordingChunks   = [];
  _recordingMimeType = '';

  return new Promise(resolve => {
    _mediaRecorder.onstop = async () => {
      // Inclui qualquer chunk final que chegou no evento stop
      if (_recordingChunks.length) chunks.push(..._recordingChunks);
      _recordingChunks = [];

      try {
        const blob = new Blob(chunks, { type: mime });
        console.log(`Gravação: ${blob.size} bytes, tipo ${mime}`);
        if (blob.size < 5_000) {
          console.warn('Gravação muito pequena, descartando.');
          resolve(null);
          return;
        }
        const formData = new FormData();
        formData.append('file', blob, `live_${liveId}.${ext}`);
        formData.append('upload_preset', 'nexus_uploads');
        formData.append('public_id', `lives/${liveId}`);

        const res = await fetch('https://api.cloudinary.com/v1_1/dyoi5mrdc/auto/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) {
          console.error('Cloudinary error:', JSON.stringify(data));
          throw new Error(data?.error?.message || `HTTP ${res.status}`);
        }
        console.log('Gravação salva:', data.secure_url);
        resolve(data.secure_url || null);
      } catch(e) {
        console.error('Recording upload failed:', e.message);
        resolve(null);
      }
    };
    _mediaRecorder.stop();
  });
}

async function createLivePost(liveId, title, videoURL) {
  try {
    await db.collection('posts').add({
      text:        `Live encerrada: "${title}"`,
      videoURL,
      liveId,
      images:      [],
      imageURL:    null,
      authorId:    currentUser.uid,
      authorName:  currentUser.displayName || 'Usuário',
      authorPhoto: currentUser.photoURL || null,
      likes:       [],
      bookmarks:   [],
      commentsCount: 0,
      privacy:     'public',
      createdAt:   firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {
    console.error('createLivePost error:', e.message);
  }
}

// ── Elemento <video> persistente ───────────────────────────────
function getLiveVideoEl() {
  if (!_liveVideoEl) {
    _liveVideoEl = document.createElement('video');
    _liveVideoEl.autoplay    = true;
    _liveVideoEl.muted       = true;
    _liveVideoEl.playsInline = true;
    _liveVideoEl.setAttribute('webkit-playsinline', '');
  }
  return _liveVideoEl;
}

// ── Tela de início ─────────────────────────────────────────────
function showStartScreen() {
  document.getElementById('app-root').innerHTML = `
    <div class="live-start-wrap">
      <div class="live-start-card">
        <h2 style="font-size:20px;font-weight:700;text-align:center">
          <i class="ti ti-broadcast" style="color:#e53e3e"></i> Iniciar transmissão ao vivo
        </h2>

        <div class="live-preview-box">
          <div id="preview-video-slot" style="width:100%;height:100%"></div>
          <div class="preview-placeholder" id="preview-ph">
            <i class="ti ti-camera-off" style="font-size:36px"></i>
            <span style="font-size:13px">Teste sua câmera antes de começar</span>
          </div>
        </div>

        <div style="display:flex;gap:.5rem">
          <button class="btn" id="btn-test-cam" onclick="testCamera()"
                  style="flex:1;justify-content:center;gap:.5rem">
            <i class="ti ti-camera"></i> Testar câmera e microfone
          </button>
          <button class="btn" id="btn-flip-preview" onclick="flipCamera()" title="Alternar câmera"
                  style="width:44px;justify-content:center;padding:0;flex-shrink:0">
            <i class="ti ti-camera-rotate"></i>
          </button>
        </div>

        <div class="form-group" style="margin:0">
          <label class="form-label">Título da transmissão</label>
          <input class="form-input" id="live-title" type="text" maxlength="80"
                 placeholder="Sobre o que é essa live?"
                 onkeydown="if(event.key==='Enter')startLive()">
        </div>

        <button class="btn btn-primary" id="btn-go-live" onclick="startLive()"
                style="justify-content:center;height:46px;font-size:15px;gap:.5rem">
          <i class="ti ti-broadcast"></i> Ir ao vivo agora
        </button>

        <p style="font-size:11px;color:var(--text-muted);text-align:center;margin:-.5rem 0 0">
          Seus amigos receberão uma notificação quando você começar
        </p>
      </div>
    </div>`;

  // Coloca o elemento <video> persistente no slot da preview
  const vid = getLiveVideoEl();
  vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  document.getElementById('preview-video-slot').appendChild(vid);
}

async function testCamera() {
  const btn = document.getElementById('btn-test-cam');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Solicitando permissão…';
  try {
    if (_previewStream) { _previewStream.getTracks().forEach(t => t.stop()); }
    _previewStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: _facingMode } }, audio: true });
    const vid = getLiveVideoEl();
    vid.srcObject = _previewStream;
    await vid.play().catch(() => {});
    document.getElementById('preview-ph').style.display = 'none';
    btn.innerHTML = '<i class="ti ti-check" style="color:var(--green-500)"></i> Câmera e microfone OK';
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-camera"></i> Testar câmera e microfone';
    showToast('Não foi possível acessar a câmera. Verifique as permissões do navegador.');
  }
}

async function startLive() {
  const title = (document.getElementById('live-title')?.value || '').trim();
  if (!title) return showToast('Dê um título para sua transmissão.');

  const btn = document.getElementById('btn-go-live');
  btn.disabled = true;

  const vid = getLiveVideoEl();

  // Se testCamera já capturou stream ativa, reutiliza sem parar a câmera
  if (_previewStream && _previewStream.active) {
    _hostMediaStream = _previewStream;
    _previewStream = null;
    // _liveVideoEl.srcObject já está setado — não toca nele
  } else {
    // Nenhum preview — pede câmera agora (dentro do gesto do usuário)
    if (_previewStream) { _previewStream.getTracks().forEach(t => t.stop()); _previewStream = null; }
    if (_hostMediaStream) { _hostMediaStream.getTracks().forEach(t => t.stop()); _hostMediaStream = null; }
    btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Acessando câmera…';
    try {
      _hostMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: _facingMode } }, audio: true });
      vid.srcObject = _hostMediaStream;
      await vid.play().catch(() => {});
    } catch(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-broadcast"></i> Ir ao vivo agora';
      return showToast('Permissão de câmera/microfone negada. Verifique as configurações do navegador.');
    }
  }

  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Iniciando…';

  try {
    const ref = await db.collection('lives').add({
      hostUid:    currentUser.uid,
      hostName:   currentUser.displayName || 'Usuário',
      hostPhoto:  currentUser.photoURL || null,
      title,
      status:     'live',
      viewerCount: 0,
      peakViewers: 0,
      startedAt:  firebase.firestore.FieldValue.serverTimestamp()
    });

    // Notificar amigos
    db.collection('friendships').where('users', 'array-contains', currentUser.uid).get()
      .then(async snap => {
        if (snap.empty) return;
        const batch = db.batch();
        snap.docs.forEach(d => {
          const friendUid = d.data().users.find(u => u !== currentUser.uid);
          if (!friendUid) return;
          const nRef = db.collection('notifications').doc(friendUid).collection('items').doc();
          batch.set(nRef, {
            type: 'live_started',
            message: `${currentUser.displayName || 'Alguém'} está ao vivo: "${title}"`,
            link: `${PAGES}live.html?id=${ref.id}`,
            fromUid: currentUser.uid,
            fromName: currentUser.displayName || 'Usuário',
            read: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        await batch.commit().catch(() => {});
      }).catch(() => {});

    renderHostScreen(ref.id, title);
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-broadcast"></i> Ir ao vivo agora';
    showToast('Erro ao iniciar live. Tente novamente.');
  }
}

// ── Tela do host ───────────────────────────────────────────────
function renderHostScreen(liveId, title) {
  _liveTitle = title;
  document.title = `Nexus — AO VIVO`;

  document.getElementById('app-root').innerHTML = `
    <div class="live-layout">
      <div class="live-video-col">
        <div id="agora-video-container">
          <video id="host-video" autoplay muted playsinline webkit-playsinline
                 style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></video>
        </div>
        <div class="live-overlay-top">
          <span class="live-badge-red">AO VIVO</span>
          <span class="live-viewers-badge">
            <i class="ti ti-eye" style="font-size:12px"></i>
            <span id="viewer-count">0</span>
          </span>
        </div>
        <div class="live-title-overlay">
          <span class="live-title-text">${sanitize(title)}</span>
        </div>
        <div class="live-controls">
          <button class="live-ctrl-btn ctrl-mute" id="btn-mic" onclick="toggleMic()" title="Silenciar">
            <i class="ti ti-microphone"></i>
          </button>
          <button class="live-ctrl-btn ctrl-end" onclick="endLive('${liveId}')" title="Encerrar live">
            <i class="ti ti-phone-off"></i>
          </button>
          <button class="live-ctrl-btn ctrl-cam" id="btn-cam" onclick="toggleCam()" title="Câmera">
            <i class="ti ti-video"></i>
          </button>
          <button class="live-ctrl-btn" id="btn-flip" onclick="flipCamera()" title="Câmera traseira">
            <i class="ti ti-camera-rotate"></i>
          </button>
        </div>
        <button class="live-fullscreen-btn" onclick="toggleVideoFullscreen()" title="Tela cheia">
          <i class="ti ti-maximize"></i>
        </button>
      </div>
      ${chatPanelHTML(liveId)}
    </div>`;

  const vid = document.getElementById('host-video');
  _liveVideoEl = vid;
  vid.srcObject = _hostMediaStream;

  vid.play().catch(() => {});

  initAgoraHost(liveId);
  subscribeChat(liveId);
  subscribeViewerCount(liveId);
  startRecording(_hostMediaStream);
}

async function initAgoraHost(liveId) {
  try {
    // O vídeo local já está sendo exibido por _liveVideoEl — não precisa tocar nele
    // Apenas conecta ao canal Agora para transmitir para espectadores
    const token = await getAgoraToken(liveId);
    _agoraClient = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
    await _agoraClient.setClientRole('host');
    await _agoraClient.join(AGORA_APP_ID, liveId, token, null);

    // Clone das tracks para Agora — não interfere com a exibição local
    const vTrack = _hostMediaStream?.getVideoTracks()[0];
    const aTrack = _hostMediaStream?.getAudioTracks()[0];
    if (vTrack) _localVideo = AgoraRTC.createCustomVideoTrack({ mediaStreamTrack: vTrack.clone() });
    if (aTrack) _localAudio = AgoraRTC.createCustomAudioTrack({ mediaStreamTrack: aTrack.clone() });

    const toPublish = [_localAudio, _localVideo].filter(Boolean);
    if (toPublish.length) await _agoraClient.publish(toPublish);
  } catch(e) {
    console.error('Agora host error:', e);
    const code = e?.code ?? e?.data?.code ?? '';
    const msg  = e?.message || String(e);
    showToast(`Erro ao transmitir: ${code ? '#'+code+' ' : ''}${msg.substring(0, 80)}`);
  }
}

function toggleMic() {
  if (!_hostMediaStream) return;
  _micMuted = !_micMuted;
  _hostMediaStream.getAudioTracks().forEach(t => { t.enabled = !_micMuted; });
  const btn = document.getElementById('btn-mic');
  if (_micMuted) {
    btn.classList.add('off');
    btn.innerHTML = '<i class="ti ti-microphone-off"></i>';
    btn.title = 'Ativar microfone';
  } else {
    btn.classList.remove('off');
    btn.innerHTML = '<i class="ti ti-microphone"></i>';
    btn.title = 'Silenciar';
  }
}

function toggleCam() {
  if (!_hostMediaStream) return;
  _camOff = !_camOff;
  _hostMediaStream.getVideoTracks().forEach(t => { t.enabled = !_camOff; });
  if (_liveVideoEl) _liveVideoEl.style.visibility = _camOff ? 'hidden' : '';
  const btn = document.getElementById('btn-cam');
  if (_camOff) {
    btn.classList.add('off');
    btn.innerHTML = '<i class="ti ti-video-off"></i>';
    btn.title = 'Ligar câmera';
  } else {
    btn.classList.remove('off');
    btn.innerHTML = '<i class="ti ti-video"></i>';
    btn.title = 'Desligar câmera';
  }
}

async function flipCamera() {
  const isLive    = !!_hostMediaStream;
  const activeStream = isLive ? _hostMediaStream : _previewStream;
  if (!activeStream) {
    // Sem stream ativa: apenas alterna o modo para o próximo getUserMedia
    _facingMode = _facingMode === 'user' ? 'environment' : 'user';
    showToast(_facingMode === 'environment' ? 'Câmera traseira selecionada' : 'Câmera frontal selecionada');
    return;
  }

  _facingMode = _facingMode === 'user' ? 'environment' : 'user';
  const btn = document.getElementById('btn-flip') || document.getElementById('btn-flip-preview');
  if (btn) { btn.disabled = true; }

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: _facingMode } } });
    const newTrack  = newStream.getVideoTracks()[0];
    if (!newTrack) throw new Error('sem track de vídeo');

    // Substitui track de vídeo no stream ativo
    activeStream.getVideoTracks().forEach(t => { t.stop(); activeStream.removeTrack(t); });
    activeStream.addTrack(newTrack);

    // Atualiza elemento de vídeo
    if (_liveVideoEl) {
      _liveVideoEl.srcObject = null;
      _liveVideoEl.srcObject = activeStream;
      _liveVideoEl.play().catch(() => {});
    }

    // Substitui track no Agora (durante live)
    if (isLive && _agoraClient && _localVideo) {
      try {
        const newAgoraTrack = AgoraRTC.createCustomVideoTrack({ mediaStreamTrack: newTrack.clone() });
        await _agoraClient.unpublish([_localVideo]);
        _localVideo.close();
        _localVideo = newAgoraTrack;
        await _agoraClient.publish([_localVideo]);
      } catch(e) {
        console.warn('Agora flip camera error:', e);
      }
    }

    const flipBtn = document.getElementById('btn-flip');
    if (flipBtn) flipBtn.title = _facingMode === 'user' ? 'Câmera traseira' : 'Câmera frontal';

  } catch(e) {
    _facingMode = _facingMode === 'user' ? 'environment' : 'user'; // reverte
    showToast('Não foi possível alternar a câmera.');
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

async function endLive(liveId) {
  // Guarda contra re-entrada — qualquer clique adicional é ignorado
  if (_isEndingLive) return;

  const endBtn = document.querySelector('.ctrl-end');

  // Primeiro clique: pede confirmação visual e retorna
  if (endBtn && endBtn.dataset.confirm !== '1') {
    endBtn.dataset.confirm = '1';
    endBtn.title = 'Toque novamente para encerrar';
    endBtn.style.outline = '2px solid rgba(255,255,255,0.8)';
    showToast('Toque novamente para confirmar o encerramento.');
    setTimeout(() => {
      if (endBtn.isConnected && endBtn.dataset.confirm) {
        delete endBtn.dataset.confirm;
        endBtn.title = 'Encerrar live';
        endBtn.style.outline = '';
      }
    }, 4000);
    return;
  }

  // Segundo clique confirmado: bloqueia qualquer novo clique imediatamente
  _isEndingLive = true;
  if (endBtn) {
    endBtn.disabled = true;
    endBtn.style.opacity = '0.4';
    endBtn.style.outline = '';
    endBtn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i>';
  }

  try {
    // Para o Agora (para de transmitir para espectadores)
    _localAudio?.close();
    _localVideo?.close();
    if (_liveVideoEl) _liveVideoEl.srcObject = null;
    await _agoraClient?.leave().catch(e => console.warn('agora leave:', e));
    _chatUnsub?.();
    _liveUnsub?.();

    // Mostra tela de "salvando" enquanto o MediaRecorder finaliza
    document.getElementById('app-root').innerHTML = `
      <div class="live-ended-wrap">
        <div class="spinner" style="margin-bottom:.5rem"></div>
        <p style="font-size:15px;font-weight:600;color:var(--text-primary)">Salvando gravação…</p>
        <p style="font-size:13px;color:var(--text-muted)">Não feche esta aba até concluir</p>
      </div>`;

    // Finaliza a gravação e faz upload (stream ainda ativa nesse momento)
    const recordingURL = await stopAndUploadRecording(liveId);

    // Agora sim para as tracks da câmera/microfone
    _hostMediaStream?.getTracks().forEach(t => t.stop());
    _hostMediaStream = null;

    const updateData = {
      status:  'ended',
      endedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (recordingURL) updateData.recordingURL = recordingURL;

    await db.collection('lives').doc(liveId).update(updateData);
    if (recordingURL) await createLivePost(liveId, _liveTitle || 'Live', recordingURL);

    showToast(recordingURL ? 'Gravação salva e postada no feed!' : 'Transmissão encerrada.');
    setTimeout(() => { location.href = '../index.html'; }, 2500);
  } catch(e) {
    console.error('endLive error:', e);
    showToast('Erro ao encerrar. Redirecionando…');
    setTimeout(() => { location.href = '../index.html'; }, 3000);
  }
}

// ── Tela do espectador ─────────────────────────────────────────
async function joinAsViewer(liveId) {
  try {
    const snap = await db.collection('lives').doc(liveId).get();
    if (!snap.exists) {
      showEndedScreen('Live não encontrada.');
      return;
    }
    const live = snap.data();
    if (live.status === 'ended') {
      showEndedScreen('Esta transmissão já foi encerrada.', live.recordingURL || null);
      return;
    }

    document.title = `Nexus — ${live.title || 'Ao Vivo'}`;
    document.getElementById('app-root').innerHTML = `
      <div class="live-layout">
        <div class="live-video-col">
          <div id="agora-video-container" style="background:#111">
            <div class="viewer-waiting" id="viewer-waiting">
              <div class="spinner"></div>
              <p style="font-size:14px">Conectando à transmissão…</p>
            </div>
          </div>
          <div class="live-overlay-top">
            <div style="display:flex;flex-direction:column;gap:.4rem">
              <span class="live-badge-red">AO VIVO</span>
              <span style="background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 12px;border-radius:var(--radius-full);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                ${sanitize(live.hostName||'Usuário')}
              </span>
            </div>
            <span class="live-viewers-badge">
              <i class="ti ti-eye" style="font-size:12px"></i>
              <span id="viewer-count">${live.viewerCount||0}</span>
            </span>
          </div>
          <div class="live-title-overlay">
            <span class="live-title-text">${sanitize(live.title||'')}</span>
          </div>
          <div class="live-controls">
            <button class="live-ctrl-btn ctrl-leave" onclick="leaveViewer('${liveId}')" title="Sair da live">
              <i class="ti ti-door-exit"></i>
            </button>
          </div>
          <button class="live-fullscreen-btn" onclick="toggleVideoFullscreen()" title="Tela cheia">
            <i class="ti ti-maximize"></i>
          </button>
        </div>
        ${chatPanelHTML(liveId)}
      </div>`;

    await initAgoraViewer(liveId);
    subscribeChat(liveId);
    subscribeViewerCount(liveId);
    incrementViewers(liveId);

    _liveUnsub = db.collection('lives').doc(liveId).onSnapshot(s => {
      if (s.data()?.status === 'ended') {
        _agoraClient?.leave().catch(() => {});
        _chatUnsub?.();
        _liveUnsub?.();
        showEndedScreen('A transmissão foi encerrada.', s.data()?.recordingURL || null);
      }
    });
  } catch(e) {
    showEndedScreen('Não foi possível conectar à transmissão.');
    console.error('joinAsViewer error:', e);
  }
}

async function initAgoraViewer(liveId) {
  const token = await getAgoraToken(liveId);
  _agoraClient = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
  await _agoraClient.setClientRole('audience', { level: 1 });

  _agoraClient.on('user-published', async (user, mediaType) => {
    await _agoraClient.subscribe(user, mediaType);
    if (mediaType === 'video') {
      document.getElementById('viewer-waiting')?.remove();
      const container = document.getElementById('agora-video-container');
      container.style.cssText += ';position:relative;overflow:hidden';
      user.videoTrack.play(container);
      setTimeout(() => {
        container.querySelectorAll('video').forEach(v => {
          v.style.width  = '100%';
          v.style.height = '100%';
          v.style.objectFit = 'cover';
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');
        });
      }, 600);
    }
    if (mediaType === 'audio') {
      user.audioTrack.play();
    }
  });

  _agoraClient.on('user-unpublished', (user, mediaType) => {
    if (mediaType === 'video') {
      const c = document.getElementById('agora-video-container');
      if (c) c.innerHTML = `<div class="viewer-waiting"><i class="ti ti-camera-off" style="font-size:36px"></i><p style="font-size:13px">Câmera pausada pelo host</p></div>`;
    }
  });

  await _agoraClient.join(AGORA_APP_ID, liveId, token, null);
}

function leaveViewer(liveId) {
  _agoraClient?.leave().catch(() => {});
  _chatUnsub?.();
  _liveUnsub?.();
  db.collection('lives').doc(liveId).update({
    viewerCount: firebase.firestore.FieldValue.increment(-1)
  }).catch(() => {});
  location.href = '../index.html';
}

function incrementViewers(liveId) {
  db.collection('lives').doc(liveId).update({
    viewerCount: firebase.firestore.FieldValue.increment(1)
  }).catch(() => {});
  window.addEventListener('pagehide', () => {
    db.collection('lives').doc(liveId).update({
      viewerCount: firebase.firestore.FieldValue.increment(-1)
    }).catch(() => {});
  });
}

function showEndedScreen(msg, recordingURL = null) {
  document.getElementById('app-root').innerHTML = `
    <div class="live-ended-wrap">
      <i class="ti ti-broadcast-off" style="font-size:56px;color:var(--border)"></i>
      <p style="font-size:16px;font-weight:600">${sanitize(msg)}</p>
      ${recordingURL ? `
        <a href="${encodeURI(recordingURL)}" target="_blank" rel="noopener"
           class="btn btn-primary" style="gap:.4rem;text-decoration:none">
          <i class="ti ti-player-play"></i> Assistir gravação
        </a>` : ''}
      <button class="btn${recordingURL ? '' : ' btn-primary'}" onclick="location.href='../index.html'" style="gap:.4rem">
        <i class="ti ti-home"></i> Voltar ao feed
      </button>
    </div>`;
}

// ── Chat ───────────────────────────────────────────────────────
function chatPanelHTML(liveId) {
  return `
    <div class="live-chat-col">
      <div class="live-chat-header">
        <i class="ti ti-message-circle" style="color:var(--purple-600)"></i> Chat ao vivo
      </div>
      <div class="live-chat-msgs" id="chat-msgs"></div>
      <div class="live-chat-input-row">
        <input class="live-chat-input" id="chat-input" type="text" maxlength="200"
               placeholder="Mensagem…"
               onkeydown="if(event.key==='Enter')sendMsg('${liveId}')">
        <button class="live-send-btn" onclick="sendMsg('${liveId}')">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>`;
}

function subscribeChat(liveId) {
  _chatUnsub = db.collection('lives').doc(liveId).collection('messages')
    .orderBy('createdAt', 'asc')
    .limitToLast(150)
    .onSnapshot(snap => {
      const box = document.getElementById('chat-msgs');
      if (!box) return;
      snap.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        const d = ch.doc.data();
        const el = document.createElement('div');
        el.className = 'live-chat-msg';
        el.innerHTML = `<span class="msg-sender" onclick="location.href='perfil.html?uid=${encodeURIComponent(d.senderUid)}'">${sanitize(d.senderName||'Usuário')}</span>${sanitize(d.text||'')}`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
      });
    });
}

async function sendMsg(liveId) {
  const input = document.getElementById('chat-input');
  const text  = (input?.value || '').trim();
  if (!text || !currentUser) return;
  if (!checkRateLimit('livechat_' + currentUser.uid, 5, 3000))
    return showToast('Devagar! Aguarde um momento.');
  input.value = '';
  try {
    await db.collection('lives').doc(liveId).collection('messages').add({
      senderUid:   currentUser.uid,
      senderName:  currentUser.displayName || 'Usuário',
      senderPhoto: currentUser.photoURL || null,
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(_) {
    showToast('Não foi possível enviar a mensagem.');
  }
}

// ── Contador de espectadores ───────────────────────────────────
function subscribeViewerCount(liveId) {
  db.collection('lives').doc(liveId).onSnapshot(s => {
    const el = document.getElementById('viewer-count');
    if (el) el.textContent = s.data()?.viewerCount || 0;
  });
}

// ── Cleanup ao sair da página ──────────────────────────────────
window.addEventListener('pagehide', () => {
  _localAudio?.close();
  _localVideo?.close();
  _hostMediaStream?.getTracks().forEach(t => t.stop());
  _agoraClient?.leave().catch(() => {});
  _chatUnsub?.();
  _liveUnsub?.();
  if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
    try { _mediaRecorder.stop(); } catch(_) {}
  }
});

// ── Tela cheia do vídeo ────────────────────────────────────────
function toggleVideoFullscreen() {
  const col = document.querySelector('.live-video-col');
  if (!col) return;
  const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!isFS) {
    if (col.requestFullscreen) col.requestFullscreen();
    else if (col.webkitRequestFullscreen) col.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

function _syncFsBtn() {
  const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.querySelectorAll('.live-fullscreen-btn i').forEach(el => {
    el.className = `ti ${isFS ? 'ti-minimize' : 'ti-maximize'}`;
  });
}
document.addEventListener('fullscreenchange', _syncFsBtn);
document.addEventListener('webkitfullscreenchange', _syncFsBtn);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const input = document.getElementById('chat-input');
    if (input && document.activeElement === input) input.blur();
  }
});
</script>
