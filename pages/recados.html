<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Recados</title>
  <meta name="description" content="Envie e receba recados de amigos no Nexus.">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    .recados-page { max-width: 680px; margin: 0 auto; padding: 1.5rem .75rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .page-title { font-size: 20px; font-weight: 600; }
    .scrap-full {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.1rem;
      margin-bottom: .65rem;
      display: flex; gap: .75rem;
    }
    .scrap-full-content { flex: 1; min-width: 0; }
    .scrap-full-header { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .3rem; flex-wrap: wrap; }
    .scrap-full-author { font-size: 14px; font-weight: 500; cursor: pointer; }
    .scrap-full-author:hover { color: var(--purple-600); }
    .scrap-full-arrow { font-size: 12px; color: var(--text-muted); }
    .scrap-full-to { font-size: 13px; color: var(--purple-600); cursor: pointer; font-weight: 500; }
    .scrap-full-to:hover { text-decoration: underline; }
    .scrap-full-text { font-size: 14px; line-height: 1.6; color: var(--text-primary); }
    .scrap-full-time { font-size: 11px; color: var(--text-muted); margin-top: .35rem; }
    .tab-toggle {
      padding: .35rem .9rem; border: 0.5px solid var(--border-md);
      border-radius: var(--radius-full); background: none;
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all var(--transition);
    }
    .tab-toggle.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }
    .friend-result-item {
      display: flex; align-items: center; gap: .6rem;
      padding: .45rem .65rem; border-radius: var(--radius-md);
      cursor: pointer; transition: background var(--transition);
    }
    .friend-result-item:hover { background: var(--gray-50); }
    .scrap-reply-btn {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: .25rem;
      font-size: 12px; padding: .15rem .3rem;
      border-radius: var(--radius-sm); color: var(--text-muted);
      font-family: var(--font-sans); transition: color var(--transition);
    }
    .scrap-reply-btn:hover { color: var(--purple-600); }
    @media (max-width: 768px) {
      .recados-page { padding: 1rem .5rem calc(80px + 1rem); }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="recados-page">
    <div class="page-header">
      <h1 class="page-title">Meus recados</h1>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div class="card-body">
        <div class="card-title">Escrever recado para um amigo</div>
        <div style="display:flex;flex-direction:column;gap:.65rem">
          <div style="position:relative">
            <input class="form-input" type="text" id="scrap-to-search" placeholder="Buscar amigo pelo nome..." oninput="searchFriends(this.value)" autocomplete="off">
          </div>
          <div id="friend-results" style="display:none"></div>
          <div id="selected-friend" style="display:none;align-items:center;gap:.5rem;background:var(--purple-50);border-radius:var(--radius-md);padding:.5rem .75rem">
            <span id="selected-name" style="font-size:13px;font-weight:500;color:var(--purple-600);flex:1"></span>
            <button onclick="clearSelected()" style="background:none;border:none;cursor:pointer;color:var(--text-muted)"><i class="ti ti-x" style="font-size:14px" aria-hidden="true"></i></button>
          </div>
          <textarea class="composer-textarea" id="scrap-write-text" placeholder="Seu recado…" style="min-height:80px"></textarea>
          <button class="btn btn-primary btn-sm" style="align-self:flex-end" onclick="sendScrap()" id="send-scrap-btn">
            <i class="ti ti-send" aria-hidden="true"></i> Enviar
          </button>
        </div>
      </div>
    </div>

    <div style="margin-bottom:.75rem">
      <div style="display:flex;gap:.4rem;margin-bottom:.75rem">
        <button class="tab-toggle active" id="tab-recv" onclick="switchTab('received')">Recebidos</button>
        <button class="tab-toggle" id="tab-sent" onclick="switchTab('sent')">Enviados</button>
      </div>
    </div>

    <div id="scraps-container">
      <div class="loading-screen" style="min-height:120px"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser = null;
let selectedFriend = null;
let currentTab = 'received';

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'scraps');
  loadScraps('received');
});

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-recv').classList.toggle('active', tab === 'received');
  document.getElementById('tab-sent').classList.toggle('active', tab === 'sent');
  loadScraps(tab);
}

async function loadScraps(type) {
  const el = document.getElementById('scraps-container');
  el.innerHTML = '<div class="loading-screen" style="min-height:120px"><div class="spinner"></div></div>';

  try {
    const field = type === 'received' ? 'toUid' : 'fromUid';
    const snap = await db.collection('scraps')
      .where(field, '==', currentUser.uid)
      .orderBy('createdAt', 'desc')
      .limit(50).get();

    if (snap.empty) {
      el.innerHTML = `<div class="empty-state card"><i class="ti ti-messages" aria-hidden="true"></i><p>Nenhum recado ${type==='received'?'recebido':'enviado'} ainda.</p></div>`;
      return;
    }

    el.innerHTML = snap.docs.map(doc => {
      const s = doc.data();
      const isSent = type === 'sent';
      const authorUid   = isSent ? currentUser.uid : s.fromUid;
      const authorName  = isSent ? currentUser.displayName : s.fromName;
      const authorPhoto = isSent ? currentUser.photoURL : s.fromPhoto;
      const toUid  = s.toUid;
      const toName = s.toName || 'Usuário';

      const cl = getAvatarColor(authorUid);
      const av = authorPhoto
        ? `<img src="${authorPhoto}" alt="${authorName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : `<span style="color:${cl.color}">${getInitials(authorName)}</span>`;

      const likes = s.likes || [];
      const liked = likes.includes(currentUser.uid);
      const canDelete = currentUser.uid === s.toUid || currentUser.uid === s.fromUid;
      return `
      <div class="scrap-full" id="scrap-${doc.id}">
        <div class="avatar avatar-40" style="background:${cl.bg};cursor:pointer;flex-shrink:0"
             onclick="location.href='perfil.html?uid=${authorUid}'">${av}</div>
        <div class="scrap-full-content">
          <div class="scrap-full-header">
            <span class="scrap-full-author" onclick="location.href='perfil.html?uid=${authorUid}'">${sanitize(authorName||'Usuário')}</span>
            ${isSent ? `<span class="scrap-full-arrow">→</span><span class="scrap-full-to" onclick="location.href='perfil.html?uid=${toUid}'">${sanitize(toName)}</span>` : ''}
          </div>
          <div class="scrap-full-text">${sanitize(s.text).replace(/\n/g,'<br>')}</div>
          <div style="display:flex;align-items:center;gap:.75rem;margin-top:.35rem">
            <span class="scrap-full-time">${timeAgo(s.createdAt)}</span>
            <button id="scrap-like-${doc.id}" onclick="toggleScrapLike('${doc.id}',this)"
              style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.25rem;font-size:12px;padding:.15rem .3rem;border-radius:var(--radius-sm);transition:color var(--transition);color:${liked?'var(--coral-400)':'var(--text-muted)'}">
              <i class="ti ${liked?'ti-heart-filled':'ti-heart'}" style="font-size:14px"></i>
              <span>${likes.length || ''}</span>
            </button>
            ${type === 'received' && s.fromUid ? `<button class="scrap-reply-btn" data-uid="${s.fromUid}" data-name="${sanitize(s.fromName||'Usuário')}" onclick="replyToScrap(this)">
              <i class="ti ti-corner-up-left" style="font-size:13px"></i> Responder
            </button>` : ''}
          </div>
        </div>
        ${canDelete ? `<button onclick="deleteScrap('${doc.id}')" title="Excluir recado"
          style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:.25rem;flex-shrink:0;align-self:flex-start;margin-top:.1rem;border-radius:var(--radius-sm);transition:color var(--transition)"
          onmouseover="this.style.color='var(--coral-400)'" onmouseout="this.style.color='var(--text-muted)'">
          <i class="ti ti-trash" style="font-size:15px"></i>
        </button>` : ''}
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state card"><i class="ti ti-alert-circle"></i><p>Erro ao carregar recados. Tente novamente.</p></div>`;
  }
}

let searchTimeout;
async function searchFriends(q) {
  clearTimeout(searchTimeout);
  const el = document.getElementById('friend-results');
  if (!q.trim()) { el.style.display = 'none'; return; }
  searchTimeout = setTimeout(async () => {
    try {
      const snap = await db.collection('users')
        .orderBy('displayName')
        .startAt(q).endAt(q + '\uf8ff')
        .limit(5).get();

      if (snap.empty) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.innerHTML = `<div style="border:0.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)">
        ${snap.docs.filter(d => d.id !== currentUser.uid).map(d => {
          const u = { uid: d.id, ...d.data() };
          const cl = getAvatarColor(u.uid);
          const av = u.photoURL
            ? `<img src="${u.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
            : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
          return `<div class="friend-result-item" onclick="selectFriend('${u.uid}','${sanitize(u.displayName||'')}')">
            <div class="avatar avatar-32" style="background:${cl.bg}">${av}</div>
            <span style="font-size:13px">${sanitize(u.displayName||'Usuário')}</span>
          </div>`;
        }).join('')}
      </div>`;
    } catch(e) { el.style.display = 'none'; }
  }, 300);
}

function selectFriend(uid, name) {
  selectedFriend = { uid, name };
  document.getElementById('friend-results').style.display = 'none';
  document.getElementById('scrap-to-search').value = '';
  document.getElementById('selected-friend').style.display = 'flex';
  document.getElementById('selected-name').textContent = name;
}

function clearSelected() {
  selectedFriend = null;
  document.getElementById('selected-friend').style.display = 'none';
}

async function sendScrap() {
  const text = document.getElementById('scrap-write-text').value.trim();
  if (!selectedFriend) return showToast('Selecione um amigo.');
  if (!text) return showToast('Escreva algo no recado.');
  if (!checkRateLimit('scrap_' + currentUser.uid, 5, 60000))
    return showToast('Muitos recados seguidos. Aguarde um momento.');

  const btn = document.getElementById('send-scrap-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Enviando…';

  try {
    await db.collection('scraps').add({
      toUid:    selectedFriend.uid,
      toName:   selectedFriend.name,      // ← CORRIGIDO: salvar toName
      fromUid:  currentUser.uid,
      fromName: currentUser.displayName,
      fromPhoto: currentUser.photoURL || null,
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('scrap-write-text').value = '';
    clearSelected();
    showToast('Recado enviado!');

    // Notificar destinatário
    createNotification(selectedFriend.uid, 'scrap', {
      message: `${currentUser.displayName} te enviou um recado.`,
      link: `/pages/recados.html`,
      fromUid: currentUser.uid,
      fromName: currentUser.displayName
    });

    if (currentTab === 'sent') loadScraps('sent');
  } catch(e) {
    showToast('Erro ao enviar recado. Tente novamente.');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-send" aria-hidden="true"></i> Enviar';
}

function deleteScrap(id) {
  confirmAction('Excluir este recado?', async () => {
    try {
      await db.collection('scraps').doc(id).delete();
      document.getElementById(`scrap-${id}`)?.remove();
      showToast('Recado excluído.');
    } catch(e) { showToast('Erro ao excluir recado.'); }
  });
}

async function toggleScrapLike(id, btn) {
  const ref = db.collection('scraps').doc(id);
  const doc = await ref.get();
  if (!doc.exists) return;
  const likes = doc.data().likes || [];
  const liked = likes.includes(currentUser.uid);
  await ref.update({
    likes: liked
      ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  });
  const newCount = liked ? likes.length - 1 : likes.length + 1;
  const icon = btn.querySelector('i');
  const countEl = btn.querySelector('span');
  if (liked) {
    icon.className = 'ti ti-heart';
    btn.style.color = 'var(--text-muted)';
  } else {
    icon.className = 'ti ti-heart-filled';
    btn.style.color = 'var(--coral-400)';
  }
  countEl.textContent = newCount > 0 ? newCount : '';
}

function replyToScrap(btn) {
  const uid  = btn.dataset.uid;
  const name = btn.dataset.name;
  selectFriend(uid, name);
  document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
  setTimeout(() => document.getElementById('scrap-write-text').focus(), 350);
}

// Fechar resultados ao clicar fora
document.addEventListener('click', e => {
  if (!e.target.closest('#scrap-to-search') && !e.target.closest('#friend-results')) {
    document.getElementById('friend-results').style.display = 'none';
  }
});
</script>
</body>
</html>
