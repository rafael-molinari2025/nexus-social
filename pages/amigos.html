<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Amigos</title>
  <meta name="description" content="Gerencie suas amizades e solicitações no Nexus.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    .friends-page { max-width: 860px; margin: 0 auto; padding: 1.5rem .75rem; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 1.25rem; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin: 1.5rem 0 .75rem; }
    .requests-list { display: flex; flex-direction: column; gap: .5rem; }
    .request-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: .875rem 1rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .request-info { flex: 1; min-width: 0; }
    .request-name { font-size: 14px; font-weight: 500; }
    .request-sub { font-size: 12px; color: var(--text-muted); }
    .request-btns { display: flex; gap: .4rem; flex-shrink: 0; }
    .friends-big-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .75rem; }
    .friend-big-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem .875rem;
      display: flex; flex-direction: column; align-items: center; gap: .5rem;
      cursor: pointer; text-align: center;
      transition: box-shadow var(--transition);
    }
    .friend-big-card:hover { box-shadow: var(--shadow-md); }
    .friend-big-card-name { font-size: 13px; font-weight: 500; }
    .friend-big-card-sub { font-size: 11px; color: var(--text-muted); }
    .badge-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; background: var(--coral-400); color: #fff;
      border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
      padding: 0 5px; margin-left: .35rem;
    }
    .remove-friend-btn {
      background: none; border: none; cursor: pointer;
      font-size: 12px; color: var(--text-muted); margin-top: .25rem;
      transition: color var(--transition);
    }
    .remove-friend-btn:hover { color: var(--coral-400); }
    .friend-search-wrap { position: relative; margin-bottom: 1.25rem; }
    .friend-search-box {
      display: flex; align-items: center; gap: .5rem;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-xl); padding: .6rem 1rem;
      transition: border-color var(--transition);
    }
    .friend-search-box:focus-within { border-color: var(--purple-400); }
    .friend-search-input {
      flex: 1; border: none; background: none; outline: none;
      font-size: 14px; font-family: var(--font-sans); color: var(--text-primary);
    }
    .friend-search-input::placeholder { color: var(--text-muted); }
    .friend-search-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-md);
      z-index: 50; max-height: 300px; overflow-y: auto;
    }
    .friend-search-item {
      display: flex; align-items: center; gap: .65rem;
      padding: .65rem 1rem; transition: background var(--transition);
    }
    .friend-search-item:hover { background: var(--gray-50, #fafafa); }
    .friend-search-item-info { flex: 1; min-width: 0; }
    .friend-search-item-name { font-size: 13px; font-weight: 500; }
    .friend-search-item-bio { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 768px) {
      .friends-page { padding: 1rem .5rem calc(80px + 1rem); }
      .friends-big-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .request-card { padding: .75rem; }
      .request-btns { flex-direction: column; gap: .3rem; }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="friends-page">
    <h1 class="page-title">Amigos</h1>

    <div class="friend-search-wrap" id="friend-search-wrap">
      <div class="friend-search-box">
        <i class="ti ti-search" style="color:var(--text-muted);font-size:16px;flex-shrink:0" aria-hidden="true"></i>
        <input class="friend-search-input" id="friend-search" type="text"
               placeholder="Buscar pessoas para adicionar..."
               oninput="onFriendSearch(this.value)" autocomplete="off">
      </div>
      <div class="friend-search-dropdown" id="friend-search-dropdown" style="display:none"></div>
    </div>

    <div id="requests-section">
      <h2 class="section-title" id="requests-title">Solicitações recebidas</h2>
      <div class="requests-list" id="requests-list">
        <div class="loading-screen" style="min-height:80px"><div class="spinner"></div></div>
      </div>
    </div>

    <h2 class="section-title">Meus amigos</h2>
    <div class="friends-big-grid" id="friends-grid">
      <div class="loading-screen" style="min-height:100px;grid-column:1/-1"><div class="spinner"></div></div>
    </div>

    <h2 class="section-title">Pessoas que você pode conhecer</h2>
    <div class="friends-big-grid" id="suggestions-grid">
      <div class="loading-screen" style="min-height:100px;grid-column:1/-1"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser = null;

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'friends');
  loadRequests();
  loadFriends();
  loadSuggestions();
  loadSearchCache(); // pré-aquece o cache de busca em background
});

// ── Solicitações recebidas ────────────────────────────────────
async function loadRequests() {
  const el = document.getElementById('requests-list');
  const titleEl = document.getElementById('requests-title');
  try {
    const allSnap = await db.collection('friend_requests')
      .where('to', '==', currentUser.uid).get();
    const pendingDocs = allSnap.docs.filter(d => d.data().status === 'pending');

    if (!pendingDocs.length) {
      el.innerHTML = `<p style="font-size:13px;color:var(--text-muted)">Nenhuma solicitação pendente.</p>`;
      return;
    }
    titleEl.innerHTML = `Solicitações recebidas <span class="badge-count">${pendingDocs.length}</span>`;

    const requests = await Promise.all(pendingDocs.map(async doc => {
      const u = await getUserData(doc.data().from);
      return { docId: doc.id, user: u };
    }));

    el.innerHTML = requests.filter(r => r.user).map(r => {
      const cl = getAvatarColor(r.user.uid);
      const av = r.user.photoURL
        ? `<img src="${r.user.photoURL}" alt="${r.user.displayName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : `<span style="color:${cl.color}">${getInitials(r.user.displayName)}</span>`;
      return `<div class="request-card" id="req-${r.docId}">
        <div class="avatar avatar-48" style="background:${cl.bg};cursor:pointer"
             onclick="location.href='perfil.html?uid=${r.user.uid}'">${av}</div>
        <div class="request-info">
          <div class="request-name">${sanitize(r.user.displayName||'Usuário')}</div>
          <div class="request-sub">${sanitize(r.user.bio||r.user.city||r.user.email||'')}</div>
        </div>
        <div class="request-btns">
          <button class="btn btn-primary btn-sm" onclick="acceptRequest('${r.docId}','${r.user.uid}')">
            <i class="ti ti-check" aria-hidden="true"></i> Aceitar
          </button>
          <button class="btn btn-sm" onclick="declineRequest('${r.docId}')">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('loadRequests:', e);
    el.innerHTML = `<p style="font-size:13px;color:var(--text-muted)">Erro ao carregar solicitações.</p>`;
  }
}

async function acceptRequest(docId, fromUid) {
  try {
    const existing = await db.collection('friendships')
      .where('users', 'array-contains', currentUser.uid).get();
    const alreadyFriends = existing.docs.some(d => d.data().users.includes(fromUid));
    const batch = db.batch();
    batch.update(db.collection('friend_requests').doc(docId), { status: 'accepted' });
    if (!alreadyFriends) {
      batch.set(db.collection('friendships').doc(), {
        users: [currentUser.uid, fromUid],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    await batch.commit();
    document.getElementById(`req-${docId}`)?.remove();
    showToast('Solicitação aceita! Vocês agora são amigos.');
    createNotification(fromUid, 'friend_accept', {
      message: `${currentUser.displayName} aceitou sua solicitação de amizade!`,
      link: `/pages/perfil.html?uid=${currentUser.uid}`,
      fromUid: currentUser.uid,
      fromName: currentUser.displayName
    });
    loadFriends();
  } catch(e) {
    console.error('acceptRequest:', e);
    showToast('Erro ao aceitar solicitação.');
  }
}

async function declineRequest(docId) {
  try {
    await db.collection('friend_requests').doc(docId).update({ status: 'declined' });
    document.getElementById(`req-${docId}`)?.remove();
    showToast('Solicitação recusada.');
  } catch(e) {
    showToast('Erro ao recusar solicitação.');
  }
}

// ── Meus amigos ───────────────────────────────────────────────
async function loadFriends() {
  const el = document.getElementById('friends-grid');
  try {
    const snap = await db.collection('friendships')
      .where('users', 'array-contains', currentUser.uid).get();
    if (snap.empty) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <i class="ti ti-users-off" aria-hidden="true"></i>
        <p>Você ainda não tem amigos.<br>Use a busca acima para encontrar pessoas!</p>
      </div>`;
      return;
    }
    const ids = snap.docs.map(d => ({
      friendId: d.data().users.find(u => u !== currentUser.uid),
      docId: d.id
    }));
    const users = await Promise.all(ids.map(async ({ friendId, docId }) => {
      const u = await getUserData(friendId);
      return u ? { ...u, docId } : null;
    }));
    const valid = users.filter(Boolean);
    if (!valid.length) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <i class="ti ti-users-off" aria-hidden="true"></i>
        <p>Você ainda não tem amigos.</p>
      </div>`;
      return;
    }
    el.innerHTML = valid.map(u => {
      const cl = getAvatarColor(u.uid);
      const av = u.photoURL
        ? `<img src="${u.photoURL}" alt="${u.displayName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
      return `<div class="friend-big-card" onclick="location.href='perfil.html?uid=${u.uid}'">
        <div class="avatar avatar-48" style="background:${cl.bg}">${av}</div>
        <div class="friend-big-card-name">${sanitize(u.displayName||'Usuário')}</div>
        ${u.bio ? `<div class="friend-big-card-sub">${sanitize(u.bio)}</div>` : ''}
        <button class="remove-friend-btn" onclick="event.stopPropagation();removeFriend('${u.docId}','${u.displayName}')">
          <i class="ti ti-user-minus"></i> Desfazer amizade
        </button>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('loadFriends:', e);
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <i class="ti ti-alert-circle"></i>
      <p>Erro ao carregar amigos. Recarregue a página.</p>
    </div>`;
  }
}

async function removeFriend(friendshipDocId, name) {
  if (!confirm(`Desfazer amizade com ${name}?`)) return;
  try {
    await db.collection('friendships').doc(friendshipDocId).delete();
    showToast('Amizade desfeita.');
    loadFriends();
  } catch(e) {
    showToast('Erro ao desfazer amizade.');
  }
}

// ── Sugestões ─────────────────────────────────────────────────
async function loadSuggestions() {
  const el = document.getElementById('suggestions-grid');
  try {
    const [fSnap, rSnap, usersSnap] = await Promise.all([
      db.collection('friendships').where('users', 'array-contains', currentUser.uid).get(),
      db.collection('friend_requests').where('from', '==', currentUser.uid).get(),
      db.collection('users').limit(30).get()
    ]);
    const friendIds = new Set(fSnap.docs.flatMap(d => d.data().users));
    friendIds.add(currentUser.uid);
    const pendingIds = new Set(
      rSnap.docs.filter(d => d.data().status === 'pending').map(d => d.data().to)
    );
    const suggestions = usersSnap.docs
      .filter(d => !friendIds.has(d.id) && d.id !== currentUser.uid)
      .slice(0, 8);
    if (!suggestions.length) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <i class="ti ti-users" aria-hidden="true"></i><p>Sem sugestões no momento.</p>
      </div>`;
      return;
    }
    el.innerHTML = suggestions.map(d => {
      const u = { uid: d.id, ...d.data() };
      const cl = getAvatarColor(u.uid);
      const av = u.photoURL
        ? `<img src="${u.photoURL}" alt="${u.displayName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
      const isPending = pendingIds.has(u.uid);
      return `<div class="friend-big-card">
        <div class="avatar avatar-48" style="background:${cl.bg};cursor:pointer"
             onclick="location.href='perfil.html?uid=${u.uid}'">${av}</div>
        <div class="friend-big-card-name">${sanitize(u.displayName||'Usuário')}</div>
        ${u.bio ? `<div class="friend-big-card-sub">${sanitize(u.bio)}</div>` : ''}
        <button class="btn btn-sm" id="sugg-${u.uid}" style="margin-top:.25rem"
                ${isPending ? 'disabled' : ''}
                onclick="sendRequest('${u.uid}', this)">
          ${isPending
            ? '<i class="ti ti-check" aria-hidden="true"></i> Enviado'
            : '<i class="ti ti-user-plus" aria-hidden="true"></i> Adicionar'}
        </button>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('loadSuggestions:', e);
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <i class="ti ti-alert-circle"></i><p>Erro ao carregar sugestões.</p>
    </div>`;
  }
}

// ── Cache de busca (carregado uma vez por sessão) ─────────────
let _friendSearchTimer = null;
let _searchAllUsers    = null;   // todos os usuários (exceto o próprio)
let _searchFriendIds   = new Set();
let _searchPendingIds  = new Set();
let _searchCacheLoading = false;

async function loadSearchCache() {
  if (_searchAllUsers || _searchCacheLoading) return;
  _searchCacheLoading = true;
  try {
    const [usersSnap, fSnap, rSnap] = await Promise.all([
      db.collection('users').limit(500).get(),
      db.collection('friendships').where('users', 'array-contains', currentUser.uid).get(),
      db.collection('friend_requests').where('from', '==', currentUser.uid).get()
    ]);
    _searchAllUsers   = usersSnap.docs
      .filter(d => d.id !== currentUser.uid)
      .map(d => ({ uid: d.id, ...d.data() }));
    _searchFriendIds  = new Set(fSnap.docs.flatMap(d => d.data().users));
    _searchPendingIds = new Set(
      rSnap.docs.filter(d => d.data().status === 'pending').map(d => d.data().to)
    );
  } catch(e) {
    console.error('loadSearchCache:', e);
    _searchAllUsers = [];
  } finally {
    _searchCacheLoading = false;
  }
}

function onFriendSearch(q) {
  clearTimeout(_friendSearchTimer);
  const dd = document.getElementById('friend-search-dropdown');
  if (!q.trim()) { dd.style.display = 'none'; return; }

  if (!_searchAllUsers) {
    dd.innerHTML = `<div style="padding:.75rem 1rem;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:.5rem">
      <div class="spinner" style="width:16px;height:16px"></div> Carregando…</div>`;
    dd.style.display = 'block';
    loadSearchCache().then(() => doFriendSearch(q));
    return;
  }
  _friendSearchTimer = setTimeout(() => doFriendSearch(q), 200);
}

function doFriendSearch(q) {
  const dd = document.getElementById('friend-search-dropdown');
  const qLower = q.toLowerCase().trim();
  if (!qLower) { dd.style.display = 'none'; return; }
  dd.style.display = 'block';

  const users = (_searchAllUsers || []).filter(u => {
    const name  = (u.displayName || '').toLowerCase();
    const uname = (u.username    || '').toLowerCase();
    const mail  = (u.email       || '').toLowerCase();
    return name.includes(qLower) || uname.includes(qLower) || mail.includes(qLower);
  }).slice(0, 10);

  if (!users.length) {
    dd.innerHTML = `<div style="padding:.75rem 1rem;font-size:13px;color:var(--text-muted)">
      Nenhum usuário encontrado para "<strong>${sanitize(q)}</strong>".</div>`;
    return;
  }

  dd.innerHTML = users.map(u => {
    const cl = getAvatarColor(u.uid);
    const av = u.photoURL
      ? `<img src="${u.photoURL}" alt="${sanitize(u.displayName)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
    const isFriend  = _searchFriendIds.has(u.uid);
    const isPending = _searchPendingIds.has(u.uid);
    let actionBtn = '';
    if (isFriend) {
      actionBtn = `<button class="btn btn-sm" disabled>
        <i class="ti ti-check" aria-hidden="true"></i> Amigos</button>`;
    } else if (isPending) {
      actionBtn = `<button class="btn btn-sm" disabled>
        <i class="ti ti-check" aria-hidden="true"></i> Enviado</button>`;
    } else {
      actionBtn = `<button class="btn btn-primary btn-sm" id="fs-${u.uid}"
                     onclick="sendRequest('${u.uid}', this)">
        <i class="ti ti-user-plus" aria-hidden="true"></i> Adicionar</button>`;
    }
    return `<div class="friend-search-item">
      <div class="avatar avatar-36" style="background:${cl.bg};cursor:pointer;flex-shrink:0"
           onclick="location.href='perfil.html?uid=${u.uid}'">${av}</div>
      <div class="friend-search-item-info">
        <div class="friend-search-item-name">${sanitize(u.displayName || 'Usuário')}</div>
        ${u.bio ? `<div class="friend-search-item-bio">${sanitize(u.bio)}</div>` : ''}
      </div>
      ${actionBtn}
    </div>`;
  }).join('');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#friend-search-wrap')) {
    const dd = document.getElementById('friend-search-dropdown');
    if (dd) dd.style.display = 'none';
  }
});

// ── Enviar solicitação ────────────────────────────────────────
async function sendRequest(toUid, btn) {
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i>';
  try {
    // Verificar duplicata com query simples (sem índice composto)
    const existing = await db.collection('friend_requests')
      .where('from', '==', currentUser.uid).get();
    const hasPending = existing.docs.some(
      d => d.data().to === toUid && d.data().status === 'pending'
    );
    if (hasPending) {
      btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Enviado';
      return;
    }
    await db.collection('friend_requests').add({
      from: currentUser.uid,
      to: toUid,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    _searchPendingIds.add(toUid); // atualiza cache local
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Enviado';
    showToast('Solicitação enviada!');
    createNotification(toUid, 'friend_request', {
      message: `${currentUser.displayName} enviou uma solicitação de amizade.`,
      link: '/pages/amigos.html',
      fromUid: currentUser.uid,
      fromName: currentUser.displayName
    });
  } catch(e) {
    console.error('sendRequest:', e);
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-user-plus" aria-hidden="true"></i> Adicionar';
    showToast('Erro ao enviar solicitação.');
  }
}

</script>
</body>
</html>
