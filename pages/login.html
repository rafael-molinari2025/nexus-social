<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CYDS5B5TN5"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-CYDS5B5TN5');

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Nexus</title>
  <meta name="description" content="Entre na sua conta Nexus e conecte-se com quem você gosta.">
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Entrar — Nexus">
  <meta property="og:description" content="Entre na sua conta Nexus e conecte-se com quem você gosta.">
  <meta property="og:url"         content="https://nexus.primetitec.com.br/pages/login.html">
  <meta property="og:image"       content="https://nexus.primetitec.com.br/og-image.png">
  <meta name="twitter:card"       content="summary_large_image">
  <link rel="canonical"           href="https://nexus.primetitec.com.br/pages/login.html">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
  .tab-toggle {
    flex:1; height:34px; border:none; background:none;
    border-radius:calc(var(--radius-md) - 1px);
    font-size:13px; font-weight:500; cursor:pointer;
    color:var(--text-secondary); font-family:var(--font-sans);
    transition: all var(--transition);
  }
  .tab-toggle.active {
    background:var(--surface); color:var(--purple-600);
    box-shadow:var(--shadow-sm);
  }

  /* Step indicator */
  .step-indicator {
    display: flex; align-items: center; justify-content: center;
    gap: .5rem; margin-bottom: 1.25rem;
  }
  .step-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gray-200); transition: all .3s ease;
  }
  .step-dot.active { background: var(--purple-600); width: 24px; border-radius: 4px; }
  .step-dot.done  { background: var(--purple-400); }

  .step-title {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-align: center; margin-bottom: 1rem; text-transform: uppercase;
    letter-spacing: .05em;
  }

  /* Gender select */
  .gender-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
  .gender-btn {
    padding: .6rem .5rem; border: 1.5px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); font-size: 12px; font-weight: 500;
    color: var(--text-secondary); cursor: pointer; text-align: center;
    transition: all var(--transition); font-family: var(--font-sans);
  }
  .gender-btn:hover { border-color: var(--purple-400); color: var(--purple-600); }
  .gender-btn.selected { border-color: var(--indigo-500); background: var(--indigo-50); color: var(--indigo-500); }

  /* Password strength */
  .pass-strength { height: 4px; border-radius: 2px; margin-top: .35rem; transition: all .3s; }
  .pass-hint { font-size: 11px; color: var(--text-muted); margin-top: .25rem; }

  /* Input with icon */
  .input-icon-wrap { position: relative; }
  .input-icon-wrap .form-input { padding-left: 2.4rem; }
  .input-icon-wrap .input-icon {
    position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 15px; pointer-events: none;
  }
  .input-icon-wrap .input-suffix {
    position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 13px; cursor: pointer;
  }

  /* Inline fields */
  .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }

  /* Navigation buttons */
  .step-nav { display: flex; gap: .65rem; }
  .step-nav .btn-back {
    flex: 0 0 42px; height: 42px; border-radius: var(--radius-md);
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-secondary); cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 16px;
    transition: all var(--transition);
  }
  .step-nav .btn-back:hover { border-color: var(--purple-400); color: var(--purple-600); }

  /* Terms */
  .terms-check { display: flex; align-items: flex-start; gap: .5rem; font-size: 12px; color: var(--text-muted); }
  .terms-check input[type=checkbox] { margin-top: 2px; accent-color: var(--purple-600); flex-shrink: 0; }
  .terms-check a { color: var(--purple-600); text-decoration: none; }

  /* Auth card wider for signup */
  .auth-card.wide { max-width: 440px; }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card" id="auth-card">
    <div>
      <div class="auth-logo">nexus</div>
      <p class="auth-subtitle">Conecte-se com quem você gosta</p>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- Abas -->
    <div id="tabs-container" style="display:flex;background:var(--gray-100);border-radius:var(--radius-md);padding:3px;gap:3px">
      <button class="tab-toggle active" id="tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab-toggle" id="tab-signup" onclick="switchTab('signup')">Cadastrar</button>
    </div>

    <!-- ═══════════════ LOGIN ═══════════════ -->
    <div id="form-login">
      <div style="display:flex;flex-direction:column;gap:.85rem">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <div class="input-icon-wrap">
            <i class="ti ti-mail input-icon"></i>
            <input class="form-input" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <div class="input-icon-wrap">
            <i class="ti ti-lock input-icon"></i>
            <input class="form-input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            <span class="input-suffix" onclick="togglePass('login-password', this)"><i class="ti ti-eye"></i></span>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="loginEmail()">
          <i class="ti ti-login"></i> Entrar
        </button>
        <button type="button" onclick="forgotPassword()" style="background:none;border:none;color:var(--purple-600);font-size:12px;cursor:pointer;align-self:flex-end;font-family:var(--font-sans);margin-top:-.25rem">
          Esqueceu a senha?
        </button>
      </div>
    </div>

    <!-- ═══════════════ CADASTRO (2 etapas) ═══════════════ -->
    <div id="form-signup" style="display:none">

      <!-- Indicador de etapas -->
      <div class="step-indicator">
        <div class="step-dot active" id="dot-1"></div>
        <div class="step-dot" id="dot-2"></div>
      </div>

      <!-- ETAPA 1: Conta -->
      <div id="signup-step-1">
        <div class="step-title"><i class="ti ti-user-circle"></i> Dados da conta</div>
        <div style="display:flex;flex-direction:column;gap:.75rem">

          <div class="fields-row">
            <div class="form-group">
              <label class="form-label">Nome</label>
              <input class="form-input" type="text" id="signup-firstname" placeholder="Rafael" autocomplete="given-name">
            </div>
            <div class="form-group">
              <label class="form-label">Sobrenome</label>
              <input class="form-input" type="text" id="signup-lastname" placeholder="Molinari" autocomplete="family-name">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">E-mail</label>
            <div class="input-icon-wrap">
              <i class="ti ti-mail input-icon"></i>
              <input class="form-input" type="email" id="signup-email" placeholder="seu@email.com" autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="input-icon-wrap">
              <i class="ti ti-lock input-icon"></i>
              <input class="form-input" type="password" id="signup-password"
                     placeholder="Mínimo 6 caracteres" autocomplete="new-password"
                     oninput="checkPassStrength(this.value)">
              <span class="input-suffix" onclick="togglePass('signup-password', this)"><i class="ti ti-eye"></i></span>
            </div>
            <div class="pass-strength" id="pass-bar" style="background:var(--gray-200);width:0"></div>
            <div class="pass-hint" id="pass-hint"></div>
          </div>

          <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="goStep2()">
            Continuar <i class="ti ti-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- ETAPA 2: Perfil -->
      <div id="signup-step-2" style="display:none">
        <div class="step-title"><i class="ti ti-id-badge"></i> Sobre você</div>
        <div style="display:flex;flex-direction:column;gap:.75rem">

          <div class="form-group">
            <label class="form-label">E-mail</label>
            <div class="input-icon-wrap">
              <i class="ti ti-mail input-icon"></i>
              <input class="form-input" type="email" id="signup-email-confirm" placeholder="seu@email.com" autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Nome de usuário</label>
            <div class="input-icon-wrap">
              <i class="ti ti-at input-icon"></i>
              <input class="form-input" type="text" id="signup-username"
                     placeholder="nome.usuario" autocomplete="username"
                     oninput="this.value=this.value.replace(/[^a-z0-9_.]/gi,'').toLowerCase()">
            </div>
            <div class="pass-hint">Apenas letras, números, _ e . Sem espaços.</div>
          </div>

          <div class="form-group">
            <label class="form-label">Data de nascimento</label>
            <div class="input-icon-wrap">
              <i class="ti ti-calendar input-icon"></i>
              <input class="form-input" type="date" id="signup-birthdate" max="">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Gênero</label>
            <div class="gender-grid">
              <button type="button" class="gender-btn" id="g-masculino" onclick="selectGender('Masculino')">
                <i class="ti ti-gender-male"></i><br>Masculino
              </button>
              <button type="button" class="gender-btn" id="g-feminino" onclick="selectGender('Feminino')">
                <i class="ti ti-gender-female"></i><br>Feminino
              </button>
              <button type="button" class="gender-btn" id="g-outro" onclick="selectGender('Outro')">
                <i class="ti ti-gender-androgyne"></i><br>Outro
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Cidade <span style="color:var(--text-muted);font-weight:400">(opcional)</span></label>
            <div class="input-icon-wrap">
              <i class="ti ti-map-pin input-icon"></i>
              <input class="form-input" type="text" id="signup-city" placeholder="Ex: São Paulo, SP">
            </div>
          </div>

          <div class="terms-check">
            <input type="checkbox" id="signup-terms">
            <label for="signup-terms">
              Li e aceito os <a href="termos.html" target="_blank">Termos de Uso</a> e a <a href="privacidade.html" target="_blank">Política de Privacidade</a> do Nexus.
            </label>
          </div>

          <div class="step-nav">
            <button type="button" class="btn-back" onclick="goStep1()" title="Voltar">
              <i class="ti ti-arrow-left"></i>
            </button>
            <button class="btn btn-primary" style="flex:1;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="signupEmail()">
              <i class="ti ti-user-plus"></i> Criar conta
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════ VERIFICAR E-MAIL ═══════════════ -->
    <div id="form-verify" style="display:none;text-align:center;padding:.5rem 0">
      <div style="font-size:44px;margin-bottom:.75rem">📧</div>
      <h3 style="font-size:17px;font-weight:600;margin-bottom:.4rem;color:var(--text-primary)">Verifique seu e-mail</h3>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:1.5rem;line-height:1.5">
        Enviamos um link de confirmação para<br>
        <strong id="verify-email-display" style="color:var(--text-primary)"></strong>
      </p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md);margin-bottom:.65rem" onclick="checkVerified()">
        <i class="ti ti-circle-check"></i> Já verifiquei
      </button>
      <button type="button" onclick="resendVerification()" style="background:none;border:none;color:var(--purple-600);font-size:13px;cursor:pointer;font-family:var(--font-sans)">
        Reenviar e-mail de verificação
      </button>
    </div>

    <div id="google-section">
    <div class="divider">ou</div>

    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com Google
    </button>
    </div><!-- /google-section -->
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
  redirectIfLoggedIn(user => showVerifyScreen(user.email));

  // Set max date (must be 13+)
  const maxDate = new Date();
  maxDate.setFullYear(maxDate.getFullYear() - 13);
  document.getElementById('signup-birthdate').max = maxDate.toISOString().split('T')[0];

  let selectedGender = '';

  function switchTab(tab) {
    document.getElementById('form-login').style.display  = tab==='login'  ? '' : 'none';
    document.getElementById('form-signup').style.display = tab==='signup' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab==='login');
    document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
    clearError();
    if (tab === 'signup') {
      document.getElementById('auth-card').classList.add('wide');
      goStep1();
    } else {
      document.getElementById('auth-card').classList.remove('wide');
    }
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg; el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function clearError() {
    document.getElementById('auth-error').style.display = 'none';
  }

  function togglePass(id, btn) {
    const inp = document.getElementById(id);
    const isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    btn.innerHTML = isText ? '<i class="ti ti-eye"></i>' : '<i class="ti ti-eye-off"></i>';
  }

  function checkPassStrength(val) {
    const bar = document.getElementById('pass-bar');
    const hint = document.getElementById('pass-hint');
    if (!val) { bar.style.width='0'; bar.style.background='var(--gray-200)'; hint.textContent=''; return; }
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { pct:'20%', color:'#EF4444', label:'Muito fraca' },
      { pct:'40%', color:'#F97316', label:'Fraca' },
      { pct:'60%', color:'#EAB308', label:'Razoável' },
      { pct:'80%', color:'#22C55E', label:'Boa' },
      { pct:'100%',color:'#16A34A', label:'Excelente' },
    ];
    const l = levels[Math.min(score, 4)];
    bar.style.width = l.pct;
    bar.style.background = l.color;
    hint.textContent = `Força: ${l.label}`;
    hint.style.color = l.color;
  }

  function selectGender(g) {
    selectedGender = g;
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
    const map = { 'Masculino':'g-masculino', 'Feminino':'g-feminino', 'Outro':'g-outro' };
    document.getElementById(map[g]).classList.add('selected');
  }

  function goStep1() {
    document.getElementById('signup-step-1').style.display = '';
    document.getElementById('signup-step-2').style.display = 'none';
    document.getElementById('dot-1').className = 'step-dot active';
    document.getElementById('dot-2').className = 'step-dot';
    clearError();
  }

  function goStep2() {
    clearError();
    const first = document.getElementById('signup-firstname').value.trim();
    const last  = document.getElementById('signup-lastname').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass  = document.getElementById('signup-password').value;
    if (!first || !last) return showError('Informe seu nome e sobrenome.');
    if (!email) return showError('Informe um e-mail válido.');
    if (pass.length < 6) return showError('A senha deve ter pelo menos 6 caracteres.');
    document.getElementById('signup-email-confirm').value = email;
    document.getElementById('signup-step-1').style.display = 'none';
    document.getElementById('signup-step-2').style.display = '';
    document.getElementById('dot-1').className = 'step-dot done';
    document.getElementById('dot-2').className = 'step-dot active';
  }

  async function handleAuthSuccess(user, extraData = {}) {
    const base = { uid: user.uid, email: user.email };
    if (user.photoURL)    base.photoURL    = user.photoURL;
    if (user.displayName) base.displayName = user.displayName;
    const data = { ...base, ...extraData, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (data.displayName) data.displayName_lower = data.displayName.toLowerCase();
    await updateUserData(user.uid, data);
    window.location.href = `/pages/perfil.html?uid=${user.uid}`;
  }

  async function loginEmail() {
    clearError();
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    if (!email || !pass) return showError('Preencha e-mail e senha.');
    try {
      const { user } = await auth.signInWithEmailAndPassword(email, pass);
      if (!user.emailVerified) {
        showVerifyScreen(user.email);
        return;
      }
      await handleAuthSuccess(user);
    } catch(e) {
      showError(
        e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential'
          ? 'E-mail ou senha incorretos.'
          : 'Erro ao entrar. Tente novamente.'
      );
    }
  }

  function showVerifyScreen(email) {
    document.getElementById('tabs-container').style.display = 'none';
    document.getElementById('form-login').style.display    = 'none';
    document.getElementById('form-signup').style.display   = 'none';
    document.getElementById('google-section').style.display = 'none';
    document.getElementById('form-verify').style.display   = '';
    document.getElementById('verify-email-display').textContent = email || '';
    document.getElementById('auth-card').classList.remove('wide');
    clearError();
  }

  async function checkVerified() {
    const user = auth.currentUser;
    if (!user) return showError('Sessão expirada. Faça login novamente.');
    await user.reload();
    if (user.emailVerified) {
      await handleAuthSuccess(user);
    } else {
      showError('E-mail ainda não verificado. Verifique sua caixa de entrada e clique no link.');
    }
  }

  async function resendVerification() {
    const user = auth.currentUser;
    if (!user) return showError('Sessão expirada. Faça login novamente.');
    try {
      await user.sendEmailVerification();
      const el = document.getElementById('auth-error');
      el.textContent = 'E-mail reenviado! Verifique sua caixa de entrada.';
      el.style.background  = 'var(--green-50, rgba(46,168,117,0.12))';
      el.style.borderColor = 'var(--green-400, #2EA875)';
      el.style.color       = 'var(--green-700, #0F6E56)';
      el.style.display     = 'block';
    } catch(e) {
      showError('Erro ao reenviar. Aguarde um momento e tente novamente.');
    }
  }

  async function signupEmail() {
    clearError();
    const first    = document.getElementById('signup-firstname').value.trim();
    const last     = document.getElementById('signup-lastname').value.trim();
    const email    = document.getElementById('signup-email-confirm').value.trim() || document.getElementById('signup-email').value.trim();
    const pass     = document.getElementById('signup-password').value;
    const username = document.getElementById('signup-username').value.trim().toLowerCase();
    const birth    = document.getElementById('signup-birthdate').value;
    const city     = document.getElementById('signup-city').value.trim();
    const terms    = document.getElementById('signup-terms').checked;

    if (!username) return showError('Escolha um nome de usuário.');
    if (username.length < 3) return showError('O nome de usuário deve ter pelo menos 3 caracteres.');
    if (!birth) return showError('Informe sua data de nascimento.');
    if (!selectedGender) return showError('Selecione seu gênero.');
    if (!terms) return showError('Você precisa aceitar os termos para continuar.');

    const displayName = `${first} ${last}`;
    const btn = document.querySelector('#signup-step-2 .btn-primary');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Criando conta…';

    // ── Passo 1: criar conta no Firebase Auth ─────────────────
    let user;
    try {
      const result = await auth.createUserWithEmailAndPassword(email, pass);
      user = result.user;
      await user.updateProfile({ displayName });
    } catch(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-user-plus"></i> Criar conta';
      return showError(
        e.code === 'auth/email-already-in-use'
          ? 'Este e-mail já está cadastrado. Tente entrar.'
          : e.code === 'auth/invalid-email'
            ? 'E-mail inválido.'
            : 'Erro ao criar conta. Tente novamente.'
      );
    }

    // ── Passo 2: verificar username único ─────────────────────
    try {
      const usernameSnap = await db.collection('users').where('username', '==', username).get();
      if (!usernameSnap.empty) {
        try { await user.delete(); } catch(_) {}
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-user-plus"></i> Criar conta';
        return showError('Este nome de usuário já está em uso. Escolha outro.');
      }
    } catch(e) {
      console.warn('username check failed, proceeding:', e);
    }

    // ── Passo 3: salvar perfil no Firestore (com retry) ───────
    const firestoreData = {
      uid: user.uid, email: user.email, displayName,
      displayName_lower: displayName.toLowerCase(),
      username, birthdate: birth, gender: selectedGender, city,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    for (let attempt = 1; attempt <= 3; attempt++) {
      try { await updateUserData(user.uid, firestoreData); break; }
      catch(e) {
        if (attempt < 3) await new Promise(r => setTimeout(r, 600 * attempt));
      }
    }

    // ── Passo 4: enviar e-mail de verificação e aguardar confirmação ──
    try { await user.sendEmailVerification(); } catch(_) {}
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-user-plus"></i> Criar conta';
    showVerifyScreen(user.email);
  }

  async function loginGoogle() {
    clearError();
    try {
      const { user } = await auth.signInWithPopup(googleProvider);
      await handleAuthSuccess(user);
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') showError('Erro ao entrar com Google.');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginVisible = document.getElementById('form-login').style.display !== 'none';
      if (loginVisible) { loginEmail(); return; }
      const step1 = document.getElementById('signup-step-1');
      if (step1.style.display !== 'none') { goStep2(); } else { signupEmail(); }
    }
  });

  async function forgotPassword() {
    clearError();
    const email = document.getElementById('login-email').value.trim();
    if (!email) return showError('Digite seu e-mail para receber o link de recuperação.');
    try {
      await auth.sendPasswordResetEmail(email);
      const el = document.getElementById('auth-error');
      el.textContent = 'Link enviado para ' + email + '. Verifique sua caixa de entrada.';
      el.style.background = 'var(--green-50, rgba(46,168,117,0.12))';
      el.style.borderColor = 'var(--green-400, #2EA875)';
      el.style.color = 'var(--green-700, #0F6E56)';
      el.style.display = 'block';
    } catch(e) {
      showError('Não encontramos uma conta com esse e-mail. Verifique e tente novamente.');
    }
  }
</script>
