<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Comunidades</title>
  <meta name="description" content="Explore e crie comunidades no Nexus.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
  <style>
    .comm-page { max-width: 860px; margin: 0 auto; padding: 1.5rem .75rem; }
    .comm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .75rem; }
    .comm-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      cursor: pointer; transition: box-shadow var(--transition), transform var(--transition);
    }
    .comm-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .comm-card-banner { height: 72px; display: flex; align-items: center; justify-content: center; }
    .comm-card-body { padding: .875rem 1rem; }
    .comm-card-name { font-size: 15px; font-weight: 600; margin-bottom: .25rem; }
    .comm-card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: .65rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .comm-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .comm-card-members { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: .25rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .page-title { font-size: 20px; font-weight: 600; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin: 1.5rem 0 .75rem; }
    @media (max-width: 768px) {
      .comm-page { padding: 1rem .5rem calc(80px + 1rem); }
      .comm-grid { grid-template-columns: 1fr; }
      .page-header { flex-wrap: wrap; gap: .5rem; }
    }
    @media (max-width: 380px) {
      .comm-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>

<div style="padding-top: var(--topbar-h)">
  <div class="comm-page">
    <div class="page-header">
      <h1 class="page-title">Comunidades</h1>
      <button class="btn btn-primary" onclick="openCreateModal()">
        <i class="ti ti-plus" aria-hidden="true"></i> Nova comunidade
      </button>
    </div>

    <h2 class="section-title">Minhas comunidades</h2>
    <div id="my-comms" class="comm-grid">
      <div class="loading-screen" style="min-height:100px;grid-column:1/-1"><div class="spinner"></div></div>
    </div>

    <h2 class="section-title">Descobrir</h2>
    <div id="all-comms" class="comm-grid">
      <div class="loading-screen" style="min-height:100px;grid-column:1/-1"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- Create modal -->
<div class="modal-overlay" id="create-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nova comunidade</span>
      <button class="btn btn-icon" onclick="closeCreateModal()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.85rem">
      <div class="form-group">
        <label class="form-label">Nome da comunidade</label>
        <input class="form-input" type="text" id="comm-name" placeholder="Ex: Devs do Brasil">
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <textarea class="composer-textarea" id="comm-desc" placeholder="Sobre o que é esta comunidade?" style="min-height:80px"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-input" id="comm-category">
          <option value="tecnologia">Tecnologia</option>
          <option value="musica">Música</option>
          <option value="arte">Arte &amp; Design</option>
          <option value="esportes">Esportes</option>
          <option value="jogos">Jogos</option>
          <option value="livros">Livros</option>
          <option value="outros">Outros</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="createCommunity()">
        Criar comunidade
      </button>
    </div>
  </div>
</div>

<!-- Edit community modal -->
<div class="modal-overlay" id="edit-comm-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Editar comunidade</span>
      <button class="btn btn-icon" onclick="closeEditCommModal()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.85rem">
      <div class="form-group">
        <label class="form-label">Nome da comunidade</label>
        <input class="form-input" type="text" id="edit-comm-name" placeholder="Ex: Devs do Brasil">
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <textarea class="composer-textarea" id="edit-comm-desc" placeholder="Sobre o que é esta comunidade?" style="min-height:80px"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-input" id="edit-comm-category">
          <option value="tecnologia">Tecnologia</option>
          <option value="musica">Música</option>
          <option value="arte">Arte &amp; Design</option>
          <option value="esportes">Esportes</option>
          <option value="jogos">Jogos</option>
          <option value="livros">Livros</option>
          <option value="outros">Outros</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="saveEditCommunity()">
        <i class="ti ti-device-floppy" aria-hidden="true"></i> Salvar alterações
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser = null;
const CATEGORY_COLORS = {
  tecnologia: {bg:'#EEF2FF',c:'#6366F1',icon:'ti-code'},
  musica:     {bg:'#FAEEDA',c:'#854F0B',icon:'ti-music'},
  arte:       {bg:'#FBEAF0',c:'#993556',icon:'ti-palette'},
  esportes:   {bg:'#E1F5EE',c:'#0F6E56',icon:'ti-ball-football'},
  jogos:      {bg:'#FAECE7',c:'#993C1D',icon:'ti-device-gamepad'},
  livros:     {bg:'#E6F1FB',c:'#185FA5',icon:'ti-book'},
  outros:     {bg:'#F1EFE8',c:'#5F5E5A',icon:'ti-users-group'}
};

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, 'communities');
  loadMyCommunities();
  loadAllCommunities();
});

function commCardHTML(id, d, isOwner = false) {
  const cl = CATEGORY_COLORS[d.category] || CATEGORY_COLORS.outros;
  const adminBtns = isOwner ? `
    <div style="display:flex;gap:.3rem;margin-top:.5rem">
      <button class="btn btn-sm" style="flex:1;justify-content:center;font-size:11px"
              onclick="event.stopPropagation();openEditComm('${id}','${sanitize(d.name).replace(/'/g,"\\'")}','${sanitize(d.description||'').replace(/'/g,"\\'")}','${d.category||'outros'}')">
        <i class="ti ti-pencil" aria-hidden="true"></i> Editar
      </button>
      <button class="btn btn-sm" style="flex:1;justify-content:center;font-size:11px;border-color:var(--coral-400);color:var(--coral-400)"
              onclick="event.stopPropagation();deleteCommunity('${id}','${sanitize(d.name).replace(/'/g,"\\'")}')">
        <i class="ti ti-trash" aria-hidden="true"></i> Excluir
      </button>
    </div>` : '';
  return `
  <div class="comm-card" onclick="location.href='comunidade.html?id=${id}'">
    <div class="comm-card-banner" style="background:${cl.bg}">
      <i class="ti ${cl.icon}" style="font-size:32px;color:${cl.c}" aria-hidden="true"></i>
    </div>
    <div class="comm-card-body">
      <div class="comm-card-name">${sanitize(d.name)}</div>
      <div class="comm-card-desc">${sanitize(d.description||'')}</div>
      <div class="comm-card-footer">
        <div class="comm-card-members"><i class="ti ti-users" aria-hidden="true"></i> ${d.membersCount||0} membros</div>
        <span style="font-size:10px;background:${cl.bg};color:${cl.c};padding:2px 8px;border-radius:var(--radius-full);font-weight:500">${d.category||'outros'}</span>
      </div>
      ${adminBtns}
    </div>
  </div>`;
}

async function loadMyCommunities() {
  const el = document.getElementById('my-comms');
  const snap = await db.collection('community_members').where('uid','==',currentUser.uid).get();
  if (snap.empty) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-users-off" aria-hidden="true"></i><p>Você ainda não faz parte de nenhuma comunidade.</p></div>`;
    return;
  }
  const ids = snap.docs.map(d => d.data().communityId);
  const comms = await Promise.all(ids.map(id => db.collection('communities').doc(id).get()));
  el.innerHTML = comms.filter(d => d.exists).map(d => {
    const isOwner = d.data().createdBy === currentUser.uid;
    return commCardHTML(d.id, d.data(), isOwner);
  }).join('');
}

async function loadAllCommunities() {
  const el = document.getElementById('all-comms');
  const snap = await db.collection('communities').orderBy('membersCount','desc').limit(20).get();
  if (snap.empty) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-users-group" aria-hidden="true"></i><p>Nenhuma comunidade criada ainda. Que tal criar a primeira?</p></div>`;
    return;
  }
  el.innerHTML = snap.docs.map(d => commCardHTML(d.id, d.data())).join('');
}

async function createCommunity() {
  const name = document.getElementById('comm-name').value.trim();
  const desc = document.getElementById('comm-desc').value.trim();
  const cat  = document.getElementById('comm-category').value;
  if (!name) return showToast('O nome é obrigatório.');

  const ref = await db.collection('communities').add({
    name, name_lower: name.toLowerCase(), description: desc, category: cat,
    createdBy: currentUser.uid,
    membersCount: 1,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  await db.collection('community_members').add({
    communityId: ref.id,
    uid: currentUser.uid,
    role: 'admin',
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  closeCreateModal();
  showToast('Comunidade criada!');
  location.href = `comunidade.html?id=${ref.id}`;
}

function openCreateModal() { document.getElementById('create-modal').classList.add('open'); }
function closeCreateModal() { document.getElementById('create-modal').classList.remove('open'); }
document.getElementById('create-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeCreateModal();
});

// ── Editar comunidade ────────────────────────────────────────────
let _editingCommId = null;

function openEditComm(id, name, desc, category) {
  _editingCommId = id;
  document.getElementById('edit-comm-name').value = name;
  document.getElementById('edit-comm-desc').value = desc;
  document.getElementById('edit-comm-category').value = category;
  document.getElementById('edit-comm-modal').classList.add('open');
}

function closeEditCommModal() {
  document.getElementById('edit-comm-modal').classList.remove('open');
  _editingCommId = null;
}

async function saveEditCommunity() {
  if (!_editingCommId) return;
  const name = document.getElementById('edit-comm-name').value.trim();
  const desc = document.getElementById('edit-comm-desc').value.trim();
  const cat  = document.getElementById('edit-comm-category').value;
  if (!name) return showToast('O nome é obrigatório.');
  try {
    await db.collection('communities').doc(_editingCommId).update({ name, name_lower: name.toLowerCase(), description: desc, category: cat });
    closeEditCommModal();
    showToast('Comunidade atualizada!');
    loadMyCommunities();
  } catch(e) { showToast('Erro ao atualizar comunidade.'); }
}

async function deleteCommunity(id, name) {
  if (!confirm(`Excluir a comunidade "${name}"? Todos os membros serão removidos.`)) return;
  try {
    const membersSnap = await db.collection('community_members').where('communityId','==',id).get();
    const batch = db.batch();
    membersSnap.docs.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('communities').doc(id));
    await batch.commit();
    showToast('Comunidade excluída.');
    loadMyCommunities();
    loadAllCommunities();
  } catch(e) { showToast('Erro ao excluir comunidade.'); }
}
</script>
</body>
</html>
