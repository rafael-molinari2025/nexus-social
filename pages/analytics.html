<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CYDS5B5TN5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CYDS5B5TN5');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Nexus</title>
  <meta name="robots" content="noindex, nofollow">
  <script>!function(){var t=localStorage.getItem("nexus-theme");if(t&&"auto"!==t)document.documentElement.setAttribute("data-theme",t);else window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.setAttribute("data-theme","dark")}();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="../css/tabler-icons.min.css">
  <style>
    .analytics-page { max-width: 860px; margin: 0 auto; padding: 1.5rem .75rem; }
    @media (max-width: 768px) { .analytics-page { padding: 1rem .5rem calc(80px + 1rem); } }

    .analytics-header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
    .analytics-title  { font-size: 20px; font-weight: 700; }

    /* Periodo selector */
    .period-selector { display: flex; gap: .4rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .period-btn {
      padding: .35rem .9rem; border: 0.5px solid var(--border);
      border-radius: var(--radius-full); background: none;
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); font-family: var(--font-sans);
    }
    .period-btn.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }

    /* KPI cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
    .kpi-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem; text-align: center;
    }
    .kpi-icon { font-size: 22px; color: var(--purple-400); margin-bottom: .3rem; }
    .kpi-num  { font-size: 28px; font-weight: 700; color: var(--text-primary); line-height: 1; }
    .kpi-label { font-size: 12px; color: var(--text-muted); margin-top: .25rem; }
    .kpi-delta { font-size: 11px; margin-top: .2rem; }
    .kpi-delta.up   { color: #10B981; }
    .kpi-delta.down { color: #EF4444; }

    /* Top posts table */
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted); margin-bottom: .75rem; display: flex; align-items: center; gap: .35rem; }
    .section-title i { font-size: 14px; color: var(--purple-600); }

    .post-row {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: .75rem 1rem;
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: .5rem; transition: box-shadow var(--transition);
      cursor: pointer; text-decoration: none; color: inherit;
    }
    .post-row:hover { box-shadow: var(--shadow-sm); }
    .post-rank { font-size: 18px; font-weight: 800; color: var(--purple-600); width: 28px; flex-shrink: 0; text-align: center; }
    .post-rank.gold   { color: #F59E0B; }
    .post-rank.silver { color: #9CA3AF; }
    .post-rank.bronze { color: #B45309; }
    .post-thumb { width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; }
    .post-thumb-placeholder { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--gray-100);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 20px; flex-shrink: 0; }
    .post-text-preview { flex: 1; min-width: 0; font-size: 13px; color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .post-stats { display: flex; gap: .75rem; flex-shrink: 0; }
    .post-stat  { display: flex; align-items: center; gap: .2rem; font-size: 12px; color: var(--text-muted); }
    .post-stat i { font-size: 14px; }

    /* Hashtag chart */
    .hashtag-bars { display: flex; flex-direction: column; gap: .45rem; }
    .hbar-row { display: flex; align-items: center; gap: .65rem; }
    .hbar-label { font-size: 13px; font-weight: 500; color: var(--purple-600); width: 120px; flex-shrink: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar-track { flex: 1; height: 8px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
    .hbar-fill  { height: 100%; background: linear-gradient(90deg, var(--purple-600), var(--indigo-400)); border-radius: 4px; transition: width .6s; }
    .hbar-count { font-size: 12px; color: var(--text-muted); width: 30px; text-align: right; }

    /* Two columns */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
    @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .analytics-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.1rem; }
  </style>
</head>
<body>
<div id="topbar" class="topbar"></div>
<div style="padding-top: var(--topbar-h)">
  <div class="analytics-page">

    <div class="analytics-header">
      <button onclick="history.back()" class="btn btn-ghost btn-sm"><i class="ti ti-arrow-left"></i></button>
      <div class="analytics-title">
        <i class="ti ti-chart-bar" style="color:var(--purple-600)"></i> Analytics do Criador
      </div>
      <div id="loading-indicator" style="margin-left:auto;font-size:12px;color:var(--text-muted)">Carregando...</div>
    </div>

    <!-- Período -->
    <div class="period-selector">
      <button class="period-btn" onclick="setPeriod(7)">7 dias</button>
      <button class="period-btn active" id="period-30" onclick="setPeriod(30)">30 dias</button>
      <button class="period-btn" onclick="setPeriod(90)">90 dias</button>
      <button class="period-btn" onclick="setPeriod(365)">1 ano</button>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon"><i class="ti ti-file-text"></i></div>
        <div class="kpi-num" id="kpi-posts">—</div>
        <div class="kpi-label">Posts publicados</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon"><i class="ti ti-heart"></i></div>
        <div class="kpi-num" id="kpi-likes">—</div>
        <div class="kpi-label">Curtidas recebidas</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon"><i class="ti ti-message-circle"></i></div>
        <div class="kpi-num" id="kpi-comments">—</div>
        <div class="kpi-label">Comentários</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon"><i class="ti ti-repeat"></i></div>
        <div class="kpi-num" id="kpi-reposts">—</div>
        <div class="kpi-label">Reposts</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon"><i class="ti ti-users"></i></div>
        <div class="kpi-num" id="kpi-friends">—</div>
        <div class="kpi-label">Amigos</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon"><i class="ti ti-bookmark"></i></div>
        <div class="kpi-num" id="kpi-bookmarks">—</div>
        <div class="kpi-label">Salvos</div>
      </div>
    </div>

    <!-- Top posts + Hashtags -->
    <div class="two-col">
      <div class="analytics-card">
        <div class="section-title"><i class="ti ti-trophy"></i> Top Posts do Período</div>
        <div id="top-posts-list"><div class="spinner" style="margin:1rem auto"></div></div>
      </div>
      <div class="analytics-card">
        <div class="section-title"><i class="ti ti-hash"></i> Suas Hashtags mais Usadas</div>
        <div id="hashtag-chart"><div class="spinner" style="margin:1rem auto"></div></div>
      </div>
    </div>

    <!-- Engajamento por tipo de post -->
    <div class="analytics-card" style="margin-bottom:1.25rem">
      <div class="section-title"><i class="ti ti-chart-pie"></i> Engajamento por Tipo de Conteúdo</div>
      <div id="content-breakdown" style="display:flex;gap:1.5rem;flex-wrap:wrap;padding-top:.25rem"></div>
    </div>

    <!-- Melhores horários -->
    <div class="analytics-card">
      <div class="section-title"><i class="ti ti-clock"></i> Seus Melhores Horários para Postar</div>
      <div id="best-hours" style="display:flex;gap:.5rem;flex-wrap:wrap;padding-top:.25rem"></div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
let currentUser = null;
let currentPeriod = 30;
let allPosts = [];

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { uid: user.uid, displayName: user.displayName };
  renderTopbar(userData, '');
  await loadAnalytics(30);
});

function setPeriod(days) {
  currentPeriod = days;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadAnalytics(days);
}

async function loadAnalytics(days) {
  const loader = document.getElementById('loading-indicator');
  loader.textContent = 'Carregando...';

  const since = new Date(Date.now() - days * 86400000);
  const sinceTs = firebase.firestore.Timestamp.fromDate(since);

  // ── Posts do usuário no período ──────────────────────────────
  try {
    const snap = await db.collection('posts')
      .where('authorId', '==', currentUser.uid)
      .where('createdAt', '>=', sinceTs)
      .orderBy('createdAt', 'desc')
      .limit(200)
      .get();
    allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) {
    console.error('analytics posts:', e);
    allPosts = [];
    loader.textContent = 'Erro ao carregar posts';
  }

  // ── Reposts dos posts do usuário (sem filtro de data para evitar índice composto) ──
  let repostCount = 0;
  try {
    const repostSnap = await db.collection('posts')
      .where('repostOf.authorId', '==', currentUser.uid)
      .get();
    // filtra por data em JS
    repostCount = repostSnap.docs.filter(d => {
      const ts = d.data().createdAt;
      const date = ts?.toDate ? ts.toDate() : (ts?.seconds ? new Date(ts.seconds * 1000) : null);
      return date && date >= since;
    }).length;
  } catch(e) {
    console.error('analytics reposts:', e);
  }

  // ── Amigos ───────────────────────────────────────────────────
  let friendsCount = 0;
  try {
    const friendsSnap = await db.collection('friendships')
      .where('users', 'array-contains', currentUser.uid).get();
    friendsCount = friendsSnap.size;
  } catch(e) {
    console.error('analytics friends:', e);
  }

  renderKPIs(allPosts, repostCount, friendsCount);
  renderTopPosts(allPosts);
  renderHashtagChart(allPosts);
  renderContentBreakdown(allPosts);
  renderBestHours(allPosts);

  loader.textContent = allPosts.length > 0
    ? `${allPosts.length} posts analisados`
    : 'Nenhum post no período';
}

function renderKPIs(posts, reposts, friends) {
  const totalLikes     = posts.reduce((s, p) => s + (p.likes?.length || 0), 0);
  const totalComments  = posts.reduce((s, p) => s + (p.commentsCount || 0), 0);
  const totalBookmarks = posts.reduce((s, p) => s + (p.bookmarks?.length || 0), 0);

  document.getElementById('kpi-posts').textContent    = fmt(posts.length);
  document.getElementById('kpi-likes').textContent    = fmt(totalLikes);
  document.getElementById('kpi-comments').textContent = fmt(totalComments);
  document.getElementById('kpi-reposts').textContent  = fmt(reposts);
  document.getElementById('kpi-friends').textContent  = fmt(friends);
  document.getElementById('kpi-bookmarks').textContent = fmt(totalBookmarks);
}

function renderTopPosts(posts) {
  const el = document.getElementById('top-posts-list');
  if (!posts.length) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">Nenhum post neste período.</p>'; return; }

  const sorted = [...posts].sort((a, b) => {
    const engA = (a.likes?.length || 0) + (a.commentsCount || 0) * 2;
    const engB = (b.likes?.length || 0) + (b.commentsCount || 0) * 2;
    return engB - engA;
  }).slice(0, 5);

  const rankClasses = ['gold', 'silver', 'bronze', '', ''];
  el.innerHTML = sorted.map((p, i) => {
    const img = p.imageURL
      ? `<img class="post-thumb" src="${p.imageURL}" alt="" loading="lazy">`
      : `<div class="post-thumb-placeholder"><i class="ti ti-file-text"></i></div>`;
    return `<a class="post-row" href="post.html?id=${p.id}">
      <div class="post-rank ${rankClasses[i]}">${i + 1}</div>
      ${img}
      <div class="post-text-preview">${sanitize(p.text || '[Sem texto]')}</div>
      <div class="post-stats">
        <div class="post-stat"><i class="ti ti-heart"></i>${p.likes?.length || 0}</div>
        <div class="post-stat"><i class="ti ti-message-circle"></i>${p.commentsCount || 0}</div>
      </div>
    </a>`;
  }).join('');
}

function renderHashtagChart(posts) {
  const el = document.getElementById('hashtag-chart');
  const counts = {};
  posts.forEach(p => (p.hashtags || []).forEach(h => { counts[h] = (counts[h] || 0) + 1; }));
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (!sorted.length) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">Nenhuma hashtag usada.</p>'; return; }
  const max = sorted[0][1];
  el.innerHTML = `<div class="hashtag-bars">` + sorted.map(([tag, cnt]) =>
    `<div class="hbar-row">
      <div class="hbar-label">#${sanitize(tag)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(cnt/max*100)}%"></div></div>
      <div class="hbar-count">${cnt}</div>
    </div>`
  ).join('') + '</div>';
}

function renderContentBreakdown(posts) {
  const el = document.getElementById('content-breakdown');
  const types = { Texto: 0, Imagem: 0, Vídeo: 0, Enquete: 0 };
  posts.forEach(p => {
    if (p.poll) types.Enquete++;
    else if (p.videoURL) types.Vídeo++;
    else if (p.imageURL || p.images?.length) types.Imagem++;
    else types.Texto++;
  });
  const total = posts.length || 1;
  const colors = { Texto: '#8B5CF6', Imagem: '#06B6D4', Vídeo: '#EF4444', Enquete: '#10B981' };
  el.innerHTML = Object.entries(types).filter(([,v]) => v > 0).map(([k, v]) =>
    `<div style="display:flex;align-items:center;gap:.5rem">
      <div style="width:12px;height:12px;border-radius:3px;background:${colors[k]};flex-shrink:0"></div>
      <div style="font-size:13px"><strong>${k}</strong>: ${v} (${Math.round(v/total*100)}%)</div>
    </div>`
  ).join('') || '<p style="font-size:13px;color:var(--text-muted)">Sem dados.</p>';
}

function renderBestHours(posts) {
  const el = document.getElementById('best-hours');
  const hourEng = {};
  posts.forEach(p => {
    const ts = p.createdAt?.toDate?.() || new Date(p.createdAt?.seconds * 1000 || Date.now());
    const h  = ts.getHours();
    const eng = (p.likes?.length || 0) + (p.commentsCount || 0);
    if (!hourEng[h]) hourEng[h] = { total: 0, count: 0 };
    hourEng[h].total += eng;
    hourEng[h].count++;
  });
  const ranked = Object.entries(hourEng)
    .map(([h, v]) => ({ hour: Number(h), avg: v.count ? v.total / v.count : 0 }))
    .sort((a, b) => b.avg - a.avg)
    .slice(0, 6);
  if (!ranked.length) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">Poste mais para ver os melhores horários.</p>'; return; }
  const maxAvg = ranked[0].avg || 1;
  el.innerHTML = ranked.map((r, i) => {
    const intensity = Math.round(70 + (1 - r.avg/maxAvg) * (-40));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:.25rem;background:var(--gray-50);border-radius:var(--radius-md);padding:.5rem .75rem;min-width:56px">
      <div style="font-size:18px;font-weight:700;color:hsl(262,${intensity}%,${50+i*3}%)">${String(r.hour).padStart(2,'0')}h</div>
      <div style="font-size:10px;color:var(--text-muted)">${r.avg.toFixed(1)} eng.</div>
    </div>`;
  }).join('');
}

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000)    return (n/1000).toFixed(1) + 'K';
  return n;
}
</script>
</body>
</html>
