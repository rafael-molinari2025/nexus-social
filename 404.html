<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Social Nexus</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
  <style>
    .error-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); flex-direction: column; gap: 1.5rem; padding: 2rem;
      text-align: center;
    }
    .error-logo { font-family: var(--font-display); font-size: 28px; color: var(--purple-600); }
    .error-code { font-size: 80px; font-weight: 700; color: var(--gray-200); line-height: 1; }
    .error-title { font-size: 22px; font-weight: 600; color: var(--text-primary); }
    .error-sub { font-size: 14px; color: var(--text-muted); max-width: 320px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-logo">nexus</div>
  <div class="error-code">404</div>
  <div class="error-title">Página não encontrada</div>
  <p class="error-sub">A página que você está procurando não existe ou foi movida para outro endereço.</p>
  <div style="display:flex;gap:.65rem;flex-wrap:wrap;justify-content:center">
    <a href="/index.html" class="btn btn-primary">
      <i class="ti ti-home" aria-hidden="true"></i> Ir para o feed
    </a>
    <button class="btn" onclick="history.back()">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Voltar
    </button>
  </div>
</div>
</body>
</html>
