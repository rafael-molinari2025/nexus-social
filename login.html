<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Entrar</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div>
      <div class="auth-logo">nexus</div>
      <p class="auth-subtitle">Conecte-se com quem você gosta</p>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- Abas -->
    <div style="display:flex;background:var(--gray-100);border-radius:var(--radius-md);padding:3px;gap:3px">
      <button class="tab-toggle active" id="tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab-toggle" id="tab-signup" onclick="switchTab('signup')">Cadastrar</button>
    </div>

    <!-- Login -->
    <div id="form-login">
      <div style="display:flex;flex-direction:column;gap:.85rem">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-input" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="loginEmail()">
          <i class="ti ti-login"></i> Entrar
        </button>
      </div>
    </div>

    <!-- Cadastro -->
    <div id="form-signup" style="display:none">
      <div style="display:flex;flex-direction:column;gap:.85rem">
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input class="form-input" type="text" id="signup-name" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-input" type="email" id="signup-email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" type="password" id="signup-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px;border-radius:var(--radius-md)" onclick="signupEmail()">
          <i class="ti ti-user-plus"></i> Criar conta
        </button>
      </div>
    </div>

    <div class="divider">ou</div>

    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com Google
    </button>
  </div>
</div>

<style>
.tab-toggle {
  flex:1; height:34px; border:none; background:none;
  border-radius:calc(var(--radius-md) - 1px);
  font-size:13px; font-weight:500; cursor:pointer;
  color:var(--text-secondary); font-family:var(--font-sans);
  transition: all var(--transition);
}
.tab-toggle.active {
  background:var(--surface); color:var(--purple-600);
  box-shadow:var(--shadow-sm);
}
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script>
  redirectIfLoggedIn();

  function switchTab(tab) {
    document.getElementById('form-login').style.display  = tab==='login'  ? '' : 'none';
    document.getElementById('form-signup').style.display = tab==='signup' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab==='login');
    document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
    clearError();
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg; el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('auth-error').style.display = 'none';
  }

  async function handleAuthSuccess(user) {
    await updateUserData(user.uid, {
      displayName: user.displayName || '',
      photoURL: user.photoURL || '',
      email: user.email,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    window.location.href = '/index.html';
  }

  async function loginEmail() {
    clearError();
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    if (!email || !pass) return showError('Preencha e-mail e senha.');
    try {
      const { user } = await auth.signInWithEmailAndPassword(email, pass);
      await handleAuthSuccess(user);
    } catch(e) {
      showError(e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
        ? 'E-mail ou senha incorretos.'
        : 'Erro ao entrar. Tente novamente.');
    }
  }

  async function signupEmail() {
    clearError();
    const name  = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass  = document.getElementById('signup-password').value;
    if (!name || !email || !pass) return showError('Preencha todos os campos.');
    if (pass.length < 6) return showError('Senha deve ter pelo menos 6 caracteres.');
    try {
      const { user } = await auth.createUserWithEmailAndPassword(email, pass);
      await user.updateProfile({ displayName: name });
      await handleAuthSuccess(user);
    } catch(e) {
      showError(e.code === 'auth/email-already-in-use'
        ? 'Este e-mail já está cadastrado.'
        : 'Erro ao criar conta. Tente novamente.');
    }
  }

  async function loginGoogle() {
    clearError();
    try {
      const { user } = await auth.signInWithPopup(googleProvider);
      await handleAuthSuccess(user);
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') showError('Erro ao entrar com Google.');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const active = document.getElementById('form-login').style.display !== 'none' ? 'login' : 'signup';
      active === 'login' ? loginEmail() : signupEmail();
    }
  });
</script>
</body>
</html>
