<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Feed</title>
  <meta name="description" content="Veja o feed de posts e fique conectado com seus amigos no Nexus.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/tabler-icons.min.css">
  <style>
    /* ── Stories ──────────────────────────────────────────────────── */
    .stories-bar {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: .875rem 1rem;
      margin-bottom: .75rem; display: flex; gap: .75rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-thumb {
      display: flex; flex-direction: column; align-items: center;
      gap: .3rem; cursor: pointer; flex-shrink: 0; width: 62px;
    }
    .story-ring {
      width: 54px; height: 54px; border-radius: 50%; padding: 2.5px;
      background: linear-gradient(135deg, #a855f7, #ec4899, #f97316);
      flex-shrink: 0;
    }
    .story-ring.unseen { background: linear-gradient(135deg, #a855f7, #ec4899, #f97316); }
    .story-ring.seen   { background: var(--gray-300); }
    .story-ring.add    { background: none; border: 2px dashed var(--gray-300); padding: 1.5px; }
    .story-ring-inner {
      width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid var(--surface); overflow: hidden;
      background: var(--gray-100); position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .story-ring-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .story-add-icon {
      position: absolute; bottom: -1px; right: -1px;
      width: 18px; height: 18px; background: var(--purple-600); color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; border: 2px solid var(--surface);
    }
    .story-name {
      font-size: 11px; color: var(--text-secondary); text-align: center;
      width: 62px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Story viewer ─────────────────────────────────────────────── */
    .story-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
    }
    .story-viewer {
      width: min(380px, 100vw); height: min(680px, 95vh);
      border-radius: 16px; overflow: hidden; position: relative;
      display: flex; flex-direction: column;
    }
    .story-prog-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; gap: 3px; padding: .6rem .75rem .4rem; z-index: 5;
    }
    .story-prog-seg {
      flex: 1; height: 3px; background: rgba(255,255,255,.3);
      border-radius: 2px; overflow: hidden;
    }
    .story-prog-fill { height: 100%; background: #fff; width: 0%; }
    .story-viewer-header {
      position: absolute; top: 1.5rem; left: 0; right: 0;
      display: flex; align-items: center; gap: .5rem; padding: 0 .75rem; z-index: 5;
    }
    .story-viewer-body {
      width: 100%; height: 100%; display: flex;
      align-items: center; justify-content: center;
    }
    .story-viewer-text {
      padding: 3rem 1.5rem; font-size: 22px; font-weight: 600;
      color: #fff; text-align: center; word-break: break-word; line-height: 1.4;
    }

    /* ── Story creator ────────────────────────────────────────────── */
    .story-creator-modal {
      background: var(--surface); border-radius: 16px;
      width: min(440px, 95vw); padding: 1.5rem;
    }
    .story-color-row { display: flex; gap: .4rem; flex-wrap: wrap; margin: .75rem 0 1rem; }
    .story-color-dot {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform .15s, border-color .15s;
    }
    .story-color-dot.sel { border-color: var(--purple-600); transform: scale(1.2); }
    .story-preview-box {
      border-radius: 12px; min-height: 130px; display: flex;
      align-items: center; justify-content: center; margin-bottom: .75rem;
      transition: background .2s;
    }
    .story-preview-box textarea {
      width: 100%; border: none; background: none; outline: none;
      font-size: 20px; font-weight: 600; color: #fff; text-align: center;
      resize: none; font-family: var(--font-sans); min-height: 90px;
    }
    .story-type-tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
    .story-type-tab {
      flex: 1; padding: .45rem; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); background: var(--surface);
      font-size: 13px; font-weight: 500; cursor: pointer; text-align: center;
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all var(--transition);
    }
    .story-type-tab.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }

    /* ── Feed tabs ────────────────────────────────────────────────── */
    .feed-tabs {
      display: flex; gap: .4rem; margin-bottom: .75rem;
    }
    .feed-tab {
      flex: 1; padding: .5rem; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); background: var(--surface);
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); font-family: var(--font-sans);
      transition: all var(--transition); text-align: center;
    }
    .feed-tab.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); }

    /* ── Privacy picker ───────────────────────────────────────────── */
    .composer-privacy-btn {
      display: inline-flex; align-items: center; gap: .3rem;
      background: var(--gray-100); border: none; border-radius: var(--radius-sm);
      padding: .3rem .6rem; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); cursor: pointer; font-family: var(--font-sans);
      transition: background var(--transition);
    }
    .composer-privacy-btn:hover { background: var(--gray-200); }
    .post-privacy-badge {
      font-size: 10px; color: var(--text-muted);
      display: inline-flex; align-items: center; gap: 2px; margin-left: .3rem;
    }

    /* ── Emoji reactions ──────────────────────────────────────────── */
    .reaction-wrap { position: relative; display: inline-block; }
    .reaction-picker {
      position: absolute; bottom: calc(100% + 6px); left: 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 999px; box-shadow: var(--shadow-lg);
      display: flex; gap: 1px; padding: 5px 8px;
      white-space: nowrap; z-index: 30;
      opacity: 0; pointer-events: none;
      transform: translateY(6px) scale(.88);
      transition: opacity .16s, transform .16s;
    }
    .reaction-wrap:hover .reaction-picker { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
    .reaction-emoji-btn {
      font-size: 21px; cursor: pointer; line-height: 1;
      padding: 2px 4px; border-radius: 6px;
      transition: transform .14s, background .14s;
      border: none; background: none;
    }
    .reaction-emoji-btn:hover { transform: scale(1.4); background: var(--gray-100); }
    .reaction-summary {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 12px; color: var(--text-muted); padding: .2rem .5rem .1rem;
    }
    .post-action-btn.reacted { color: var(--purple-600); font-weight: 600; }

    /* ── Hashtag / Mention ────────────────────────────────────────── */
    .hashtag { color: var(--purple-600); text-decoration: none; font-weight: 500; }
    .hashtag:hover { text-decoration: underline; }
    .mention { color: #0ea5e9; text-decoration: none; font-weight: 500; }
    .mention:hover { text-decoration: underline; }
    .mention-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
      max-height: 200px; overflow-y: auto; margin-top: 2px;
    }
    .mention-item {
      display: flex; align-items: center; gap: .6rem;
      padding: .45rem .85rem; cursor: pointer; font-size: 13px;
      transition: background var(--transition);
    }
    .mention-item:hover { background: var(--gray-50, #fafafa); }

    /* ── Online dot ───────────────────────────────────────────────── */
    .online-dot {
      position: absolute; bottom: 0; right: 0;
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--surface);
    }

    /* ── Report ───────────────────────────────────────────────────── */
    .report-opt {
      width: 100%; text-align: left; padding: .6rem .85rem;
      border: 0.5px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); font-size: 13px; color: var(--text-secondary);
      cursor: pointer; font-family: var(--font-sans);
      transition: background var(--transition), color var(--transition);
    }
    .report-opt:hover { background: var(--gray-50, #fafafa); color: var(--text-primary); }

    /* ── Char counter ─────────────────────────────────────────────── */
    .composer-char-count {
      display: none; text-align: right; font-size: 11px;
      color: var(--text-muted); margin-top: .2rem; transition: color var(--transition);
    }
    .composer-char-count.warn { color: #d97706; display: block; }
    .composer-char-count.danger { color: #dc2626; display: block; }

    /* ── Carousel ───────────────────────────────────────────────── */
    .post-carousel { position:relative; border-radius:var(--radius-md); overflow:hidden; margin-bottom:.5rem; }
    .carousel-track { display:flex; transition:transform .3s ease; }
    .carousel-img { min-width:100%; max-height:420px; object-fit:cover; cursor:zoom-in; flex-shrink:0; }
    .carousel-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.42); color:#fff; border:none; padding:.25rem .55rem; border-radius:4px; cursor:pointer; font-size:20px; line-height:1.2; z-index:2; }
    .carousel-btn.prev { left:.4rem; }
    .carousel-btn.next { right:.4rem; }
    .carousel-dots { position:absolute; bottom:.45rem; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:2; pointer-events:none; }
    .carousel-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45); }
    .carousel-dot.active { background:#fff; }

    /* ── Poll ───────────────────────────────────────────────────── */
    .poll-form { display:flex; flex-direction:column; gap:.35rem; margin:.45rem 0; padding:.65rem; background:var(--gray-50); border-radius:var(--radius-md); border:0.5px solid var(--border); }
    .poll-bar { display:flex; align-items:center; width:100%; position:relative; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:.4rem .75rem; text-align:left; cursor:pointer; overflow:hidden; font-family:var(--font-sans); margin-bottom:.25rem; }
    .poll-bar.my-vote { border-color:var(--purple-600); }
    .poll-bar-fill { position:absolute; inset:0; background:var(--purple-50); pointer-events:none; transition:width .3s; }
    .poll-bar-text { position:relative; font-size:13px; flex:1; }
    .poll-bar-pct { position:relative; font-size:12px; color:var(--text-muted); }

    /* ── Repost ─────────────────────────────────────────────────── */
    .repost-block { border:0.5px solid var(--border); border-radius:var(--radius-md); padding:.65rem .85rem; margin:.3rem 0 .5rem; background:var(--gray-50); }
    .repost-label { font-size:11px; color:var(--text-muted); margin-bottom:.3rem; display:flex; align-items:center; gap:.3rem; }

    /* ── Link preview ───────────────────────────────────────────── */
    .link-preview-card { border:0.5px solid var(--border); border-radius:var(--radius-md); overflow:hidden; margin:.5rem 0 .25rem; background:var(--surface); display:flex; gap:0; text-decoration:none; color:inherit; transition:box-shadow var(--transition); }
    .link-preview-card:hover { box-shadow:var(--shadow-sm); }
    .link-preview-img { width:88px; min-height:72px; object-fit:cover; flex-shrink:0; background:var(--gray-100); }
    .link-preview-body { padding:.55rem .75rem; overflow:hidden; min-width:0; flex:1; }
    .link-preview-domain { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:.2rem; }
    .link-preview-title { font-size:13px; font-weight:600; color:var(--text-primary); line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .link-preview-desc { font-size:11.5px; color:var(--text-secondary); margin-top:.2rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.4; }
    .link-preview-loading { display:flex; align-items:center; gap:.5rem; padding:.5rem .65rem; font-size:12px; color:var(--text-muted); background:var(--gray-50); border:0.5px solid var(--border); border-radius:var(--radius-md); margin:.4rem 0 .2rem; }
    .link-preview-composer { position:relative; }
    .link-preview-dismiss { position:absolute; top:.3rem; right:.3rem; background:rgba(0,0,0,.45); color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }

    @keyframes livepulse2 {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.85); }
    }
    #lives-strip::-webkit-scrollbar { display: none; }

    @media (max-width: 768px) {
      .stories-bar { padding: .65rem .75rem; }
    }
  </style>
</head>
<body>

<div id="auth-loading" style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:1rem">
  <span class="loading-logo">nexus</span>
  <div class="spinner"></div>
</div>

<div id="topbar" class="topbar"></div>

<div class="app-layout">
  <!-- Sidebar esquerda -->
  <aside class="sidebar-left">
    <div class="card" id="profile-card-widget"></div>
    <div class="card">
      <div class="card-body">
        <div class="card-title">amigos online</div>
        <div class="friends-grid" id="online-friends"></div>
      </div>
    </div>
  </aside>

  <!-- Feed central -->
  <main class="feed-col">

    <!-- Lives strip -->
    <div id="lives-strip-wrap" style="display:none;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.75rem;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem .4rem">
        <span style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:.4rem">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#e53e3e;animation:livepulse2 1.2s infinite"></span>
          Ao vivo agora
        </span>
        <button class="btn btn-sm" onclick="location.href=PAGES+'live.html'" style="gap:.3rem;font-size:11px">
          <i class="ti ti-broadcast" aria-hidden="true"></i> Ir ao vivo
        </button>
      </div>
      <div id="lives-strip" style="display:flex;gap:.5rem;padding:.25rem 1rem .875rem;overflow-x:auto;scrollbar-width:none"></div>
    </div>

    <!-- Stories -->
    <div class="stories-bar" id="stories-bar">
      <div class="story-thumb" style="opacity:.4">
        <div class="story-ring add"><div class="story-ring-inner"><i class="ti ti-sparkles" style="font-size:20px;color:var(--text-muted)"></i></div></div>
        <div class="story-name">Stories</div>
      </div>
    </div>

    <!-- Feed tabs -->
    <div class="feed-tabs">
      <button class="feed-tab active" id="tab-all" onclick="switchFeedTab('all')">
        <i class="ti ti-layout-grid" style="font-size:14px;vertical-align:-2px" aria-hidden="true"></i> Para você
      </button>
      <button class="feed-tab" id="tab-friends" onclick="switchFeedTab('friends')">
        <i class="ti ti-users" style="font-size:14px;vertical-align:-2px" aria-hidden="true"></i> Amigos
      </button>
    </div>

    <!-- Composer -->
    <div class="card" id="composer-card">
      <div class="composer">
        <div id="composer-avatar"></div>
        <div class="composer-box">
          <div style="position:relative">
            <textarea class="composer-textarea" id="post-text"
              placeholder="O que você está pensando? Use #hashtags e @menções"
              oninput="updateCharCount();checkMentionInput(this);detectLinkInText(this.value)" maxlength="2000"></textarea>
            <div id="mention-dropdown" class="mention-dropdown" style="display:none"></div>
          </div>
          <div class="composer-char-count" id="post-char-count"></div>
          <div id="image-preview-wrap" style="display:none"></div>
          <div id="link-preview-wrap" style="display:none"></div>
          <div id="poll-form" class="poll-form" style="display:none">
            <div style="font-size:12px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:.35rem">
              <i class="ti ti-chart-bar" aria-hidden="true"></i> Opções da enquete <span style="font-weight:400;color:var(--text-muted)">(mín. 2)</span>
            </div>
            <input class="form-input" id="poll-opt-1" placeholder="Opção 1" style="font-size:13px">
            <input class="form-input" id="poll-opt-2" placeholder="Opção 2" style="font-size:13px">
            <input class="form-input" id="poll-opt-3" placeholder="Opção 3 (opcional)" style="font-size:13px">
            <input class="form-input" id="poll-opt-4" placeholder="Opção 4 (opcional)" style="font-size:13px">
          </div>
          <div class="composer-footer">
            <div class="composer-actions">
              <button class="composer-action-btn" title="Transmissão ao vivo"
                      onclick="location.href=PAGES+'live.html'"
                      style="color:#e53e3e">
                <i class="ti ti-broadcast" aria-hidden="true"></i>
              </button>
              <button class="composer-action-btn" title="Foto"
                      onclick="document.getElementById('post-image-input').click()">
                <i class="ti ti-photo" aria-hidden="true"></i>
              </button>
              <button class="composer-action-btn" title="Enquete" id="poll-btn" onclick="togglePoll()">
                <i class="ti ti-chart-bar" aria-hidden="true"></i>
              </button>
              <button class="composer-action-btn" title="Emoji" onclick="insertEmoji()">
                <i class="ti ti-mood-smile" aria-hidden="true"></i>
              </button>
              <button class="composer-action-btn" title="Negrito (**texto**)" onclick="insertBold()">
                <i class="ti ti-bold" aria-hidden="true"></i>
              </button>
              <button class="composer-action-btn" title="Itálico (_texto_)" onclick="insertItalic()">
                <i class="ti ti-italic" aria-hidden="true"></i>
              </button>
              <button class="composer-privacy-btn" id="privacy-btn" onclick="cyclePrivacy()" title="Privacidade">
                <i class="ti ti-world" id="privacy-icon" aria-hidden="true"></i>
                <span id="privacy-label">Público</span>
              </button>
            </div>
            <button class="btn btn-primary btn-sm" id="post-btn" onclick="createPost()">
              <i class="ti ti-send" aria-hidden="true"></i> Publicar
            </button>
          </div>
        </div>
      </div>
    </div>
    <input type="file" id="post-image-input" accept="image/*,video/*" multiple style="display:none"
           onchange="previewPostImage(this)">

    <!-- Posts -->
    <div id="posts-list">
      <div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>
    </div>
  </main>

  <!-- Sidebar direita -->
  <aside class="sidebar-right">
    <div class="card">
      <div class="card-body">
        <div class="card-title">sugestões de amigos</div>
        <div id="friend-suggestions"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="card-title">comunidades em alta</div>
        <div id="trending-communities"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="card-title">hashtags em alta</div>
        <div id="trending-hashtags"></div>
      </div>
    </div>
    <div class="card" id="birthdays-widget" style="display:none">
      <div class="card-body">
        <div class="card-title"><i class="ti ti-cake" aria-hidden="true" style="color:var(--purple-600)"></i> aniversariantes</div>
        <div id="birthdays-list"></div>
      </div>
    </div>
    <div class="card" id="memories-widget" style="display:none">
      <div class="card-body">
        <div class="card-title"><i class="ti ti-clock-heart" aria-hidden="true" style="color:var(--purple-600)"></i> memórias</div>
        <div id="memories-list"></div>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<!-- ── Editar post ────────────────────────────────────────────────── -->
<div class="modal-overlay" id="edit-post-modal"
     onclick="if(event.target===this)closeEditModal()">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title">Editar post</span>
      <button class="btn btn-icon" onclick="closeEditModal()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <textarea class="composer-textarea" id="edit-post-ta"
              style="min-height:120px;margin-bottom:1rem"
              placeholder="O que você está pensando?"></textarea>
    <button class="btn btn-primary" style="width:100%;justify-content:center;height:42px"
            onclick="saveEditPost()">
      <i class="ti ti-device-floppy" aria-hidden="true"></i> Salvar alterações
    </button>
  </div>
</div>

<!-- ── Criar story ────────────────────────────────────────────────── -->
<div class="modal-overlay" id="story-create-modal"
     onclick="if(event.target===this)closeStoryModal()">
  <div class="modal story-creator-modal">
    <div class="modal-header">
      <span class="modal-title">Criar story</span>
      <button class="btn btn-icon" onclick="closeStoryModal()"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>

    <div class="story-type-tabs">
      <button class="story-type-tab active" id="sttab-text" onclick="setStoryType('text')">
        <i class="ti ti-text-size" style="font-size:14px" aria-hidden="true"></i> Texto
      </button>
      <button class="story-type-tab" id="sttab-image" onclick="setStoryType('image')">
        <i class="ti ti-photo" style="font-size:14px" aria-hidden="true"></i> Foto
      </button>
    </div>

    <!-- Text story -->
    <div id="st-text-section">
      <div class="story-color-row" id="story-color-row"></div>
      <div class="story-preview-box" id="story-preview-box" style="background:#6366f1">
        <textarea id="story-text-input" placeholder="Escreva algo..." rows="3"></textarea>
      </div>
    </div>

    <!-- Image story -->
    <div id="st-image-section" style="display:none">

<script>
let currentUser    = null;
let _postImageFiles = [];
let _pollActive    = false;
let _trendingTags  = [];
const _carouselState = {};
let _feedTab       = 'all';
let _friendIds     = new Set();
let _friendsList   = [];
let _storyTimer    = null;
let _mentionStart  = -1;
let _mentionQuery  = '';
let _mentionType   = '';
let _hashtagFilter = new URLSearchParams(location.search).get('hashtag') || '';
let _privacyIdx   = 0;
let _editingPostId = null;
let _reportPostId = null;
let _storyType    = 'text';
let _storyColor   = '#6366f1';
let _linkPreview  = null;
let _lpTimer      = null;
const _lpCache    = new Map();
let _storyImgFile = null;
let _postsUnsub   = null;
let _lastPostDoc  = null;
let _extraPostsHTML = '';
let _mutedUsers   = JSON.parse(localStorage.getItem('nexus-muted') || '[]');

const PRIVACY = [
  { v:'public',  icon:'ti-world',  label:'Público' },
  { v:'friends', icon:'ti-users',  label:'Amigos' },
  { v:'private', icon:'ti-lock',   label:'Só eu' },
];
const REACTIONS  = ['❤️','😂','😮','😢','😡','👏'];
const ST_COLORS  = ['#6366f1','#ec4899','#f97316','#22c55e','#3b82f6','#8b5cf6','#0ea5e9','#ef4444','#b45309'];

// ── Char counter ───────────────────────────────────────────────
function updateCharCount() {
  const ta  = document.getElementById('post-text');
  const el  = document.getElementById('post-char-count');
  if (!ta || !el) return;
  const len = ta.value.length;
  el.textContent = `${len}/2000`;
  el.className = 'composer-char-count' + (len > 1900 ? ' danger' : len > 1500 ? ' warn' : '');
}

requireAuth(async user => {
  currentUser = user;
  const userData = await getUserData(user.uid) || { displayName: user.displayName, uid: user.uid };

  renderTopbar(userData, 'feed');
  renderProfileWidget(userData);
  renderComposerAvatar(userData);
  initStoryColors();
  loadStories();
  renderHashtagBanner();
  loadPosts();
  loadOnlineFriends();
  loadFriendSuggestions();
  loadTrendingCommunities();

  updateOnlineStatus(user.uid);

  db.collection('friendships').where('users', 'array-contains', user.uid).get()
    .then(async s => {
      const uids = [];
      s.docs.forEach(d => d.data().users.forEach(u => { _friendIds.add(u); if (u !== user.uid) uids.push(u); }));
      const friends = await Promise.all(uids.slice(0, 50).map(uid => getUserData(uid)));
      _friendsList = friends.filter(Boolean);
    })
    .catch(() => {});

  loadActiveLives();
  loadTrendingHashtags();
  loadBirthdayWidget();
  loadMemoriesWidget();

  document.getElementById('auth-loading')?.remove();
});

// ── Feed tabs ──────────────────────────────────────────────────
function switchFeedTab(tab) {
  _feedTab = tab;
  _hashtagFilter = '';
  history.replaceState(null, '', location.pathname);
  document.getElementById('tab-all').classList.toggle('active', tab === 'all');
  document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
  renderHashtagBanner();
  loadPosts();
}

function renderHashtagBanner() {
  const existing = document.getElementById('hashtag-banner');
  if (existing) existing.remove();
  if (!_hashtagFilter) return;
  const list = document.getElementById('posts-list');
  const banner = document.createElement('div');
  banner.id = 'hashtag-banner';
  banner.style.cssText = 'display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap';
  banner.innerHTML = `<span style="font-size:13px;color:var(--text-secondary)">Filtrando por</span>
    <span style="background:var(--purple-50);color:var(--purple-600);font-weight:600;border-radius:var(--radius-full);padding:.2rem .7rem;font-size:13px">#${sanitize(_hashtagFilter)}</span>
    <button onclick="_hashtagFilter='';history.replaceState(null,'',location.pathname);renderHashtagBanner();loadPosts()"
      style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;padding:.1rem .4rem;border-radius:var(--radius-sm)">
      ✕ Limpar filtro
    </button>`;
  list.parentNode.insertBefore(banner, list);
}

function clearHashtagFilter() {
  _hashtagFilter = '';
  history.replaceState(null, '', location.pathname);
  renderHashtagBanner();
  loadPosts();
}

// ── Profile widget ─────────────────────────────────────────────
function renderProfileWidget(user) {
  const cl = getAvatarColor(user.uid);
  const av = user.photoURL
    ? `<img src="${user.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : `<span style="color:${cl.color}">${getInitials(user.displayName)}</span>`;
  const cover = user.coverURL
    ? `background-image:url('${user.coverURL}');background-size:cover;background-position:center top`
    : '';
  document.getElementById('profile-card-widget').innerHTML = `
    <div class="profile-banner" style="${cover}"></div>
    <div class="profile-card-body">
      <div class="profile-avatar-wrap">
        <div class="avatar avatar-48" style="background:${cl.bg}">${av}</div>
      </div>
      <div class="profile-name">${sanitize(user.displayName || 'Usuário')}</div>
      <div class="profile-handle">${sanitize(user.bio || user.email || '')}</div>
      <div class="profile-stats" id="profile-stats">
        <div class="profile-stat"><span class="profile-stat-num">—</span><span class="profile-stat-label">amigos</span></div>
        <div class="profile-stat"><span class="profile-stat-num">—</span><span class="profile-stat-label">grupos</span></div>
        <div class="profile-stat"><span class="profile-stat-num">—</span><span class="profile-stat-label">posts</span></div>
      </div>
      <a href="pages/perfil.html?uid=${user.uid}" class="btn btn-sm"
         style="margin-top:.5rem;align-self:stretch;justify-content:center">
        <i class="ti ti-user" aria-hidden="true"></i> Meu perfil
      </a>
    </div>`;
  loadProfileStats(user.uid);
}

async function loadProfileStats(uid) {
  try {
    const [f, c, p] = await Promise.all([
      db.collection('friendships').where('users', 'array-contains', uid).get(),
      db.collection('community_members').where('uid', '==', uid).get(),
      db.collection('posts').where('authorId', '==', uid).get()
    ]);
    const el = document.getElementById('profile-stats');
    if (el) el.innerHTML = `
      <div class="profile-stat"><span class="profile-stat-num">${f.size}</span><span class="profile-stat-label">amigos</span></div>
      <div class="profile-stat"><span class="profile-stat-num">${c.size}</span><span class="profile-stat-label">grupos</span></div>
      <div class="profile-stat"><span class="profile-stat-num">${p.size}</span><span class="profile-stat-label">posts</span></div>`;
  } catch(e) {}
}

// ── Composer ───────────────────────────────────────────────────
function renderComposerAvatar(user) {
  const cl = getAvatarColor(user.uid);
  const el = document.getElementById('composer-avatar');
  if (!el) return;
  el.className = 'avatar avatar-40';
  el.style.cssText = `background:${cl.bg};color:${cl.color};flex-shrink:0`;
  el.innerHTML = user.photoURL
    ? `<img src="${user.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : getInitials(user.displayName);
}

function cyclePrivacy() {
  _privacyIdx = (_privacyIdx + 1) % PRIVACY.length;
  const p = PRIVACY[_privacyIdx];
  document.getElementById('privacy-icon').className = `ti ${p.icon}`;
  document.getElementById('privacy-label').textContent = p.label;
}

function insertFormat(before, after) {
  const ta = document.getElementById('post-text');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end) || 'texto';
  ta.value = ta.value.slice(0, start) + before + sel + after + ta.value.slice(end);
  ta.setSelectionRange(start + before.length, start + before.length + sel.length);
  ta.focus();
  updateCharCount();
}
function insertBold() { insertFormat('**', '**'); }
function insertItalic() { insertFormat('_', '_'); }

function insertEmoji() {
  const emojis = ['😊','🔥','😂','❤️','👍','🎉','😍','🤔','👏','✨','🙌','💯'];
  const e = emojis[Math.floor(Math.random() * emojis.length)];
  const ta = document.getElementById('post-text');
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0, pos) + e + ta.value.slice(ta.selectionEnd);
  ta.focus();
  ta.setSelectionRange(pos + e.length, pos + e.length);
}

let _postVideoFile = null;

function previewPostImage(input) {
  const files = Array.from(input.files).slice(0, 4);
  if (!files.length) return;
  const wrap = document.getElementById('image-preview-wrap');

  // Video: single file only
  if (files[0].type.startsWith('video/')) {
    if (files[0].size > 60 * 1024 * 1024) return showToast('Vídeo deve ter no máximo 60MB.');
    _postVideoFile = files[0];
    _postImageFiles = [];
    const url = URL.createObjectURL(files[0]);
    wrap.style.display = 'block';
    wrap.innerHTML = `<div style="position:relative">
      <video src="${url}" controls style="width:100%;max-height:240px;border-radius:var(--radius-md);background:#000;display:block"></video>
      <button class="composer-image-remove" onclick="removePostImage()" title="Remover" style="position:absolute;top:4px;right:4px;z-index:1"><i class="ti ti-x"></i></button>
    </div>`;
    return;
  }

  if (files.some(f => !f.type.startsWith('image/'))) return showToast('Selecione apenas imagens ou um vídeo.');
  if (files.some(f => f.size > 8 * 1024 * 1024)) return showToast('Cada imagem deve ter no máximo 8MB.');
  _postVideoFile = null;
  _postImageFiles = files;
  const readAll = files.map(f => new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(f);
  }));
  Promise.all(readAll).then(srcs => {
    wrap.style.display = 'block';
    wrap.innerHTML = `<div style="display:flex;gap:.3rem;flex-wrap:wrap;position:relative">
      ${srcs.map((src, i) => `<div style="position:relative;flex:1;min-width:80px;max-width:200px">
        <img src="${src}" style="width:100%;height:90px;object-fit:cover;border-radius:var(--radius-sm)">
        ${i === 0 ? `<button class="composer-image-remove" onclick="removePostImage()" title="Remover" style="position:absolute;top:2px;right:2px"><i class="ti ti-x"></i></button>` : ''}
      </div>`).join('')}
    </div>`;
  });
}

function removePostImage() {
  _postImageFiles = [];
  _postVideoFile  = null;
  const w = document.getElementById('image-preview-wrap');
  w.style.display = 'none'; w.innerHTML = '';
  document.getElementById('post-image-input').value = '';
}

function togglePoll() {
  _pollActive = !_pollActive;
  const form = document.getElementById('poll-form');
  const btn  = document.getElementById('poll-btn');
  if (form) form.style.display = _pollActive ? 'flex' : 'none';
  if (btn)  btn.style.color = _pollActive ? 'var(--purple-600)' : '';
  if (_pollActive) removePostImage();
}

// ── Link preview ───────────────────────────────────────────────
const _URL_REGEX = /https?:\/\/[^\s"<>]{6,}/i;

function detectLinkInText(text) {
  const m = text.match(_URL_REGEX);
  if (!m) { hideLinkPreview(); return; }
  const url = m[0];
  if (_linkPreview && _linkPreview.url === url) return;
  clearTimeout(_lpTimer);
  _lpTimer = setTimeout(() => fetchLinkPreview(url), 600);
}

async function fetchLinkPreview(url) {
  const wrap = document.getElementById('link-preview-wrap');
  if (!wrap) return;
  if (_lpCache.has(url)) { renderLinkPreview(_lpCache.get(url)); return; }
  wrap.style.display = 'block';
  wrap.innerHTML = `<div class="link-preview-loading"><div class="spinner" style="width:14px;height:14px;border-width:2px"></div> Carregando prévia…</div>`;
  try {
    const res  = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}&meta=false`);
    const json = await res.json();
    if (json.status !== 'success') throw new Error('no data');
    const data = {
      url,
      title:       json.data.title || '',
      description: json.data.description || '',
      image:       json.data.image?.url || json.data.logo?.url || '',
      domain:      new URL(url).hostname.replace(/^www\./, '')
    };
    _lpCache.set(url, data);
    renderLinkPreview(data);
  } catch {
    _linkPreview = null;
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
}

function renderLinkPreview(data) {
  _linkPreview = data;
  const wrap = document.getElementById('link-preview-wrap');
  if (!wrap) return;
  wrap.style.display = 'block';
  wrap.innerHTML = `<div class="link-preview-composer">
    <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="link-preview-card">
      ${data.image ? `<img class="link-preview-img" src="${sanitize(data.image)}" loading="lazy" onerror="this.style.display='none'" alt="">` : ''}
      <div class="link-preview-body">
        <div class="link-preview-domain">${sanitize(data.domain)}</div>
        <div class="link-preview-title">${sanitize(data.title)}</div>
        ${data.description ? `<div class="link-preview-desc">${sanitize(data.description)}</div>` : ''}
      </div>
    </a>
    <button class="link-preview-dismiss" onclick="dismissLinkPreview()" title="Remover prévia">×</button>
  </div>`;
}

function hideLinkPreview() {
  clearTimeout(_lpTimer);
  const wrap = document.getElementById('link-preview-wrap');
  if (wrap) { wrap.style.display = 'none'; wrap.innerHTML = ''; }
  _linkPreview = null;
}

function dismissLinkPreview() {
  hideLinkPreview();
  _linkPreview = false; // false = intentionally dismissed, won't re-fetch
}

// ── Create post ────────────────────────────────────────────────
async function createPost() {
  const text = document.getElementById('post-text').value.trim();
  if (!text && !_postImageFiles.length && !_postVideoFile && !_pollActive) return showToast('Escreva algo, adicione uma imagem, vídeo ou crie uma enquete.');
  if (text.length > 2000) return showToast('Post muito longo. Máximo 2000 caracteres.');
  if (!checkRateLimit('post_' + currentUser.uid, 3, 60000))
    return showToast('Muitos posts seguidos. Aguarde um momento.');
  const btn = document.getElementById('post-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Publicando…';
  const reset = () => { btn.disabled = false; btn.innerHTML = '<i class="ti ti-send"></i> Publicar'; };
  try {
    // Multiple images or video
    let images = [];
    let videoURL = null;
    if (_postVideoFile) {
      try {
        btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Enviando vídeo…';
        videoURL = await uploadVideoToCloudinary(_postVideoFile);
      } catch(e) { showToast('Erro ao enviar vídeo. Tente novamente.'); reset(); return; }
    } else if (_postImageFiles.length) {
      try { images = await Promise.all(_postImageFiles.map(f => uploadToCloudinary(f))); }
      catch(e) { showToast(e.name === 'AbortError' ? 'Upload demorou demais.' : 'Erro ao enviar imagem.'); reset(); return; }
    }
    const hashtags = [...new Set((text.match(/#(\w+)/g)||[]).map(t => t.slice(1).toLowerCase()))];
    const postData = {
      text: text || '',
      images,
      imageURL: images[0] || null,
      videoURL: videoURL || null,
      authorId:       currentUser.uid,
      authorName:     currentUser.displayName,
      authorPhoto:    currentUser.photoURL || null,
      authorVerified: (await getUserData(currentUser.uid))?.isVerified || false,
      likes:        [],
      bookmarks:    [],
      reactions:    {},
      commentsCount: 0,
      privacy:      PRIVACY[_privacyIdx].v,
      hashtags,
      linkPreview:  (_linkPreview && _linkPreview !== false) ? _linkPreview : null,
      createdAt:    firebase.firestore.FieldValue.serverTimestamp()
    };
    // Poll
    if (_pollActive) {
      const opts = ['poll-opt-1','poll-opt-2','poll-opt-3','poll-opt-4']
        .map(id => document.getElementById(id)?.value.trim()).filter(Boolean);
      if (opts.length < 2) { showToast('A enquete precisa de pelo menos 2 opções.'); reset(); return; }
      postData.poll = { options: opts.map(t => ({ text: t, votes: [] })) };
    }
    // ── Moderação de conteúdo (pré-publicação) ─────────────────
    if (text.trim()) {
      btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Verificando conteúdo…';
      try {
        const modRes = await fetch('https://nexus-social-fawn.vercel.app/api/moderate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const mod = modRes.ok ? await modRes.json() : { decision: 'allow' };
        if (mod.decision === 'block') {
          showToast('Publicação bloqueada: ' + (mod.reason || 'o conteúdo viola as diretrizes da plataforma.'));
          reset(); return;
        }
        postData.modStatus     = mod.decision === 'flag' ? 'flagged' : 'approved';
        postData.modReason     = mod.reason     || '';
        postData.modCategories = mod.categories || [];
        if (mod.decision === 'flag') {
          showToast('Seu post foi sinalizado para revisão e ficará visível apenas para você até a aprovação.');
        }
      } catch (_e) {
        // Falha na API de moderação: marcar como pendente; scanner de fundo revisará
        postData.modStatus = 'pending';
      }
    } else {
      postData.modStatus = 'approved';
    }
    btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Publicando…';

    const docRef = await db.collection('posts').add(postData);
    // @mention notifications
    const mentionWords = [...new Set((text.match(/@(\w+)/g)||[]).map(m => m.slice(1).toLowerCase()))];
    if (mentionWords.length && _friendsList.length) {
      const postLink = `${location.origin}/${PAGES}post.html?id=${docRef.id}`;
      for (const f of _friendsList) {
        if (f.uid === currentUser.uid) continue;
        const nameParts = (f.displayName||'').toLowerCase().split(/\s+/);
        const username  = (f.username||'').toLowerCase();
        if (mentionWords.some(m => nameParts.some(p => p.startsWith(m)) || username === m)) {
          createNotification(f.uid, 'mention', {
            message: `${currentUser.displayName} mencionou você em um post.`,
            link: postLink,
            fromUid:  currentUser.uid,
            fromName: currentUser.displayName
          });
        }
      }
    }
    document.getElementById('post-text').value = '';
    _postVideoFile = null;
    removePostImage();
    hideLinkPreview();
    // Reset poll
    if (_pollActive) {
      _pollActive = false;
      ['poll-opt-1','poll-opt-2','poll-opt-3','poll-opt-4'].forEach(id => {
        const el = document.getElementById(id); if (el) el.value = '';
      });
      document.getElementById('poll-form').style.display = 'none';
      const pb = document.getElementById('poll-btn'); if (pb) pb.style.color = '';
    }
    showToast('Post publicado!');
  } catch(e) {
    console.error(e);
    showToast('Erro ao publicar. Tente novamente.');
  }
  reset();
}

// ── Parse post text (rich text + hashtags + mentions) ──────────
function parsePostText(text) {
  return sanitize(text)
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/_(.*?)_/g, '<em>$1</em>')
    .replace(/#(\w+)/g, `<a href="${PAGES}busca.html?tab=posts&q=%23$1" class="hashtag">#$1</a>`)
    .replace(/@(\w+)/g, `<a href="${PAGES}busca.html?q=$1" class="mention">@$1</a>`);
}

// ── Load posts (realtime, first 20) ───────────────────────────
function filterPostDocs(docs) {
  if (_feedTab === 'friends') {
    docs = docs.filter(d => {
      const a = d.data().authorId;
      return a === currentUser.uid || _friendIds.has(a);
    });
  }
  return docs.filter(d => {
    const p = d.data();
    if (_mutedUsers.includes(p.authorId)) return false;
    // Esconder posts removidos pela moderação para todos
    if (p.modStatus === 'removed') return false;
    // Esconder posts sinalizados para outros usuários (autor ainda vê o próprio)
    if (p.modStatus === 'flagged' && p.authorId !== currentUser.uid) return false;
    const prv = p.privacy || 'public';
    if (prv === 'private') return p.authorId === currentUser.uid;
    if (prv === 'friends') return p.authorId === currentUser.uid || _friendIds.has(p.authorId);
    return true;
  });
}

function loadPosts() {
  if (_postsUnsub) { _postsUnsub(); _postsUnsub = null; }
  _lastPostDoc   = null;
  _extraPostsHTML = '';
  const list = document.getElementById('posts-list');
  list.innerHTML = '<div class="loading-screen" style="min-height:200px"><div class="spinner"></div></div>';

  let baseQuery = db.collection('posts').orderBy('createdAt', 'desc');
  if (_hashtagFilter) {
    baseQuery = db.collection('posts')
      .where('hashtags', 'array-contains', _hashtagFilter.toLowerCase())
      .orderBy('createdAt', 'desc');
  }

  _postsUnsub = baseQuery.limit(20).onSnapshot(snap => {
      _lastPostDoc = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
      const docs = filterPostDocs(snap.docs);

      if (!docs.length && !_extraPostsHTML) {
        list.innerHTML = snap.empty
          ? `<div class="empty-state card"><i class="ti ti-news-off"></i><p>Nenhum post ainda. Seja o primeiro!</p></div>`
          : `<div class="empty-state card"><i class="ti ti-users"></i><p>Nenhum post dos seus amigos ainda.</p></div>`;
        return;
      }

      const mainHTML = docs.map(d => postHTML(d.id, d.data())).join('');
      list.innerHTML = `<div class="card" id="posts-container">${mainHTML}${_extraPostsHTML}</div>
        <div id="infinite-sentinel" style="height:1px;margin-top:.5rem"></div>`;
      if (snap.docs.length === 20) _observeSentinel();
    }, err => {
      console.error('loadPosts:', err);
      list.innerHTML = `<div class="empty-state card"><i class="ti ti-wifi-off"></i><p>Erro ao carregar posts.</p></div>`;
    });
}

let _infiniteObserver = null;
let _loadingMore = false;

function _observeSentinel() {
  if (_infiniteObserver) _infiniteObserver.disconnect();
  const sentinel = document.getElementById('infinite-sentinel');
  if (!sentinel) return;
  _infiniteObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && !_loadingMore) loadMorePosts();
  }, { rootMargin: '200px' });
  _infiniteObserver.observe(sentinel);
}

async function loadMorePosts() {
  if (!_lastPostDoc || _loadingMore) return;
  _loadingMore = true;
  const sentinel = document.getElementById('infinite-sentinel');
  if (sentinel) sentinel.innerHTML = '<i class="ti ti-loader-2 ti-spin" style="display:block;text-align:center;padding:.75rem;font-size:1.25rem;color:var(--text-muted)"></i>';
  try {
    let moreQuery = _hashtagFilter
      ? db.collection('posts').where('hashtags', 'array-contains', _hashtagFilter.toLowerCase()).orderBy('createdAt', 'desc')
      : db.collection('posts').orderBy('createdAt', 'desc');
    const snap = await moreQuery.startAfter(_lastPostDoc).limit(20).get();

    _lastPostDoc = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
    const docs = filterPostDocs(snap.docs);

    if (docs.length) {
      const newHTML = docs.map(d => postHTML(d.id, d.data())).join('');
      _extraPostsHTML += newHTML;
      document.getElementById('posts-container')?.insertAdjacentHTML('beforeend', newHTML);
    }

    if (sentinel) sentinel.innerHTML = '';
    if (_lastPostDoc && snap.docs.length === 20) {
      _observeSentinel();
    } else if (_infiniteObserver) {
      _infiniteObserver.disconnect();
    }
  } catch(e) {
    if (sentinel) sentinel.innerHTML = '';
    showToast('Erro ao carregar mais posts.');
  } finally {
    _loadingMore = false;
  }
}

// ── Post HTML ──────────────────────────────────────────────────
function postHTML(id, p) {
  const cl  = getAvatarColor(p.authorId);
  const av  = p.authorPhoto
    ? `<img src="${p.authorPhoto}" alt="${p.authorName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : getInitials(p.authorName);
  const rawtext = (p.text || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');

  // Reactions
  const rxns     = p.reactions || {};
  const myRxn    = REACTIONS.find(e => (rxns[e]||[]).includes(currentUser?.uid));
  const totalRxn = REACTIONS.reduce((s, e) => s + (rxns[e]||[]).length, 0) + (p.likes||[]).length;
  const topEmoji = REACTIONS.filter(e => (rxns[e]||[]).length).sort((a,b) => (rxns[b]||[]).length-(rxns[a]||[]).length).slice(0,2);
  const bookmarked = (p.bookmarks||[]).includes(currentUser?.uid);

  const privOpt = PRIVACY.find(o => o.v === (p.privacy||'public')) || PRIVACY[0];
  const pickerBtns = REACTIONS.map(e =>
    `<button class="reaction-emoji-btn" onclick="event.stopPropagation();setReaction('${id}','${e}')" title="${e}">${e}</button>`
  ).join('');

  return `
  <div class="post" id="post-${id}" data-rawtext="${rawtext}">
    <div class="post-header">
      <div class="avatar avatar-40" style="background:${cl.bg};color:${cl.color};cursor:pointer;position:relative"
           onclick="location.href='pages/perfil.html?uid=${p.authorId}'">${av}</div>
      <div class="post-meta">
        <div class="post-author">${sanitize(p.authorName||'Usuário')}${p.authorVerified ? '<span class="verified-badge" title="Conta verificada"><i class="ti ti-check" style="font-size:8px"></i></span>' : ''}</div>
        <div class="post-time">
          ${timeAgo(p.createdAt)}
          <span class="post-privacy-badge" title="${privOpt.label}">
            <i class="ti ${privOpt.icon}" style="font-size:10px" aria-hidden="true"></i>
          </span>
        </div>
      </div>
      <div style="display:flex;gap:.1rem;margin-left:auto">
        ${p.authorId === currentUser?.uid ? `
          <button class="btn btn-icon" onclick="startEditPost('${id}')" title="Editar">
            <i class="ti ti-pencil" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i>
          </button>
          <button class="btn btn-icon" onclick="deletePost('${id}')" title="Excluir">
            <i class="ti ti-trash" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i>
          </button>
        ` : `
          <button class="btn btn-icon" onclick="openPostMenu(event,'${id}','${sanitize(p.authorName||'').replace(/'/g,"\\'")}','${p.authorId}')" title="Mais opções">
            <i class="ti ti-dots" style="font-size:17px;color:var(--text-muted)" aria-hidden="true"></i>
          </button>
        `}
      </div>
    </div>
    ${p.repostOf ? repostBlockHTML(p.repostOf) : ''}
    ${p.text ? `<div class="post-body">${parsePostText(p.text)}</div>` : ''}
    ${p.videoURL ? `<video src="${p.videoURL}" controls preload="metadata" style="width:100%;max-height:420px;border-radius:var(--radius-md);background:#000;display:block;margin-bottom:.5rem" onclick="event.stopPropagation()"></video>` : (p.images?.length > 1) ? carouselHTML(id, p.images) : (p.imageURL ? `<img class="post-image" src="${p.imageURL}" alt="Imagem" loading="lazy" onerror="this.style.display='none'" onclick="openLightbox([this.src])" style="cursor:zoom-in">` : '')}
    ${p.poll ? pollHTML(id, p.poll) : ''}
    ${p.linkPreview ? linkPreviewCardHTML(p.linkPreview) : ''}
    ${topEmoji.length || totalRxn ? `
      <div class="reaction-summary" style="cursor:pointer" onclick="showLikers('${id}')" title="Ver quem curtiu">
        ${topEmoji.map(e => `<span>${e}</span>`).join('')}
        ${totalRxn ? `<span style="color:var(--text-secondary)">${totalRxn}</span>` : ''}
      </div>` : ''}
    <div class="post-actions">
      <div class="reaction-wrap">
        <button class="post-action-btn${myRxn ? ' reacted' : ''}"
                onclick="setReaction('${id}','${myRxn||'❤️'}')">
          ${myRxn || '<i class="ti ti-heart" aria-hidden="true"></i>'}
          ${totalRxn || ''}
        </button>
        <div class="reaction-picker">${pickerBtns}</div>
      </div>
      <button class="post-action-btn" onclick="location.href='pages/post.html?id=${id}'">
        <i class="ti ti-message-circle" aria-hidden="true"></i> ${p.commentsCount||0}
      </button>
      <button class="post-action-btn${bookmarked?' bookmarked':''}"
              onclick="toggleBookmark('${id}')" title="${bookmarked?'Remover dos salvos':'Salvar'}">
        <i class="ti ti-bookmark" aria-hidden="true"></i>
      </button>
      <button class="post-action-btn" onclick="sharePost('${id}')">
        <i class="ti ti-share-3" aria-hidden="true"></i>
      </button>
      <span class="post-action-btn" style="cursor:default;pointer-events:none;opacity:.6;font-size:11.5px;margin-left:auto">
        <i class="ti ti-eye" aria-hidden="true"></i> ${p.views||0}
      </span>
    </div>
  </div>`;
}

// ── Post menu (3-dot) ─────────────────────────────────────────
function openPostMenu(event, postId, authorName, authorId) {
  event.stopPropagation();
  document.querySelectorAll('.post-ctx-menu').forEach(m => m.remove());
  const isMuted = _mutedUsers.includes(authorId);
  const menu = document.createElement('div');
  menu.className = 'post-ctx-menu';
  menu.style.cssText = [
    'position:absolute;right:0;top:100%;z-index:50',
    'background:var(--surface);border:1px solid var(--border)',
    'border-radius:var(--radius-md);box-shadow:var(--shadow-lg)',
    'min-width:180px;overflow:hidden;animation:panelIn .16s ease'
  ].join(';');
  menu.innerHTML = `
    <button onclick="openReportModal('${postId}');this.closest('.post-ctx-menu').remove()" style="width:100%;text-align:left;padding:.65rem 1rem;background:none;border:none;cursor:pointer;font-size:13.5px;color:var(--text-primary);font-family:var(--font-sans);display:flex;align-items:center;gap:.6rem;transition:background var(--transition);" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background='none'">
      <i class="ti ti-flag" style="font-size:15px;color:var(--rose-400)"></i> Denunciar post
    </button>
    <button onclick="${isMuted?`unmuteUser('${authorId}')`:`muteUser('${authorId}','${authorName.replace(/'/g,"\\'")}')`};this.closest('.post-ctx-menu').remove()" style="width:100%;text-align:left;padding:.65rem 1rem;background:none;border:none;cursor:pointer;font-size:13.5px;color:var(--text-primary);font-family:var(--font-sans);display:flex;align-items:center;gap:.6rem;transition:background var(--transition);" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background='none'">
      <i class="ti ti-${isMuted?'volume':'volume-off'}" style="font-size:15px;color:var(--text-muted)"></i> ${isMuted?'Dessilenciar':'Silenciar'} @${sanitize(authorName).split(' ')[0]}
    </button>`;
  const btn = event.currentTarget;
  btn.style.position = 'relative';
  btn.appendChild(menu);
  const removeMenu = () => { menu.remove(); document.removeEventListener('click', close); document.removeEventListener('keydown', closeOnEsc); };
  const close = e => { if (!menu.contains(e.target)) removeMenu(); };
  const closeOnEsc = e => { if (e.key === 'Escape') removeMenu(); };
  setTimeout(() => { document.addEventListener('click', close); document.addEventListener('keydown', closeOnEsc); }, 50);
}

function muteUser(uid, name) {
  if (!_mutedUsers.includes(uid)) {
    _mutedUsers.push(uid);
    localStorage.setItem('nexus-muted', JSON.stringify(_mutedUsers));
  }
  showToast(`@${name.split(' ')[0]} silenciado. Posts não aparecerão no feed.`);
  loadPosts();
}
function unmuteUser(uid) {
  _mutedUsers = _mutedUsers.filter(u => u !== uid);
  localStorage.setItem('nexus-muted', JSON.stringify(_mutedUsers));
  showToast('Usuário dessilenciado.');
  loadPosts();
}

// ── Ver quem curtiu ────────────────────────────────────────────
async function showLikers(postId) {
  const snap = await db.collection('posts').doc(postId).get();
  if (!snap.exists) return;
  const p = snap.data();
  const allUids = new Set([...(p.likes||[])]);
  const rxns = p.reactions || {};
  Object.values(rxns).forEach(arr => arr.forEach(uid => allUids.add(uid)));
  if (!allUids.size) { showToast('Nenhuma curtida ainda.'); return; }

  const uids = [...allUids].slice(0, 30);
  const usersData = await Promise.all(uids.map(uid => getUserData(uid)));

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">Curtidas (${allUids.size})</span>
      <button class="btn btn-icon" onclick="this.closest('.modal-overlay').remove()"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.25rem;max-height:360px;overflow-y:auto">
      ${usersData.filter(Boolean).map(u => {
        const cl = getAvatarColor(u.uid);
        const av = u.photoURL
          ? `<img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : `<span style="color:${cl.color}">${getInitials(u.displayName)}</span>`;
        const rxnEmoji = Object.entries(rxns).find(([e,arr]) => arr.includes(u.uid))?.[0] || '❤️';
        return `<div class="search-result-item" style="cursor:pointer;border-radius:var(--radius-md)" onclick="location.href='pages/perfil.html?uid=${u.uid}'">
          <div class="avatar avatar-40" style="background:${cl.bg}">${av}</div>
          <div class="search-result-info">
            <div class="search-result-name">${sanitize(u.displayName||'Usuário')}</div>
          </div>
          <span style="font-size:18px">${rxnEmoji}</span>
        </div>`;
      }).join('')}
      ${allUids.size > 30 ? `<p style="text-align:center;font-size:12px;color:var(--text-muted);padding:.5rem">e mais ${allUids.size - 30} pessoas</p>` : ''}
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

// ── Emoji reactions ────────────────────────────────────────────
async function setReaction(postId, emoji) {
  if (!currentUser) return;
  const ref  = db.collection('posts').doc(postId);
  const snap = await ref.get();
  const p    = snap.data();
  const rxns = p.reactions || {};

  const already = (rxns[emoji]||[]).includes(currentUser.uid);
  const updates = {};

  // Remove from all reaction arrays + legacy likes
  REACTIONS.forEach(e => {
    if ((rxns[e]||[]).includes(currentUser.uid))
      updates[`reactions.${e}`] = firebase.firestore.FieldValue.arrayRemove(currentUser.uid);
  });
  if ((p.likes||[]).includes(currentUser.uid))
    updates.likes = firebase.firestore.FieldValue.arrayRemove(currentUser.uid);

  // Add new reaction only if different from current
  if (!already) {
    updates[`reactions.${emoji}`] = firebase.firestore.FieldValue.arrayUnion(currentUser.uid);
    if (p.authorId !== currentUser.uid) {
      createNotification(p.authorId, 'post_like', {
        message: `${currentUser.displayName} reagiu ${emoji} ao seu post.`,
        link: `/pages/post.html?id=${postId}`,
        fromUid: currentUser.uid,
        fromName: currentUser.displayName
      });
    }
  }
  await ref.update(updates);
}

// ── Carousel ───────────────────────────────────────────────────
function carouselHTML(postId, images) {
  if (!images || !images.length) return '';
  if (images.length === 1) return `<img class="post-image" src="${images[0]}" loading="lazy" onclick="openLightbox(${JSON.stringify(images)})" style="cursor:zoom-in">`;
  const dots = images.map((_,i) => `<span class="carousel-dot${i===0?' active':''}"></span>`).join('');
  const imgs = images.map((url,i) => `<img class="carousel-img" src="${url}" loading="lazy" onclick="event.stopPropagation();openLightbox(${JSON.stringify(images)},${i})">`).join('');
  return `<div class="post-carousel" id="carousel-${postId}">
    <div class="carousel-track">${imgs}</div>
    <button class="carousel-btn prev" onclick="event.stopPropagation();_carouselNav('${postId}',-1)">‹</button>
    <button class="carousel-btn next" onclick="event.stopPropagation();_carouselNav('${postId}',1)">›</button>
    <div class="carousel-dots">${dots}</div>
  </div>`;
}

function _carouselNav(id, dir) {
  const c = document.getElementById(`carousel-${id}`);
  if (!c) return;
  const imgs = c.querySelectorAll('.carousel-img');
  if (_carouselState[id] === undefined) _carouselState[id] = 0;
  _carouselState[id] = Math.max(0, Math.min(_carouselState[id] + dir, imgs.length - 1));
  c.querySelector('.carousel-track').style.transform = `translateX(-${_carouselState[id] * 100}%)`;
  c.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === _carouselState[id]));
}

function linkPreviewCardHTML(lp) {
  if (!lp || !lp.url) return '';
  return `<a href="${lp.url}" target="_blank" rel="noopener noreferrer" class="link-preview-card" onclick="event.stopPropagation()">
    ${lp.image ? `<img class="link-preview-img" src="${sanitize(lp.image)}" loading="lazy" onerror="this.style.display='none'" alt="">` : ''}
    <div class="link-preview-body">
      <div class="link-preview-domain">${sanitize(lp.domain||'')}</div>
      <div class="link-preview-title">${sanitize(lp.title||'')}</div>
      ${lp.description ? `<div class="link-preview-desc">${sanitize(lp.description)}</div>` : ''}
    </div>
  </a>`;
}

function repostBlockHTML(rp) {
  return `<div class="repost-block">
    <div class="repost-label"><i class="ti ti-repeat" aria-hidden="true"></i> Repostado de ${sanitize(rp.authorName||'Usuário')}</div>
    ${rp.text ? `<div style="font-size:13px;color:var(--text-secondary);line-height:1.5">${sanitize(rp.text).slice(0,200)}${rp.text.length>200?'…':''}</div>` : ''}
    ${rp.imageURL ? `<img src="${rp.imageURL}" style="width:100%;border-radius:6px;margin-top:.4rem;max-height:160px;object-fit:cover">` : ''}
  </div>`;
}

function pollHTML(postId, poll) {
  const totalVotes = (poll.options||[]).reduce((s, o) => s + (o.votes||[]).length, 0);
  const myVoteIdx  = (poll.options||[]).findIndex(o => (o.votes||[]).includes(currentUser?.uid));
  const bars = (poll.options||[]).map((opt, i) => {
    const cnt = (opt.votes||[]).length;
    const pct = totalVotes ? Math.round(cnt / totalVotes * 100) : 0;
    const isMine = i === myVoteIdx;
    return `<button class="poll-bar${isMine?' my-vote':''}" onclick="votePoll('${postId}',${i})">
      <div class="poll-bar-fill" style="width:${pct}%"></div>
      <span class="poll-bar-text">${sanitize(opt.text)}</span>
      <span class="poll-bar-pct">${pct}%</span>
    </button>`;
  }).join('');
  return `<div style="margin:.4rem 0 .6rem">${bars}
    <div style="font-size:11px;color:var(--text-muted)">${totalVotes} voto${totalVotes!==1?'s':''}</div>
  </div>`;
}

async function votePoll(postId, optionIdx) {
  const ref  = db.collection('posts').doc(postId);
  const snap = await ref.get();
  const poll = snap.data()?.poll;
  if (!poll) return;
  const updates = {};
  (poll.options||[]).forEach((opt, i) => {
    if ((opt.votes||[]).includes(currentUser.uid))
      updates[`poll.options.${i}.votes`] = firebase.firestore.FieldValue.arrayRemove(currentUser.uid);
  });
  updates[`poll.options.${optionIdx}.votes`] = firebase.firestore.FieldValue.arrayUnion(currentUser.uid);
  await ref.update(updates);
}

async function toggleBookmark(postId) {
  if (!currentUser) return;
  const ref  = db.collection('posts').doc(postId);
  const snap = await ref.get();
  const saved = (snap.data().bookmarks||[]).includes(currentUser.uid);
  await ref.update({
    bookmarks: saved
      ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  });
  showToast(saved ? 'Removido dos salvos.' : 'Post salvo!');
}

async function deletePost(postId) {
  if (!confirm('Excluir este post permanentemente?')) return;
  await db.collection('posts').doc(postId).delete();
  showToast('Post excluído.');
}

async function shareInCommunity(postId) {

        <span class="modal-title">Compartilhar em comunidade</span>

async function crossPostToCommunity(postId, commId) {
  const [postSnap, commSnap] = await Promise.all([
    db.collection('posts').doc(postId).get(),

    authorName: currentUser.displayName,

    repostOf: { postId, authorId: p.authorId, authorName: p.authorName||'Usuário', text: p.text||'', imageURL: p.imageURL||null },

// ── @Mention + #Hashtag autocomplete ──────────────────────────
function checkMentionInput(ta) {
  const textBefore = ta.value.slice(0, ta.selectionStart);

  // @mention
  const mentionMatch = textBefore.match(/@(\w*)$/);
  if (mentionMatch) {
    _mentionType  = 'mention';
    _mentionQuery = mentionMatch[1].toLowerCase();
    _mentionStart = ta.selectionStart - mentionMatch[0].length;
    const matches = _mentionQuery
      ? _friendsList.filter(f => (f.displayName||'').toLowerCase().includes(_mentionQuery)).slice(0, 6)
      : _friendsList.slice(0, 6);
    if (!matches.length) { hideMentionDropdown(); return; }
    showMentionDropdown(matches);
    return;
  }

  // #hashtag
  const hashMatch = textBefore.match(/#(\w*)$/);
  if (hashMatch && _trendingTags.length) {
    _mentionType  = 'hashtag';
    _mentionStart = ta.selectionStart - hashMatch[0].length;
    const tag     = hashMatch[1].toLowerCase();
    const matches = tag
      ? _trendingTags.filter(t => t.toLowerCase().startsWith(tag)).slice(0, 6)
      : _trendingTags.slice(0, 6);
    if (!matches.length) { hideMentionDropdown(); return; }
    showHashtagDropdown(matches);
    return;
  }

  hideMentionDropdown();
}

function showMentionDropdown(friends) {
  const dd = document.getElementById('mention-dropdown');
  if (!dd) return;
  dd.innerHTML = friends.map(f => {
    const cl = getAvatarColor(f.uid);
    const av = f.photoURL
      ? `<img src="${f.photoURL}" style="width:24px;height:24px;border-radius:50%;object-fit:cover">`
      : `<div style="width:24px;height:24px;border-radius:50%;background:${cl.bg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:${cl.color}">${getInitials(f.displayName)}</div>`;
    const safe = f.displayName.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="mention-item" onclick="insertMention('${safe}')">${av}<span>${sanitize(f.displayName)}</span></div>`;
  }).join('');
  dd.style.display = 'block';
}

function hideMentionDropdown() {
  const dd = document.getElementById('mention-dropdown');
  if (dd) dd.style.display = 'none';
  _mentionStart = -1;
  _mentionQuery = '';
}

function showHashtagDropdown(tags) {
  const dd = document.getElementById('mention-dropdown');
  if (!dd) return;
  dd.innerHTML = tags.map(tag =>
    `<div class="mention-item" onclick="insertHashtag('${tag.replace(/'/g,"\\'")}')">
      <i class="ti ti-hash" style="font-size:14px;color:var(--purple-600)"></i>
      <span style="color:var(--purple-600);font-weight:500">#${sanitize(tag)}</span>
    </div>`
  ).join('');
  dd.style.display = 'block';
}

function insertHashtag(tag) {
  const ta = document.getElementById('post-text');
  if (!ta || _mentionStart < 0) { hideMentionDropdown(); return; }
  const cursor = ta.selectionStart;
  const before = ta.value.slice(0, _mentionStart);
  const after  = ta.value.slice(cursor);
  ta.value = before + `#${tag} ` + after;
  const newCursor = _mentionStart + tag.length + 2;
  ta.setSelectionRange(newCursor, newCursor);
  ta.focus();
  hideMentionDropdown();
  updateCharCount();
}

function insertMention(name) {
  const ta = document.getElementById('post-text');
  if (!ta || _mentionStart < 0) { hideMentionDropdown(); return; }
  const cursor = ta.selectionStart;
  const before = ta.value.slice(0, _mentionStart);
  const after  = ta.value.slice(cursor);
  const mention = `@${name}`;
  ta.value = before + mention + ' ' + after;
  const newCursor = _mentionStart + mention.length + 1;
  ta.setSelectionRange(newCursor, newCursor);
  ta.focus();
  hideMentionDropdown();
  updateCharCount();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.composer-box') && !e.target.closest('#mention-dropdown')) hideMentionDropdown();
});

async function loadTrendingHashtags() {
  const el = document.getElementById('trending-hashtags');
  if (!el) return;
  try {
    const snap = await db.collection('posts').orderBy('createdAt', 'desc').limit(100).get();
    const counts = {};
    snap.docs.forEach(doc => {
      (doc.data().hashtags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
    });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 7);
    _trendingTags = sorted.map(([tag]) => tag);
    if (!sorted.length) {
      el.innerHTML = `<p style="font-size:12px;color:var(--text-muted)">Nenhuma hashtag ainda.</p>`;
      return;
    }
    el.innerHTML = sorted.map(([tag, count]) =>
      `<div style="display:flex;align-items:center;padding:.3rem 0;cursor:pointer;border-bottom:0.5px solid var(--border)"
            onclick="location.href='${PAGES}busca.html?tab=posts&q=%23${encodeURIComponent(tag)}'">

        <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${count} post${count > 1 ? 's' : ''}</span>
      </div>`
    ).join('');
  } catch(e) {
    if (el) el.innerHTML = `<p style="font-size:12px;color:var(--text-muted)">—</p>`;
  }
}

// ── Birthday widget ────────────────────────────────────────────
async function loadBirthdayWidget() {
  const widget = document.getElementById('birthdays-widget');
  const list   = document.getElementById('birthdays-list');
  if (!widget || !list) return;
  try {
    const now = new Date();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const todayStr = `${mm}-${dd}`; // MM-DD format for birthday matching

    const friendsSnap = await db.collection('friendships')
      .where('users', 'array-contains', currentUser.uid).get();
    const friendUids = [];
    friendsSnap.docs.forEach(d => d.data().users.forEach(u => { if (u !== currentUser.uid) friendUids.push(u); }));
    if (!friendUids.length) return;

    const chunks = [];
    for (let i = 0; i < friendUids.length; i += 10) chunks.push(friendUids.slice(i, i + 10));
    const friendDocs = (await Promise.all(chunks.map(c =>
      db.collection('users').where(firebase.firestore.FieldPath.documentId(), 'in', c).get()
    ))).flatMap(s => s.docs);

    const birthdays = friendDocs.filter(d => {
      const bd = d.data().birthdate;
      if (!bd) return false;
      const parts = bd.split('-');
      if (parts.length < 3) return false;
      return `${parts[1]}-${parts[2]}` === todayStr;
    });

    if (!birthdays.length) return;
    widget.style.display = '';
    list.innerHTML = birthdays.map(d => {
      const u = d.data();
      const av = u.photoURL
        ? `<img src="${u.photoURL}" style="width:32px;height:32px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'">`
        : `<div style="width:32px;height:32px;border-radius:50%;background:${getAvatarColor(d.id)};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff">${(u.displayName||'?')[0].toUpperCase()}</div>`;
      return `<div style="display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:0.5px solid var(--border);cursor:pointer"
                   onclick="location.href='${PAGES}perfil.html?uid=${d.id}'">
        ${av}
        <div>
          <div style="font-size:13px;font-weight:600">${sanitize(u.displayName||'Usuário')}</div>
          <div style="font-size:11px;color:var(--text-muted)">Hoje é aniversário!</div>
        </div>
      </div>`;
    }).join('');
  } catch(_) {}
}

// ── Stories ────────────────────────────────────────────────────
const ST_VIEWED_KEY  = 'nx_sv_';
const ST_CACHE_KEY   = 'nx_stories_cache';
const ST_CACHE_TTL   = 5 * 60 * 1000; // 5 min

async function loadStories() {
  const bar = document.getElementById('stories-bar');
  if (!bar) return;
  try {
    // Use sessionStorage cache when fresh
    const cached = (() => { try { return JSON.parse(sessionStorage.getItem(ST_CACHE_KEY)); } catch { return null; } })();
    let docs;
    if (cached && Date.now() - cached.ts < ST_CACHE_TTL) {
      docs = cached.docs;
    } else {
      const snap = await db.collection('stories')
        .orderBy('createdAt', 'desc').limit(60).get();
      docs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      try { sessionStorage.setItem(ST_CACHE_KEY, JSON.stringify({ ts: Date.now(), docs })); } catch {}
    }

    const now = Date.now();
    const byUser = {};
    docs.forEach(({ id, data: d }) => {
      if (d.expiresAt && (d.expiresAt.toMillis ? d.expiresAt.toMillis() : d.expiresAt._seconds * 1000) < now) return;
      if (!byUser[d.uid]) byUser[d.uid] = { info: d, ids: [] };
      byUser[d.uid].ids.push(id);
    });

    const myInfo    = byUser[currentUser.uid];
    const others    = Object.values(byUser).filter(u => u.info.uid !== currentUser.uid);
    const userData  = await getUserData(currentUser.uid) || {};
    const cl        = getAvatarColor(currentUser.uid);
    const myAv      = userData.photoURL
      ? `<img src="${userData.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<div style="width:100%;height:100%;background:${cl.bg};display:flex;align-items:center;justify-content:center"><span style="color:${cl.color};font-weight:600;font-size:16px">${getInitials(userData.displayName)}</span></div>`;

    let html = '';

    // My story (always first)
    if (myInfo) {
      const seen = localStorage.getItem(ST_VIEWED_KEY + myInfo.ids[0]);
      const idsJson = JSON.stringify(myInfo.ids).replace(/"/g,'&quot;');
      html += `<div class="story-thumb" onclick="viewStory('${myInfo.ids[0]}', ${idsJson}, 0)">
        <div class="story-ring${seen?' seen':' unseen'}">
          <div class="story-ring-inner">${myAv}
            <div class="story-add-icon" onclick="event.stopPropagation();openStoryModal()">+</div>
          </div>
        </div>
        <div class="story-name">Meu story</div>
      </div>`;
    } else {
      html += `<div class="story-thumb" onclick="openStoryModal()">
        <div class="story-ring add">
          <div class="story-ring-inner">${myAv}
            <div class="story-add-icon">+</div>
          </div>
        </div>
        <div class="story-name">Criar story</div>
      </div>`;
    }

    others.forEach(u => {
      const d  = u.info;
      const uc = getAvatarColor(d.uid);
      const av = d.photoURL
        ? `<img src="${d.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : `<div style="width:100%;height:100%;background:${uc.bg};display:flex;align-items:center;justify-content:center"><span style="color:${uc.color};font-weight:600;font-size:16px">${getInitials(d.displayName)}</span></div>`;
      const seen = localStorage.getItem(ST_VIEWED_KEY + u.ids[0]);
      const idsJson = JSON.stringify(u.ids).replace(/"/g,'&quot;');
      html += `<div class="story-thumb" onclick="viewStory('${u.ids[0]}', ${idsJson}, 0)">
        <div class="story-ring${seen?' seen':' unseen'}">
          <div class="story-ring-inner">${av}</div>
        </div>
        <div class="story-name">${sanitize((d.displayName||'').split(' ')[0]||'Usuário')}</div>
      </div>`;
    });

    bar.innerHTML = html;
  } catch(e) {
    console.error('Stories:', e);
    bar.innerHTML = `<div class="story-thumb" onclick="openStoryModal()">
      <div class="story-ring add"><div class="story-ring-inner">
        <i class="ti ti-plus" style="font-size:20px;color:var(--text-muted)"></i>
      </div></div>
      <div class="story-name">Criar story</div>
    </div>`;
  }
}
